name: Authorized Aurora Firebase HML Deploy Request

on:
  push:
    branches:
      - main
    paths:
      - ".github/requests/aurora-firebase-hml.json"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: aurora-firebase-hml-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    name: Validate request and dispatch protected HML workflow
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate exact authorized request
        env:
          APPROVED_PROJECT: ${{ vars.FIREBASE_HML_PROJECT_ID }}
          REQUEST_FILE: .github/requests/aurora-firebase-hml.json
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "$APPROVED_PROJECT"
          jq -e --arg project "$APPROVED_PROJECT" '
            .requestVersion == 1 and
            .confirmation == "DEPLOY_HOMOLOGATION" and
            .projectId == $project and
            .projectId == "wmgj-hml-jfn-20260927" and
            (.authorizedScope == "PR72_APP_PRIMARY_INPUT" or .authorizedScope == "PR70_FIREBASE_NATIVE_DOCUMENTS" or .authorizedScope == "PR108_FIN_SOC_NATIVE_ROUTINES" or .authorizedScope == "PR115_HML_AUTH_CONTRACT_FIX" or .authorizedScope == "PR123_INGESTION_VERSIONING") and
            .sourceMutation == false and
            .productionMutation == false and
            .clinicalSensitiveEnabled == false and
            .publishActiveRelease == true and
            .activeReleaseReviewMode == "OWNER_DEPLOYMENT_APPROVAL" and
            (.activeReleasePreviousSha256 == "NONE" or
             (.activeReleasePreviousSha256 | test("^[a-f0-9]{64}$"))) and
            (.expectedSourceSha | test("^[a-f0-9]{40}$"))
          ' "$REQUEST_FILE" >/dev/null
          expected_source="$(jq -r '.expectedSourceSha' "$REQUEST_FILE")"
          git cat-file -e "$expected_source^{commit}"
          git merge-base --is-ancestor "$expected_source" "$GITHUB_SHA"
          current_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$current_main" = "$GITHUB_SHA"

      - name: Resolve exact CI and merged review evidence
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The request path triggers the existing push CI at this same SHA.
          # Dispatching a second run cancels it through the shared concurrency group.

          ci_run_id=""
          ci_state=""
          for attempt in $(seq 1 90); do
            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/validate-firestore-migration.yml/runs?event=push&per_page=30")"
            ci_run_id="$(jq -r --arg sha "$GITHUB_SHA" '
              [.workflow_runs[]?
                | select(.head_sha == $sha and .head_branch == "main" and .event == "push")]
              | sort_by(.created_at) | last | .id // empty
            ' <<<"$runs")"
            if [[ "$ci_run_id" =~ ^[1-9][0-9]{0,19}$ ]]; then
              ci_state="$(jq -r --argjson id "$ci_run_id" '
                .workflow_runs[] | select(.id == $id) | (.status + ":" + (.conclusion // ""))
              ' <<<"$runs")"
              case "$ci_state" in
                completed:success) break ;;
                completed:*) echo "::error::EXACT_HML_CI_FAILED state=$ci_state"; exit 51 ;;
              esac
            fi
            sleep 10
          done
          [[ "$ci_run_id" =~ ^[1-9][0-9]{0,19}$ ]] || { echo "::error::EXACT_HML_CI_NOT_FOUND"; exit 52; }
          test "$ci_state" = "completed:success"

          pulls="$(gh api -H "Accept: application/vnd.github+json" "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls")"
          review_pr="$(jq -r --arg sha "$GITHUB_SHA" '
            [.[] | select(.merged_at != null and .merge_commit_sha == $sha and .base.ref == "main"
              and .base.repo.full_name == env.GITHUB_REPOSITORY)]
            | if length == 1 then .[0].number else empty end
          ' <<<"$pulls")"
          [[ "$review_pr" =~ ^[1-9][0-9]{0,19}$ ]] || { echo "::error::EXACT_MERGED_REVIEW_PR_NOT_FOUND"; exit 53; }

          printf 'ci_run_id=%s\n' "$ci_run_id" >> "$GITHUB_OUTPUT"
          printf 'review_pr=%s\n' "$review_pr" >> "$GITHUB_OUTPUT"
          echo "AURORA_HML_EXACT_CI_RUN_ID=$ci_run_id"
          echo "AURORA_HML_EXACT_REVIEW_PR=$review_pr"

      - name: Prepare protected owner-origin deployment at exact main SHA
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_FILE: .github/requests/aurora-firebase-hml.json
          CI_RUN_ID: ${{ steps.evidence.outputs.ci_run_id }}
          REVIEW_PR: ${{ steps.evidence.outputs.review_pr }}
        run: |
          set -euo pipefail
          project_id="$(jq -r '.projectId' "$REQUEST_FILE")"
          previous_sha256="$(jq -r '.activeReleasePreviousSha256' "$REQUEST_FILE")"
          review_mode="$(jq -r '.activeReleaseReviewMode' "$REQUEST_FILE")"
          test "$review_mode" = "OWNER_DEPLOYMENT_APPROVAL"
          # GITHUB_TOKEN dispatch creates a bot-origin child run. The publisher
          # requires the verified owner's actor, triggering_actor and approval.
          # Prepare the inputs; the authorized owner session starts that run.
          jq -nc --arg project "$project_id" --arg sha "$GITHUB_SHA" \
            --arg ci "$CI_RUN_ID" --arg pr "$REVIEW_PR" --arg mode "$review_mode" \
            --arg previous "$previous_sha256" \
            '{state:"OWNER_ORIGIN_DISPATCH_REQUIRED",workflow:"deploy-aurora-firebase.yml",ref:"main",
              inputs:{project_id:$project,deploy_confirmation:"DEPLOY_HOMOLOGATION",deployment_mode:"SHADOW_UPDATE",
                expected_main_sha:$sha,publish_active_release:"true",active_release_ci_run_id:$ci,
                active_release_review_pr:$pr,active_release_review_mode:$mode,
                active_release_previous_sha256:$previous}}'
