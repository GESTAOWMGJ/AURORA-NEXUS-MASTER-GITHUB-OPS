name: Aurora RC1.1 Recovery and Real WMGJ Ingest

on:
  push:
    branches: [main]
    paths:
      - ".github/requests/aurora-rc11-run.json"
      - ".github/workflows/aurora-rc11-recovery-real-ingest.yml"
      - "src/34_AURORA_RC11_FIRESTORE_CONTROL.gs"
      - "firebase-migration/apps-script/**"
      - "firebase-migration/functions/**"
      - "firebase-migration/firebase.json"

permissions:
  contents: read

concurrency:
  group: aurora-rc11-hml
  cancel-in-progress: true

jobs:
  rc11:
    name: Recovery -> ingest -> reconcile -> native insight
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: firebase-homologation
    permissions:
      contents: read
      id-token: write
    env:
      REQUEST_FILE: .github/requests/aurora-rc11-run.json
      APPS_SCRIPT_ID: 1_fQPqaq0EjaugyIF6jyuENDhJ2c2oTFm1kC-wdjmfaDqyRzy_uqwtiSW
      REGION: southamerica-east1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Validate immutable RC1.1 request
        env:
          APPROVED_PROJECT: ${{ vars.FIREBASE_HML_PROJECT_ID }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          jq -e --arg project "$APPROVED_PROJECT" '
            .confirmation=="RUN_RC11_HML" and
            .projectId==$project and
            .projectId=="wmgj-hml-jfn-20260927" and
            .sourceDatabase=="(default)" and
            .restoreDatabase=="rc11-restore-20260929" and
            .competence=="2026-05" and
            .sample.invoiceNumber=="8" and
            .sample.expectedPairCount==2 and
            .productionMutation==false and
            .clinicalSensitiveEnabled==false
          ' "$REQUEST_FILE" >/dev/null

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: firebase-migration/functions/package-lock.json

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_FIREBASE_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          version: "548.0.0"
          project_id: ${{ vars.FIREBASE_HML_PROJECT_ID }}

      - name: Verify recovery prerequisites
        env:
          PROJECT_ID: ${{ vars.FIREBASE_HML_PROJECT_ID }}
          DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test "$(gcloud auth list --filter='status:ACTIVE' --format='value(account)')" = "$DEPLOY_SERVICE_ACCOUNT"
          db_json="$(gcloud firestore databases describe --database='(default)' --project "$PROJECT_ID" --format=json)"
          test "$(jq -r '.locationId' <<<"$db_json")" = "$REGION"
          test "$(jq -r '.deleteProtectionState' <<<"$db_json")" = "DELETE_PROTECTION_ENABLED"
          test "$(jq -r '.pointInTimeRecoveryEnablement' <<<"$db_json")" = "POINT_IN_TIME_RECOVERY_ENABLED"
          schedules="$(gcloud firestore backups schedules list --database='(default)' --project "$PROJECT_ID" --format=json)"
          jq -e 'type=="array" and length>=1' <<<"$schedules" >/dev/null
          backups="$(gcloud firestore backups list --project "$PROJECT_ID" --format=json)"
          backup="$(jq -r --arg source "projects/${PROJECT_ID}/databases/(default)" '[.[]|select(.state=="READY" and .database==$source)]|sort_by(.snapshotTime//"")|last|.name//empty' <<<"$backups")"
          snapshot="$(jq -r --arg name "$backup" '.[]|select(.name==$name)|.snapshotTime//empty' <<<"$backups")"
          test -n "$backup"; test -n "$snapshot"
          python3 - "$snapshot" <<'PY'
          from datetime import datetime, timezone
          import sys
          t=datetime.fromisoformat(sys.argv[1].replace("Z","+00:00"))
          age=(datetime.now(timezone.utc)-t).total_seconds()
          if age < 0 or age > 24*3600: raise SystemExit("READY_BACKUP_NOT_WITHIN_24H")
          PY
          echo "AURORA_RC11_BACKUP_RESOURCE=$backup" >> "$GITHUB_ENV"
          echo "AURORA_RC11_BACKUP_SNAPSHOT=$snapshot" >> "$GITHUB_ENV"

      - name: Execute and prove real restore
        env:
          PROJECT_ID: ${{ vars.FIREBASE_HML_PROJECT_ID }}
        run: |
          set -euo pipefail
          restore_db="$(jq -r '.restoreDatabase' "$REQUEST_FILE")"
          test "$restore_db" != "(default)"
          if gcloud firestore databases describe --database="$restore_db" --project "$PROJECT_ID" >/dev/null 2>&1; then exit 51; fi
          # Firestore database restore does not expose --async in the pinned
          # gcloud surface. Run synchronously and verify the restored database
          # explicitly before reading any document from it.
          gcloud firestore databases restore \
            --source-backup="$AURORA_RC11_BACKUP_RESOURCE" \
            --destination-database="$restore_db" \
            --project="$PROJECT_ID" \
            --format=json > "$RUNNER_TEMP/restore-result.json"
          test -s "$RUNNER_TEMP/restore-result.json"
          restored=""
          for _ in $(seq 1 40); do
            if restored="$(gcloud firestore databases describe --database="$restore_db" --project "$PROJECT_ID" --format=json 2>/dev/null)"; then
              test -n "$restored" && break
            fi
            sleep 15
          done
          test -n "$restored"
          test "$(jq -r '.locationId' <<<"$restored")" = "$REGION"
          access_token="$(gcloud auth print-access-token)"
          source_org="$(curl -fsS -H "Authorization: Bearer ${access_token}" "https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents/organizations/wmgj")"
          restored_org="$(curl -fsS -H "Authorization: Bearer ${access_token}" "https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/${restore_db}/documents/organizations/wmgj")"
          for json in "$source_org" "$restored_org"; do
            jq -e '.fields.active.booleanValue==true and .fields.environment.stringValue=="HOMOLOGATION" and .fields.clinicalSensitiveEnabled.booleanValue==false and .fields.productionMutation.booleanValue==false and .fields.sourceMutation.booleanValue==false' <<<"$json" >/dev/null
          done
          mkdir -p "$RUNNER_TEMP/rc11-evidence"
          fp="$(jq -c '{a:.fields.active.booleanValue,e:.fields.environment.stringValue,c:.fields.clinicalSensitiveEnabled.booleanValue,p:.fields.productionMutation.booleanValue,s:.fields.sourceMutation.booleanValue}' <<<"$restored_org" | sha256sum | awk '{print $1}')"
          jq -n --arg backup "$AURORA_RC11_BACKUP_RESOURCE" --arg snapshot "$AURORA_RC11_BACKUP_SNAPSHOT" --arg db "$restore_db" --arg fp "$fp" '{gate:"RESTORE_VERIFIED",backupResource:$backup,backupSnapshot:$snapshot,restoreDatabase:$db,guardrailFingerprint:$fp,verified:true}' > "$RUNNER_TEMP/rc11-evidence/recovery.json"
          if [ "$(jq -r '.deleteProtectionState//"DELETE_PROTECTION_DISABLED"' <<<"$restored")" = "DELETE_PROTECTION_ENABLED" ]; then
            gcloud firestore databases update --database="$restore_db" --project "$PROJECT_ID" --no-delete-protection --quiet
          fi
          gcloud firestore databases delete --database="$restore_db" --project "$PROJECT_ID" --quiet

      - name: Build and configure HMAC keyring
        env:
          PROJECT_ID: ${{ vars.FIREBASE_HML_PROJECT_ID }}
        run: |
          set -euo pipefail
          npm --prefix firebase-migration/functions ci
          npm --prefix firebase-migration/functions test
          npm --prefix firebase-migration/functions run build
          hmac_secret="$(openssl rand -hex 32)"; echo "::add-mask::$hmac_secret"
          key_id="apps-script-hml-rc11-20260929"
          keyring="$RUNNER_TEMP/rc11-keyring.json"
          jq -n --arg key "$key_id" --arg secret "$hmac_secret" '{($key):{active:true,secret:$secret,orgIds:["wmgj"],entityTypes:["invoice","bankTransaction"]}}' > "$keyring"
          npx --yes firebase-tools@14.17.0 functions:secrets:set WMGJ_INGEST_HMAC_KEYRING --data-file "$keyring" --project "$PROJECT_ID"
          echo "AURORA_RC11_HMAC_SECRET=$hmac_secret" >> "$GITHUB_ENV"
          echo "AURORA_RC11_HMAC_KEY_ID=$key_id" >> "$GITHUB_ENV"
          rm -f "$keyring"

      - name: Deploy exact RC1.1 HML runtime
        working-directory: firebase-migration
        env:
          PROJECT_ID: ${{ vars.FIREBASE_HML_PROJECT_ID }}
        run: |
          set -euo pipefail
          npx --yes firebase-tools@14.17.0 deploy --project "$PROJECT_ID" --non-interactive --only functions:ingestWmgjEvent,functions:runtimeWatchdog,functions:runtimeHealth,functions:auroraNexusAuthGate,functions:auroraNexusSessionLogin,functions:auroraNexusSessionLogout,functions:auroraNexusBootstrap,functions:auroraNexusNativeInsight,functions:auroraNexusAction,functions:auroraNexusRefresh,functions:auroraNexusProjectionEngine,functions:auroraNexusOrganic,hosting,firestore:rules,firestore:indexes
          echo "AURORA_RC11_INGEST_URL=https://${REGION}-${PROJECT_ID}.cloudfunctions.net/ingestWmgjEvent" >> "$GITHUB_ENV"

      - name: Push bridge and configure Apps Script
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          set -euo pipefail
          npm install -g @google/clasp
          umask 077
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          mkdir -p "$RUNNER_TEMP/build-appscript"
          cp appsscript.json "$RUNNER_TEMP/build-appscript/appsscript.json"
          cp src/*.gs "$RUNNER_TEMP/build-appscript/"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$APPS_SCRIPT_ID" > "$RUNNER_TEMP/build-appscript/.clasp.json"
          cd "$RUNNER_TEMP/build-appscript"
          clasp push --force
          params="$(jq -nc --arg url "$AURORA_RC11_INGEST_URL" --arg key "$AURORA_RC11_HMAC_KEY_ID" --arg secret "$AURORA_RC11_HMAC_SECRET" '[$url,$key,$secret]')"
          clasp run auroraRc11ConfigurarIngestao --params "$params" > "$RUNNER_TEMP/rc11-config.out"
          clasp run auroraRc11DryRunAmostra > "$RUNNER_TEMP/rc11-dry-run.out"

      - name: Send one real sample and reapply kill switch
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/build-appscript"
          clasp run auroraRc11AtivarEscritaAmostra --params '["ATIVAR_RC11_WMGJ_HML"]' >/dev/null
          trap 'clasp run auroraRc11KillSwitch >/dev/null 2>&1 || true' EXIT
          clasp run auroraRc11EnviarAmostraReal --params '["ATIVAR_RC11_WMGJ_HML"]' > "$RUNNER_TEMP/rc11-live.out"
          clasp run auroraRc11KillSwitch >/dev/null
          clasp run auroraRc11DryRunAmostra >/dev/null
          trap - EXIT

      - name: Reconcile HML and enable SHADOW projection
        env:
          PROJECT_ID: ${{ vars.FIREBASE_HML_PROJECT_ID }}
        run: |
          set -euo pipefail
          access_token="$(gcloud auth print-access-token)"
          base="https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents/organizations/wmgj"
          curl -fsS -H "Authorization: Bearer ${access_token}" "$base/invoices?pageSize=100" > "$RUNNER_TEMP/invoices.json"
          curl -fsS -H "Authorization: Bearer ${access_token}" "$base/bankTransactions?pageSize=100" > "$RUNNER_TEMP/banks.json"
          invoice_count="$(jq '[.documents[]?|select(.fields.competence.stringValue=="2026-05" and .fields.metadata.mapValue.fields.rc11Sample.booleanValue==true)]|length' "$RUNNER_TEMP/invoices.json")"
          bank_count="$(jq '[.documents[]?|select(.fields.competence.stringValue=="2026-05" and .fields.metadata.mapValue.fields.rc11Sample.booleanValue==true)]|length' "$RUNNER_TEMP/banks.json")"
          invoice_cents="$(jq -r '[.documents[]?|select(.fields.competence.stringValue=="2026-05" and .fields.metadata.mapValue.fields.rc11Sample.booleanValue==true)|(.fields.record.mapValue.fields.totalCents.integerValue|tonumber)]|add//0' "$RUNNER_TEMP/invoices.json")"
          bank_cents="$(jq -r '[.documents[]?|select(.fields.competence.stringValue=="2026-05" and .fields.metadata.mapValue.fields.rc11Sample.booleanValue==true)|(.fields.record.mapValue.fields.liquidatedAmountCents.integerValue|tonumber)]|add//0' "$RUNNER_TEMP/banks.json")"
          test "$invoice_count" -eq 1; test "$bank_count" -eq 1
          test "$invoice_cents" -eq 4950000; test "$bank_cents" -eq 4950000; test "$invoice_cents" -eq "$bank_cents"
          jq -n --argjson i "$invoice_count" --argjson b "$bank_count" '{gate:"RECONCILED",invoiceDocuments:$i,bankDocuments:$b,amountsEqual:true,differenceZero:true,sourceMutation:false}' > "$RUNNER_TEMP/rc11-evidence/reconciliation.json"
          payload='{"fields":{"projectionEnabled":{"booleanValue":true},"projectionMode":{"stringValue":"SHADOW"},"projectionCompetence":{"stringValue":"2026-05"},"productionMutation":{"booleanValue":false},"sourceMutation":{"booleanValue":false}}}'
          curl -fsS -X PATCH -H "Authorization: Bearer ${access_token}" -H 'Content-Type: application/json' --data "$payload" "${base}?updateMask.fieldPaths=projectionEnabled&updateMask.fieldPaths=projectionMode&updateMask.fieldPaths=projectionCompetence&updateMask.fieldPaths=productionMutation&updateMask.fieldPaths=sourceMutation" >/dev/null

      - name: Wait for governed projection
        env:
          PROJECT_ID: ${{ vars.FIREBASE_HML_PROJECT_ID }}
        run: |
          set -euo pipefail
          access_token="$(gcloud auth print-access-token)"
          url="https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents/organizations/wmgj/dashboardSnapshots/current"
          ready=false
          for _ in $(seq 1 40); do
            if curl -fsS -H "Authorization: Bearer ${access_token}" "$url" > "$RUNNER_TEMP/snapshot.json" 2>/dev/null && jq -e '.fields.competence.stringValue=="2026-05" and (.fields.financialCents.mapValue.fields.invoicedCents.integerValue|tonumber)==4950000 and (.fields.financialCents.mapValue.fields.receivedCents.integerValue|tonumber)==4950000 and (.fields.financialCents.mapValue.fields.outstandingCents.integerValue|tonumber)==0 and .fields.dataQuality.mapValue.fields.complete.booleanValue==true' "$RUNNER_TEMP/snapshot.json" >/dev/null 2>&1; then ready=true; break; fi
            sleep 30
          done
          test "$ready" = true

      - name: Test native intelligence against real HML data
        env:
          PROJECT_ID: ${{ vars.FIREBASE_HML_PROJECT_ID }}
          DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
          SMOKE_UID: ${{ vars.FIREBASE_HML_SMOKE_UID }}
        run: |
          set -euo pipefail
          d="$(mktemp -d "$RUNNER_TEMP/rc11-native.XXXXXX")"; trap 'rm -rf "$d"' EXIT
          access_token="$(gcloud auth print-access-token)"
          apps="$(curl -fsS -H "Authorization: Bearer ${access_token}" "https://firebase.googleapis.com/v1beta1/projects/${PROJECT_ID}/webApps?pageSize=100")"
          app_name="$(jq -r '[.apps[]?|select(.state=="ACTIVE")]|first|.name//empty' <<<"$apps")"; test -n "$app_name"
          api_key="$(curl -fsS -H "Authorization: Bearer ${access_token}" "https://firebase.googleapis.com/v1beta1/${app_name}/config" | jq -r '.apiKey//empty')"; test -n "$api_key"
          now="$(date +%s)"; exp="$((now+3000))"
          jq -nc --arg iss "$DEPLOY_SERVICE_ACCOUNT" --arg sub "$DEPLOY_SERVICE_ACCOUNT" --arg uid "$SMOKE_UID" --arg aud "https://identitytoolkit.googleapis.com/google.identity.identitytoolkit.v1.IdentityToolkit" --argjson iat "$now" --argjson exp "$exp" '{iss:$iss,sub:$sub,aud:$aud,iat:$iat,exp:$exp,uid:$uid}' > "$d/claims.json"
          gcloud iam service-accounts sign-jwt "$d/claims.json" "$d/custom.jwt" --iam-account "$DEPLOY_SERVICE_ACCOUNT" --project "$PROJECT_ID" >/dev/null
          jq -nc --arg token "$(cat "$d/custom.jwt")" '{token:$token,returnSecureToken:true}' > "$d/auth.json"
          curl -fsS -H 'Content-Type: application/json' --data-binary @"$d/auth.json" "https://identitytoolkit.googleapis.com/v1/accounts:signInWithCustomToken?key=${api_key}" > "$d/auth-response.json"
          id_token="$(jq -r '.idToken//empty' "$d/auth-response.json")"; test -n "$id_token"
          base_url="https://${PROJECT_ID}.web.app"
          jq -nc --arg idToken "$id_token" '{idToken:$idToken}' > "$d/session.json"
          curl -fsS -X POST -H 'Content-Type: application/json' -H "Origin: ${base_url}" -H 'Sec-Fetch-Site: same-origin' --cookie-jar "$d/cookies.txt" --data-binary @"$d/session.json" "${base_url}/__sessionLogin" >/dev/null
          for intent in REVENUE_RISK SLA_RISK NEXT_ACTION EXECUTIVE; do
            curl -fsS -H 'Accept: application/json' --cookie "$d/cookies.txt" "${base_url}/api/native-insight?intent=${intent}" > "$d/${intent}.json"
            jq -e '.ok==true and .insight.engine=="AURORA_NATIVE_INTELLIGENCE" and .insight.externalProviderUsed==false and .insight.source.competence=="2026-05"' "$d/${intent}.json" >/dev/null
          done
          jq -e '[.insight.findings[]?|select(.code=="REVENUE_GAP")]|length==0' "$d/REVENUE_RISK.json" >/dev/null
          jq -e '[.insight.findings[]?|select(.code=="SLA_OVERDUE")]|length==0' "$d/SLA_RISK.json" >/dev/null
          jq -n --arg r "$(jq -r '.insight.headline' "$d/REVENUE_RISK.json")" --arg s "$(jq -r '.insight.headline' "$d/SLA_RISK.json")" --arg n "$(jq -r '.insight.headline' "$d/NEXT_ACTION.json")" --arg e "$(jq -r '.insight.headline' "$d/EXECUTIVE.json")" '{gate:"NATIVE_INSIGHT_VERIFIED",externalProviderUsed:false,revenueHeadline:$r,slaHeadline:$s,nextActionHeadline:$n,executiveHeadline:$e}' > "$RUNNER_TEMP/rc11-evidence/native-intelligence.json"

      - name: Final kill switch and evidence
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/build-appscript"
          clasp run auroraRc11KillSwitch >/dev/null
          clasp run auroraRc11DryRunAmostra >/dev/null
          jq -n '{release:"1.0.0-rc.1",gate:"RC1.1",restoreVerified:true,ingestAuthenticated:true,realWmgjSample:true,reconciled:true,nativeInsightVerified:true,killSwitch:true,productionMutation:false,sourceMutation:false}' > "$RUNNER_TEMP/rc11-evidence/final-gate.json"

      - uses: actions/upload-artifact@v4
        with:
          name: aurora-rc11-evidence
          path: ${{ runner.temp }}/rc11-evidence/
          if-no-files-found: error
          retention-days: 30
