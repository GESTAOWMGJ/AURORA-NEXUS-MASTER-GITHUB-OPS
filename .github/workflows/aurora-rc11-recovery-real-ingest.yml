name: Aurora RC1.1 Recovery and Real WMGJ Ingest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/requests/aurora-rc11-run.json"

permissions:
  contents: read

concurrency:
  group: aurora-rc11-hml
  cancel-in-progress: true

jobs:
  rc11:
    name: Recovery -> ingest -> reconcile -> native insight
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: firebase-homologation
    permissions:
      contents: read
      id-token: write
    env:
      REQUEST_FILE: .github/requests/aurora-rc11-run.json
      APPS_SCRIPT_ID: 1_fQPqaq0EjaugyIF6jyuENDhJ2c2oTFm1kC-wdjmfaDqyRzy_uqwtiSW
      REGION: southamerica-east1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned 2026-10-01
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Validate immutable RC1.1 request
        env:
          APPROVED_PROJECT: ${{ vars.FIREBASE_HML_PROJECT_ID }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          jq -e --arg project "$APPROVED_PROJECT" '
            .confirmation=="RUN_RC11_HML" and
            .projectId==$project and
            .projectId=="wmgj-hml-jfn-20260927" and
            .sourceDatabase=="(default)" and
            .requestVersion==5 and
            .hmacMode=="REUSE_OR_BOOTSTRAP_EXISTING_KEYRING" and
            .deploymentApproved==true and
            .firebaseWriteApproved==true and
            .hmacBootstrapIfMissing==true and
            .restoreDatabasePrefix=="rc11-restore" and
            .competence=="2026-05" and
            .sample.invoiceNumber=="8" and
            .sample.expectedPairCount==2 and
            .productionMutation==false and
            .clinicalSensitiveEnabled==false
          ' "$REQUEST_FILE" >/dev/null

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 pinned 2026-10-01
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: firebase-migration/functions/package-lock.json

      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2 pinned 2026-10-01
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_FIREBASE_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2 pinned 2026-10-01
        with:
          version: "548.0.0"
          project_id: ${{ vars.FIREBASE_HML_PROJECT_ID }}

      - name: Verify recovery prerequisites
        env:
          PROJECT_ID: ${{ vars.FIREBASE_HML_PROJECT_ID }}
          DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test "$(gcloud auth list --filter='status:ACTIVE' --format='value(account)')" = "$DEPLOY_SERVICE_ACCOUNT"
          db_json="$(gcloud firestore databases describe --database='(default)' --project "$PROJECT_ID" --format=json)"
          test "$(jq -r '.locationId' <<<"$db_json")" = "$REGION"
          test "$(jq -r '.deleteProtectionState' <<<"$db_json")" = "DELETE_PROTECTION_ENABLED"
          test "$(jq -r '.pointInTimeRecoveryEnablement' <<<"$db_json")" = "POINT_IN_TIME_RECOVERY_ENABLED"
          schedules="$(gcloud firestore backups schedules list --database='(default)' --project "$PROJECT_ID" --format=json)"
          jq -e 'type=="array" and length>=1' <<<"$schedules" >/dev/null
          backups="$(gcloud firestore backups list --project "$PROJECT_ID" --format=json)"
          backup="$(jq -r --arg source "projects/${PROJECT_ID}/databases/(default)" '[.[]|select(.state=="READY" and .database==$source)]|sort_by(.snapshotTime//"")|last|.name//empty' <<<"$backups")"
          snapshot="$(jq -r --arg name "$backup" '.[]|select(.name==$name)|.snapshotTime//empty' <<<"$backups")"
          test -n "$backup"; test -n "$snapshot"
          python3 - "$snapshot" <<'PY'
          from datetime import datetime, timezone
          import sys
          t=datetime.fromisoformat(sys.argv[1].replace("Z","+00:00"))
          age=(datetime.now(timezone.utc)-t).total_seconds()
          if age < 0 or age > 24*3600: raise SystemExit("READY_BACKUP_NOT_WITHIN_24H")
          PY
          echo "AURORA_RC11_BACKUP_RESOURCE=$backup" >> "$GITHUB_ENV"
          echo "AURORA_RC11_BACKUP_SNAPSHOT=$snapshot" >> "$GITHUB_ENV"

      - name: Execute and prove real restore
        env:
          PROJECT_ID: ${{ vars.FIREBASE_HML_PROJECT_ID }}
        run: |
          set -euo pipefail
          restore_prefix="$(jq -r '.restoreDatabasePrefix' "$REQUEST_FILE")"
          [[ "$restore_prefix" =~ ^[a-z0-9][a-z0-9-]{2,30}$ ]]
          restore_db="${restore_prefix}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          [[ "$restore_db" =~ ^[a-z0-9][a-z0-9-]{3,62}$ ]]
          test "$restore_db" != "(default)"
          if gcloud firestore databases describe --database="$restore_db" --project "$PROJECT_ID" >/dev/null 2>&1; then
            echo "UNEXPECTED_TEMP_DATABASE_COLLISION:$restore_db" >&2
            exit 51
          fi
          # The restore command starts a long-running Firestore operation.
          # It does not support --async on this gcloud surface, but its JSON
          # output still contains the operation resource. Wait for SUCCESSFUL
          # before attempting any document read from the named database.
          gcloud firestore databases restore \
            --source-backup="$AURORA_RC11_BACKUP_RESOURCE" \
            --destination-database="$restore_db" \
            --project="$PROJECT_ID" \
            --format=json > "$RUNNER_TEMP/restore-result.json"
          test -s "$RUNNER_TEMP/restore-result.json"
          op="$(jq -r '.name // empty' "$RUNNER_TEMP/restore-result.json")"
          test -n "$op"
          restore_success=false
          for _ in $(seq 1 120); do
            gcloud firestore operations describe "$op" --project "$PROJECT_ID" --format=json > "$RUNNER_TEMP/restore-op.json"
            err="$(jq -r '.error.message // empty' "$RUNNER_TEMP/restore-op.json")"
            test -z "$err" || { echo "RESTORE_OPERATION_ERROR" >&2; exit 52; }
            state="$(jq -r '.metadata.operationState // empty' "$RUNNER_TEMP/restore-op.json")"
            case "$state" in
              SUCCESSFUL) restore_success=true; break ;;
              FAILED|CANCELLED) echo "RESTORE_OPERATION_$state" >&2; exit 53 ;;
            esac
            sleep 15
          done
          test "$restore_success" = true
          restored="$(gcloud firestore databases describe --database="$restore_db" --project "$PROJECT_ID" --format=json)"
          test -n "$restored"
          test "$(jq -r '.sourceInfo.backup.backup // empty' <<<"$restored")" = "$AURORA_RC11_BACKUP_RESOURCE"
          test "$(jq -r '.locationId' <<<"$restored")" = "$REGION"
          access_token="$(gcloud auth print-access-token)"
          source_org="$(curl -fsS -H "Authorization: Bearer ${access_token}" "https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents/organizations/wmgj")"
          restored_org=""
          for _ in $(seq 1 20); do
            status="$(curl --silent --show-error --output "$RUNNER_TEMP/restored-org.json" --write-out '%{http_code}' -H "Authorization: Bearer ${access_token}" "https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/${restore_db}/documents/organizations/wmgj")"
            if [ "$status" = "200" ]; then
              restored_org="$(cat "$RUNNER_TEMP/restored-org.json")"
              break
            fi
            if [ "$status" != "400" ] && [ "$status" != "404" ] && [ "$status" != "409" ]; then
              cat "$RUNNER_TEMP/restored-org.json" >&2
              exit 54
            fi
            sleep 10
          done
          test -n "$restored_org"
          for json in "$source_org" "$restored_org"; do
            jq -e '.fields.active.booleanValue==true and .fields.environment.stringValue=="HOMOLOGATION" and .fields.clinicalSensitiveEnabled.booleanValue==false and .fields.productionMutation.booleanValue==false and .fields.sourceMutation.booleanValue==false' <<<"$json" >/dev/null
          done
          mkdir -p "$RUNNER_TEMP/rc11-evidence"
          fp="$(jq -c '{a:.fields.active.booleanValue,e:.fields.environment.stringValue,c:.fields.clinicalSensitiveEnabled.booleanValue,p:.fields.productionMutation.booleanValue,s:.fields.sourceMutation.booleanValue}' <<<"$restored_org" | sha256sum | awk '{print $1}')"
          jq -n --arg backup "$AURORA_RC11_BACKUP_RESOURCE" --arg snapshot "$AURORA_RC11_BACKUP_SNAPSHOT" --arg db "$restore_db" --arg fp "$fp" '{gate:"RESTORE_VERIFIED",backupResource:$backup,backupSnapshot:$snapshot,restoreDatabase:$db,guardrailFingerprint:$fp,verified:true}' > "$RUNNER_TEMP/rc11-evidence/recovery.json"

      - name: Cleanup temporary restore database
        if: always()
        env:
          PROJECT_ID: ${{ vars.FIREBASE_HML_PROJECT_ID }}
        run: |
          set -euo pipefail
          restore_prefix="$(jq -r '.restoreDatabasePrefix' "$REQUEST_FILE")"
          restore_db="${restore_prefix}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if restored="$(gcloud firestore databases describe --database="$restore_db" --project "$PROJECT_ID" --format=json 2>/dev/null)"; then
            source_backup="$(jq -r '.sourceInfo.backup.backup // empty' <<<"$restored")"
            if [ "$source_backup" = "$AURORA_RC11_BACKUP_RESOURCE" ]; then
              cleanup_ready=false
              for _ in $(seq 1 60); do
                restored="$(gcloud firestore databases describe --database="$restore_db" --project "$PROJECT_ID" --format=json)"
                protection="$(jq -r '.deleteProtectionState // "DELETE_PROTECTION_DISABLED"' <<<"$restored")"
                if [ "$protection" = "DELETE_PROTECTION_ENABLED" ]; then
                  set +e
                  update_out="$(gcloud firestore databases update --database="$restore_db" --project "$PROJECT_ID" --no-delete-protection --quiet 2>&1)"
                  update_rc=$?
                  set -e
                  if [ "$update_rc" -eq 0 ]; then
                    cleanup_ready=true
                    break
                  fi
                  if grep -qi "in the middle of restore" <<<"$update_out"; then
                    sleep 15
                    continue
                  fi
                  echo "$update_out" >&2
                  exit "$update_rc"
                else
                  cleanup_ready=true
                  break
                fi
              done
              test "$cleanup_ready" = true
              delete_done=false
              for _ in $(seq 1 40); do
                set +e
                delete_out="$(gcloud firestore databases delete --database="$restore_db" --project "$PROJECT_ID" --quiet 2>&1)"
                delete_rc=$?
                set -e
                if [ "$delete_rc" -eq 0 ]; then
                  delete_done=true
                  break
                fi
                if grep -qi "in the middle of restore" <<<"$delete_out"; then
                  sleep 15
                  continue
                fi
                if grep -qi "FAILED_PRECONDITION" <<<"$delete_out"; then
                  echo "$delete_out" >&2
                  exit "$delete_rc"
                fi
                echo "$delete_out" >&2
                exit "$delete_rc"
              done
              test "$delete_done" = true
            fi
          fi

      - name: Build and validate existing HMAC contract
        env:
          PROJECT_ID: ${{ vars.FIREBASE_HML_PROJECT_ID }}
        run: |
          set -euo pipefail
          npm --prefix firebase-migration/functions ci
          npm --prefix firebase-migration/functions test
          npm --prefix firebase-migration/functions run build
          secret_name="WMGJ_INGEST_HMAC_KEYRING"
          existing_secret="$(gcloud secrets describe "$secret_name" --project "$PROJECT_ID" --format='value(name)')"
          test -n "$existing_secret"

      - name: Verify existing HML runtime and deploy non-secret surfaces
        working-directory: firebase-migration
        env:
          PROJECT_ID: ${{ vars.FIREBASE_HML_PROJECT_ID }}
        run: |
          set -euo pipefail
          npx --yes firebase-tools@14.17.0 functions:list --project "$PROJECT_ID" --json > "$RUNNER_TEMP/functions-list.json"
          required='["ingestWmgjEvent","runtimeWatchdog","runtimeHealth","auroraNexusAuthGate","auroraNexusSessionLogin","auroraNexusSessionLogout","auroraNexusBootstrap","auroraNexusNativeInsight","auroraNexusAction","auroraNexusRefresh","auroraNexusProjectionEngine","auroraNexusOrganic","auroraNexusIntegrationKeys","auroraNexusIntegrationPing"]'
          jq -e --argjson required "$required" '
            [.. | objects | (.id? // .name? // empty) | tostring | split("/")[-1]] as $deployed
            | all($required[]; $deployed | index(.) != null)
          ' "$RUNNER_TEMP/functions-list.json" >/dev/null
          health_url="$(gcloud functions describe runtimeHealth --gen2 --region "$REGION" --project "$PROJECT_ID" --format='value(serviceConfig.uri)')"
          test -n "$health_url"
          curl -fsS "$health_url" > "$RUNNER_TEMP/runtime-health.json"
          jq -e '.ok==true and .service=="wmgj-firestore-ingestion" and .signatureVersion=="v2"' "$RUNNER_TEMP/runtime-health.json" >/dev/null
          npx --yes firebase-tools@14.17.0 deploy --project "$PROJECT_ID" --non-interactive --only hosting,firestore:rules,firestore:indexes
          echo "AURORA_RC11_INGEST_URL=https://${REGION}-${PROJECT_ID}.cloudfunctions.net/ingestWmgjEvent" >> "$GITHUB_ENV"
          jq -n --arg healthUrl "$health_url" '{
            gate:"HML_RUNTIME_VERIFIED",
            functionsPresent:true,
            runtimeHealth:true,
            signatureVersion:"v2",
            functionsRedeployed:false,
            nonSecretSurfacesDeployed:true,
            healthUrl:$healthUrl
          }' > "$RUNNER_TEMP/rc11-evidence/runtime.json"

      - name: Use canonical Apps Script deployment and configure bridge
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          PROJECT_ID: ${{ vars.FIREBASE_HML_PROJECT_ID }}
        run: |
          set -euo pipefail
          npm install -g @google/clasp@3.4.1
          umask 077
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          mkdir -p "$RUNNER_TEMP/build-appscript"
          printf '{"scriptId":"%s","projectId":"%s","rootDir":"."}\n' "$APPS_SCRIPT_ID" "$PROJECT_ID" > "$RUNNER_TEMP/build-appscript/.clasp.json"
          cd "$RUNNER_TEMP/build-appscript"
          # Apps Script source/deployment is owned exclusively by deploy-appscript.yml.
          # RC1.1 consumes the canonical nondev deployment and never pushes/redeploys it.
          test "$(jq -r '.deploymentApproved' "$GITHUB_WORKSPACE/$REQUEST_FILE")" = "true"
          test "$(jq -r '.firebaseWriteApproved' "$GITHUB_WORKSPACE/$REQUEST_FILE")" = "true"
          test "$(jq -r '.hmacBootstrapIfMissing' "$GITHUB_WORKSPACE/$REQUEST_FILE")" = "true"
          params="$(jq -nc --arg url "$AURORA_RC11_INGEST_URL" '[$url]')"
          bash "$GITHUB_WORKSPACE/tools/run-clasp-checked.sh" auroraRc11InspecionarConfiguracao "$RUNNER_TEMP/rc11-config-state.json"
          jq -e '.response.ok==true and .response.sourceMutation==false' "$RUNNER_TEMP/rc11-config-state.json" >/dev/null
          if [ "$(jq -r '.response.hmacConfigured' "$RUNNER_TEMP/rc11-config-state.json")" = "true" ]; then
            bash "$GITHUB_WORKSPACE/tools/run-clasp-checked.sh" auroraRc11ConfigurarEndpointExistente "$RUNNER_TEMP/rc11-config.json" "$params"
          else
            keyring_file="$RUNNER_TEMP/hmac-keyring.json"
            if ! gcloud secrets versions access latest --secret="WMGJ_INGEST_HMAC_KEYRING" --project "$PROJECT_ID" --out-file="$keyring_file" >/dev/null 2>&1; then
              echo "::error title=HMAC bootstrap unavailable::Apps Script HMAC is absent and deploy identity cannot read the existing HML keyring. No IAM or Secret Manager mutation was attempted." >&2
              exit 74
            fi
            chmod 600 "$keyring_file"
            if jq -e '
              type=="object" and length>=1 and
              ([to_entries[] | select(
                .value.active==true and
                ((.value.orgIds // []) | index("wmgj")) != null and
                ((.value.entityTypes // []) | index("invoice")) != null and
                ((.value.entityTypes // []) | index("bankTransaction")) != null and
                ((.value.secret // "") | test("^[A-Fa-f0-9]{64}$"))
              )] | length)==1
            ' "$keyring_file" >/dev/null 2>&1; then
              key_id="$(jq -r '
                [to_entries[] | select(
                  .value.active==true and
                  ((.value.orgIds // []) | index("wmgj")) != null and
                  ((.value.entityTypes // []) | index("invoice")) != null and
                  ((.value.entityTypes // []) | index("bankTransaction")) != null and
                  ((.value.secret // "") | test("^[A-Fa-f0-9]{64}$"))
                )] | .[0].key
              ' "$keyring_file")"
              hmac_secret="$(jq -r --arg key "$key_id" '.[$key].secret' "$keyring_file")"
            elif grep -Eq '^[A-Fa-f0-9]{64}          fi
          jq -e '.response.ok==true and .response.secretConfigured==true and .response.dryRun==true' "$RUNNER_TEMP/rc11-config.json" >/dev/null
          bash "$GITHUB_WORKSPACE/tools/run-clasp-checked.sh" auroraRc11InspecionarConfiguracao "$RUNNER_TEMP/rc11-config-state-after.json"
          jq -e '.response.ok==true and .response.endpointConfigured==true and .response.hmacConfigured==true and .response.dryRun==true' "$RUNNER_TEMP/rc11-config-state-after.json" >/dev/null
          bash "$GITHUB_WORKSPACE/tools/run-clasp-checked.sh" auroraRc11ValidarHmacExistente "$RUNNER_TEMP/rc11-hmac-probe.json"
          jq -e '.response.ok==true and .response.authenticated==true and .response.noWrite==true and .response.dryRun==true' "$RUNNER_TEMP/rc11-hmac-probe.json" >/dev/null
          bash "$GITHUB_WORKSPACE/tools/run-clasp-checked.sh" auroraRc11DryRunAmostra "$RUNNER_TEMP/rc11-dry-run.json"
          jq -e '.response.ok==true and .response.dryRun==true and .response.planned==2 and .response.expected.competence=="2026-05" and .response.expected.invoiceCents==4950000 and .response.expected.receivedCents==4950000 and .response.expected.differenceCents==0' "$RUNNER_TEMP/rc11-dry-run.json" >/dev/null

      - name: Send one real sample and reapply kill switch
        run: |
          set -euo pipefail
          test "$(jq -r '.firebaseWriteApproved' "$REQUEST_FILE")" = "true"
          cd "$RUNNER_TEMP/build-appscript"
          bash "$GITHUB_WORKSPACE/tools/run-clasp-checked.sh" auroraRc11AtivarEscritaAmostra "$RUNNER_TEMP/rc11-activate.json" '["ATIVAR_RC11_WMGJ_HML"]'
          jq -e '.response.ok==true and .response.dryRun==false and .response.sampleOnly==true' "$RUNNER_TEMP/rc11-activate.json" >/dev/null
          trap 'bash "$GITHUB_WORKSPACE/tools/run-clasp-checked.sh" auroraRc11KillSwitch "$RUNNER_TEMP/rc11-kill-trap.json" >/dev/null 2>&1 || true' EXIT
          bash "$GITHUB_WORKSPACE/tools/run-clasp-checked.sh" auroraRc11EnviarAmostraReal "$RUNNER_TEMP/rc11-live.json" '["ATIVAR_RC11_WMGJ_HML"]'
          jq -e '.response.ok==true and .response.oneShot==true and ((.response.sent + .response.duplicates)==2) and .response.expected.competence=="2026-05" and .response.expected.invoiceCents==4950000 and .response.expected.receivedCents==4950000 and .response.expected.differenceCents==0 and (.response.invoiceEntityId|length)>0 and (.response.bankEntityId|length)>0' "$RUNNER_TEMP/rc11-live.json" >/dev/null
          invoice_entity_id="$(jq -r '.response.invoiceEntityId' "$RUNNER_TEMP/rc11-live.json")"
          bank_entity_id="$(jq -r '.response.bankEntityId' "$RUNNER_TEMP/rc11-live.json")"
          echo "AURORA_RC11_INVOICE_ENTITY_ID=$invoice_entity_id" >> "$GITHUB_ENV"
          echo "AURORA_RC11_BANK_ENTITY_ID=$bank_entity_id" >> "$GITHUB_ENV"
          bash "$GITHUB_WORKSPACE/tools/run-clasp-checked.sh" auroraRc11KillSwitch "$RUNNER_TEMP/rc11-kill.json"
          jq -e '.response.ok==true and .response.dryRun==true' "$RUNNER_TEMP/rc11-kill.json" >/dev/null
          bash "$GITHUB_WORKSPACE/tools/run-clasp-checked.sh" auroraRc11DryRunAmostra "$RUNNER_TEMP/rc11-post-live-dry-run.json"
          jq -e '.response.ok==true and .response.dryRun==true' "$RUNNER_TEMP/rc11-post-live-dry-run.json" >/dev/null
          trap - EXIT

      - name: Reconcile HML and enable SHADOW projection
        env:
          PROJECT_ID: ${{ vars.FIREBASE_HML_PROJECT_ID }}
        run: |
          set -euo pipefail
          test -n "$AURORA_RC11_INVOICE_ENTITY_ID"
          test -n "$AURORA_RC11_BANK_ENTITY_ID"
          access_token="$(gcloud auth print-access-token)"
          base="https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents/organizations/wmgj"
          curl -fsS -H "Authorization: Bearer ${access_token}" "$base/invoices/$AURORA_RC11_INVOICE_ENTITY_ID" > "$RUNNER_TEMP/invoice.json"
          curl -fsS -H "Authorization: Bearer ${access_token}" "$base/bankTransactions/$AURORA_RC11_BANK_ENTITY_ID" > "$RUNNER_TEMP/bank.json"
          jq -e '.fields.orgId.stringValue=="wmgj" and .fields.entityType.stringValue=="invoice" and .fields.competence.stringValue=="2026-05" and .fields.documentType.stringValue=="06_NFS_E" and .fields.invoiceNumber.stringValue=="8" and (.fields.totalCents.integerValue|tonumber)==4950000 and .fields.source.mapValue.fields.system.stringValue=="SHEETS"' "$RUNNER_TEMP/invoice.json" >/dev/null
          jq -e '.fields.orgId.stringValue=="wmgj" and .fields.entityType.stringValue=="bankTransaction" and .fields.competence.stringValue=="2026-05" and .fields.documentType.stringValue=="08_EXTRATOS_BRADESCO" and .fields.status.stringValue=="RECONCILED" and (.fields.liquidatedAmountCents.integerValue|tonumber)==4950000 and .fields.source.mapValue.fields.system.stringValue=="SHEETS"' "$RUNNER_TEMP/bank.json" >/dev/null
          invoice_cents="$(jq -r '.fields.totalCents.integerValue|tonumber' "$RUNNER_TEMP/invoice.json")"
          bank_cents="$(jq -r '.fields.liquidatedAmountCents.integerValue|tonumber' "$RUNNER_TEMP/bank.json")"
          test "$invoice_cents" -eq 4950000
          test "$bank_cents" -eq 4950000
          test "$invoice_cents" -eq "$bank_cents"
          jq -n --arg invoiceId "$AURORA_RC11_INVOICE_ENTITY_ID" --arg bankId "$AURORA_RC11_BANK_ENTITY_ID" --argjson cents "$invoice_cents" '{gate:"RECONCILED",invoiceEntityId:$invoiceId,bankEntityId:$bankId,invoiceCents:$cents,receivedCents:$cents,amountsEqual:true,differenceZero:true,sourceMutation:false}' > "$RUNNER_TEMP/rc11-evidence/reconciliation.json"
          payload='{"fields":{"projectionEnabled":{"booleanValue":true},"projectionMode":{"stringValue":"SHADOW"},"projectionCompetence":{"stringValue":"2026-05"},"productionMutation":{"booleanValue":false},"sourceMutation":{"booleanValue":false}}}'
          curl -fsS -X PATCH -H "Authorization: Bearer ${access_token}" -H 'Content-Type: application/json' --data "$payload" "${base}?updateMask.fieldPaths=projectionEnabled&updateMask.fieldPaths=projectionMode&updateMask.fieldPaths=projectionCompetence&updateMask.fieldPaths=productionMutation&updateMask.fieldPaths=sourceMutation" >/dev/null

      - name: Wait for governed projection
        env:
          PROJECT_ID: ${{ vars.FIREBASE_HML_PROJECT_ID }}
        run: |
          set -euo pipefail
          access_token="$(gcloud auth print-access-token)"
          url="https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents/organizations/wmgj/dashboardSnapshots/current"
          ready=false
          for _ in $(seq 1 40); do
            if curl -fsS -H "Authorization: Bearer ${access_token}" "$url" > "$RUNNER_TEMP/snapshot.json" 2>/dev/null && jq -e '.fields.competence.stringValue=="2026-05" and (.fields.financialCents.mapValue.fields.invoicedCents.integerValue|tonumber)==4950000 and (.fields.financialCents.mapValue.fields.receivedCents.integerValue|tonumber)==4950000 and (.fields.financialCents.mapValue.fields.outstandingCents.integerValue|tonumber)==0 and .fields.dataQuality.mapValue.fields.complete.booleanValue==true' "$RUNNER_TEMP/snapshot.json" >/dev/null 2>&1; then ready=true; break; fi
            sleep 30
          done
          test "$ready" = true

      - name: Test native intelligence against real HML data
        env:
          PROJECT_ID: ${{ vars.FIREBASE_HML_PROJECT_ID }}
          DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
          SMOKE_UID: ${{ vars.FIREBASE_HML_SMOKE_UID }}
        run: |
          set -euo pipefail
          d="$(mktemp -d "$RUNNER_TEMP/rc11-native.XXXXXX")"; trap 'rm -rf "$d"' EXIT
          access_token="$(gcloud auth print-access-token)"
          apps="$(curl -fsS -H "Authorization: Bearer ${access_token}" "https://firebase.googleapis.com/v1beta1/projects/${PROJECT_ID}/webApps?pageSize=100")"
          app_name="$(jq -r '[.apps[]?|select(.state=="ACTIVE")]|first|.name//empty' <<<"$apps")"; test -n "$app_name"
          api_key="$(curl -fsS -H "Authorization: Bearer ${access_token}" "https://firebase.googleapis.com/v1beta1/${app_name}/config" | jq -r '.apiKey//empty')"; test -n "$api_key"
          now="$(date +%s)"; exp="$((now+3000))"
          jq -nc --arg iss "$DEPLOY_SERVICE_ACCOUNT" --arg sub "$DEPLOY_SERVICE_ACCOUNT" --arg uid "$SMOKE_UID" --arg aud "https://identitytoolkit.googleapis.com/google.identity.identitytoolkit.v1.IdentityToolkit" --argjson iat "$now" --argjson exp "$exp" '{iss:$iss,sub:$sub,aud:$aud,iat:$iat,exp:$exp,uid:$uid}' > "$d/claims.json"
          gcloud iam service-accounts sign-jwt "$d/claims.json" "$d/custom.jwt" --iam-account "$DEPLOY_SERVICE_ACCOUNT" --project "$PROJECT_ID" >/dev/null
          jq -nc --arg token "$(cat "$d/custom.jwt")" '{token:$token,returnSecureToken:true}' > "$d/auth.json"
          curl -fsS -H 'Content-Type: application/json' --data-binary @"$d/auth.json" "https://identitytoolkit.googleapis.com/v1/accounts:signInWithCustomToken?key=${api_key}" > "$d/auth-response.json"
          id_token="$(jq -r '.idToken//empty' "$d/auth-response.json")"; test -n "$id_token"
          base_url="https://${PROJECT_ID}.web.app"
          jq -nc --arg idToken "$id_token" '{idToken:$idToken}' > "$d/session.json"
          curl -fsS -X POST -H 'Content-Type: application/json' -H "Origin: ${base_url}" -H 'Sec-Fetch-Site: same-origin' --cookie-jar "$d/cookies.txt" --data-binary @"$d/session.json" "${base_url}/__sessionLogin" >/dev/null
          for intent in REVENUE_RISK SLA_RISK NEXT_ACTION EXECUTIVE; do
            curl -fsS -H 'Accept: application/json' --cookie "$d/cookies.txt" "${base_url}/api/native-insight?intent=${intent}" > "$d/${intent}.json"
            jq -e '.ok==true and .insight.engine=="AURORA_NATIVE_INTELLIGENCE" and .insight.externalProviderUsed==false and .insight.source.competence=="2026-05"' "$d/${intent}.json" >/dev/null
          done
          jq -e '[.insight.findings[]?|select(.code=="REVENUE_GAP")]|length==0' "$d/REVENUE_RISK.json" >/dev/null
          jq -e '[.insight.findings[]?|select(.code=="SLA_OVERDUE")]|length==0' "$d/SLA_RISK.json" >/dev/null
          jq -n --arg r "$(jq -r '.insight.headline' "$d/REVENUE_RISK.json")" --arg s "$(jq -r '.insight.headline' "$d/SLA_RISK.json")" --arg n "$(jq -r '.insight.headline' "$d/NEXT_ACTION.json")" --arg e "$(jq -r '.insight.headline' "$d/EXECUTIVE.json")" '{gate:"NATIVE_INSIGHT_VERIFIED",externalProviderUsed:false,revenueHeadline:$r,slaHeadline:$s,nextActionHeadline:$n,executiveHeadline:$e}' > "$RUNNER_TEMP/rc11-evidence/native-intelligence.json"

      - name: Final kill switch and evidence
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/build-appscript"
          bash "$GITHUB_WORKSPACE/tools/run-clasp-checked.sh" auroraRc11KillSwitch "$RUNNER_TEMP/rc11-final-kill.json"
          jq -e '.response.ok==true and .response.dryRun==true' "$RUNNER_TEMP/rc11-final-kill.json" >/dev/null
          bash "$GITHUB_WORKSPACE/tools/run-clasp-checked.sh" auroraRc11DryRunAmostra "$RUNNER_TEMP/rc11-final-dry-run.json"
          jq -e '.response.ok==true and .response.dryRun==true' "$RUNNER_TEMP/rc11-final-dry-run.json" >/dev/null
          jq -n '{release:"1.0.0-rc.1",gate:"RC1.1",restoreVerified:true,ingestAuthenticated:true,realWmgjSample:true,reconciled:true,nativeInsightVerified:true,killSwitch:true,productionMutation:false,sourceMutation:false}' > "$RUNNER_TEMP/rc11-evidence/final-gate.json"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 pinned 2026-10-01
        with:
          name: aurora-rc11-evidence
          path: ${{ runner.temp }}/rc11-evidence/
          if-no-files-found: error
          retention-days: 30
 "$keyring_file"; then
              test "$(jq -r '.secretManagerKeyringMigrationApproved // false' "$GITHUB_WORKSPACE/$REQUEST_FILE")" = "true" || {
                echo "::error title=Legacy HMAC keyring requires approval::Existing HML secret is legacy raw hex. Set explicit secretManagerKeyringMigrationApproved=true in the immutable request before creating a new secret version." >&2
                exit 75
              }
              key_id="apps-script-homolog-2026-08"
              hmac_secret="$(tr -d '\r\n' < "$keyring_file")"
              test "${#hmac_secret}" -eq 64
              echo "::add-mask::$hmac_secret"
              migrated_keyring="$RUNNER_TEMP/hmac-keyring-migrated.json"
              jq -nc --arg keyId "$key_id" --arg secret "$hmac_secret" '{
                ($keyId): {
                  active: true,
                  secret: $secret,
                  orgIds: ["wmgj"],
                  entityTypes: ["sourceDocument","invoice","bankTransaction","gloss","reconciliation"]
                }
              }' > "$migrated_keyring"
              chmod 600 "$migrated_keyring"
              if ! gcloud secrets versions add "WMGJ_INGEST_HMAC_KEYRING" --project "$PROJECT_ID" --data-file="$migrated_keyring" --quiet >/dev/null; then
                echo "::error title=HML secret migration permission required::Could not add the migrated keyring version. Grant only the minimum Secret Manager Secret Version Adder permission on WMGJ_INGEST_HMAC_KEYRING to the HML deploy identity, then retry." >&2
                exit 76
              fi
              (
                cd "$GITHUB_WORKSPACE/firebase-migration"
                npx --yes firebase-tools@14.17.0 deploy --project "$PROJECT_ID" --non-interactive --only functions:ingestWmgjEvent
              )
              rm -f "$migrated_keyring"
            else
              echo "::error title=Unsupported HML HMAC format::Existing WMGJ_INGEST_HMAC_KEYRING is neither the current keyring JSON nor the recognized 64-hex legacy format." >&2
              exit 77
            fi
            test -n "$key_id"
            test "${#hmac_secret}" -eq 64
            echo "::add-mask::$hmac_secret"
            bootstrap_params="$(jq -nc --arg url "$AURORA_RC11_INGEST_URL" --arg keyId "$key_id" --arg secret "$hmac_secret" '[$url,$keyId,$secret]')"
            bash "$GITHUB_WORKSPACE/tools/run-clasp-checked.sh" auroraRc11ConfigurarIngestao "$RUNNER_TEMP/rc11-config.json" "$bootstrap_params"
            rm -f "$keyring_file"
            unset hmac_secret bootstrap_params
          fi
          jq -e '.response.ok==true and .response.secretConfigured==true and .response.dryRun==true' "$RUNNER_TEMP/rc11-config.json" >/dev/null
          bash "$GITHUB_WORKSPACE/tools/run-clasp-checked.sh" auroraRc11InspecionarConfiguracao "$RUNNER_TEMP/rc11-config-state-after.json"
          jq -e '.response.ok==true and .response.endpointConfigured==true and .response.hmacConfigured==true and .response.dryRun==true' "$RUNNER_TEMP/rc11-config-state-after.json" >/dev/null
          bash "$GITHUB_WORKSPACE/tools/run-clasp-checked.sh" auroraRc11ValidarHmacExistente "$RUNNER_TEMP/rc11-hmac-probe.json"
          jq -e '.response.ok==true and .response.authenticated==true and .response.noWrite==true and .response.dryRun==true' "$RUNNER_TEMP/rc11-hmac-probe.json" >/dev/null
          bash "$GITHUB_WORKSPACE/tools/run-clasp-checked.sh" auroraRc11DryRunAmostra "$RUNNER_TEMP/rc11-dry-run.json"
          jq -e '.response.ok==true and .response.dryRun==true and .response.planned==2 and .response.expected.competence=="2026-05" and .response.expected.invoiceCents==4950000 and .response.expected.receivedCents==4950000 and .response.expected.differenceCents==0' "$RUNNER_TEMP/rc11-dry-run.json" >/dev/null

      - name: Send one real sample and reapply kill switch
        run: |
          set -euo pipefail
          test "$(jq -r '.firebaseWriteApproved' "$REQUEST_FILE")" = "true"
          cd "$RUNNER_TEMP/build-appscript"
          bash "$GITHUB_WORKSPACE/tools/run-clasp-checked.sh" auroraRc11AtivarEscritaAmostra "$RUNNER_TEMP/rc11-activate.json" '["ATIVAR_RC11_WMGJ_HML"]'
          jq -e '.response.ok==true and .response.dryRun==false and .response.sampleOnly==true' "$RUNNER_TEMP/rc11-activate.json" >/dev/null
          trap 'bash "$GITHUB_WORKSPACE/tools/run-clasp-checked.sh" auroraRc11KillSwitch "$RUNNER_TEMP/rc11-kill-trap.json" >/dev/null 2>&1 || true' EXIT
          bash "$GITHUB_WORKSPACE/tools/run-clasp-checked.sh" auroraRc11EnviarAmostraReal "$RUNNER_TEMP/rc11-live.json" '["ATIVAR_RC11_WMGJ_HML"]'
          jq -e '.response.ok==true and .response.oneShot==true and ((.response.sent + .response.duplicates)==2) and .response.expected.competence=="2026-05" and .response.expected.invoiceCents==4950000 and .response.expected.receivedCents==4950000 and .response.expected.differenceCents==0 and (.response.invoiceEntityId|length)>0 and (.response.bankEntityId|length)>0' "$RUNNER_TEMP/rc11-live.json" >/dev/null
          invoice_entity_id="$(jq -r '.response.invoiceEntityId' "$RUNNER_TEMP/rc11-live.json")"
          bank_entity_id="$(jq -r '.response.bankEntityId' "$RUNNER_TEMP/rc11-live.json")"
          echo "AURORA_RC11_INVOICE_ENTITY_ID=$invoice_entity_id" >> "$GITHUB_ENV"
          echo "AURORA_RC11_BANK_ENTITY_ID=$bank_entity_id" >> "$GITHUB_ENV"
          bash "$GITHUB_WORKSPACE/tools/run-clasp-checked.sh" auroraRc11KillSwitch "$RUNNER_TEMP/rc11-kill.json"
          jq -e '.response.ok==true and .response.dryRun==true' "$RUNNER_TEMP/rc11-kill.json" >/dev/null
          bash "$GITHUB_WORKSPACE/tools/run-clasp-checked.sh" auroraRc11DryRunAmostra "$RUNNER_TEMP/rc11-post-live-dry-run.json"
          jq -e '.response.ok==true and .response.dryRun==true' "$RUNNER_TEMP/rc11-post-live-dry-run.json" >/dev/null
          trap - EXIT

      - name: Reconcile HML and enable SHADOW projection
        env:
          PROJECT_ID: ${{ vars.FIREBASE_HML_PROJECT_ID }}
        run: |
          set -euo pipefail
          test -n "$AURORA_RC11_INVOICE_ENTITY_ID"
          test -n "$AURORA_RC11_BANK_ENTITY_ID"
          access_token="$(gcloud auth print-access-token)"
          base="https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents/organizations/wmgj"
          curl -fsS -H "Authorization: Bearer ${access_token}" "$base/invoices/$AURORA_RC11_INVOICE_ENTITY_ID" > "$RUNNER_TEMP/invoice.json"
          curl -fsS -H "Authorization: Bearer ${access_token}" "$base/bankTransactions/$AURORA_RC11_BANK_ENTITY_ID" > "$RUNNER_TEMP/bank.json"
          jq -e '.fields.orgId.stringValue=="wmgj" and .fields.entityType.stringValue=="invoice" and .fields.competence.stringValue=="2026-05" and .fields.documentType.stringValue=="06_NFS_E" and .fields.invoiceNumber.stringValue=="8" and (.fields.totalCents.integerValue|tonumber)==4950000 and .fields.source.mapValue.fields.system.stringValue=="SHEETS"' "$RUNNER_TEMP/invoice.json" >/dev/null
          jq -e '.fields.orgId.stringValue=="wmgj" and .fields.entityType.stringValue=="bankTransaction" and .fields.competence.stringValue=="2026-05" and .fields.documentType.stringValue=="08_EXTRATOS_BRADESCO" and .fields.status.stringValue=="RECONCILED" and (.fields.liquidatedAmountCents.integerValue|tonumber)==4950000 and .fields.source.mapValue.fields.system.stringValue=="SHEETS"' "$RUNNER_TEMP/bank.json" >/dev/null
          invoice_cents="$(jq -r '.fields.totalCents.integerValue|tonumber' "$RUNNER_TEMP/invoice.json")"
          bank_cents="$(jq -r '.fields.liquidatedAmountCents.integerValue|tonumber' "$RUNNER_TEMP/bank.json")"
          test "$invoice_cents" -eq 4950000
          test "$bank_cents" -eq 4950000
          test "$invoice_cents" -eq "$bank_cents"
          jq -n --arg invoiceId "$AURORA_RC11_INVOICE_ENTITY_ID" --arg bankId "$AURORA_RC11_BANK_ENTITY_ID" --argjson cents "$invoice_cents" '{gate:"RECONCILED",invoiceEntityId:$invoiceId,bankEntityId:$bankId,invoiceCents:$cents,receivedCents:$cents,amountsEqual:true,differenceZero:true,sourceMutation:false}' > "$RUNNER_TEMP/rc11-evidence/reconciliation.json"
          payload='{"fields":{"projectionEnabled":{"booleanValue":true},"projectionMode":{"stringValue":"SHADOW"},"projectionCompetence":{"stringValue":"2026-05"},"productionMutation":{"booleanValue":false},"sourceMutation":{"booleanValue":false}}}'
          curl -fsS -X PATCH -H "Authorization: Bearer ${access_token}" -H 'Content-Type: application/json' --data "$payload" "${base}?updateMask.fieldPaths=projectionEnabled&updateMask.fieldPaths=projectionMode&updateMask.fieldPaths=projectionCompetence&updateMask.fieldPaths=productionMutation&updateMask.fieldPaths=sourceMutation" >/dev/null

      - name: Wait for governed projection
        env:
          PROJECT_ID: ${{ vars.FIREBASE_HML_PROJECT_ID }}
        run: |
          set -euo pipefail
          access_token="$(gcloud auth print-access-token)"
          url="https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents/organizations/wmgj/dashboardSnapshots/current"
          ready=false
          for _ in $(seq 1 40); do
            if curl -fsS -H "Authorization: Bearer ${access_token}" "$url" > "$RUNNER_TEMP/snapshot.json" 2>/dev/null && jq -e '.fields.competence.stringValue=="2026-05" and (.fields.financialCents.mapValue.fields.invoicedCents.integerValue|tonumber)==4950000 and (.fields.financialCents.mapValue.fields.receivedCents.integerValue|tonumber)==4950000 and (.fields.financialCents.mapValue.fields.outstandingCents.integerValue|tonumber)==0 and .fields.dataQuality.mapValue.fields.complete.booleanValue==true' "$RUNNER_TEMP/snapshot.json" >/dev/null 2>&1; then ready=true; break; fi
            sleep 30
          done
          test "$ready" = true

      - name: Test native intelligence against real HML data
        env:
          PROJECT_ID: ${{ vars.FIREBASE_HML_PROJECT_ID }}
          DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
          SMOKE_UID: ${{ vars.FIREBASE_HML_SMOKE_UID }}
        run: |
          set -euo pipefail
          d="$(mktemp -d "$RUNNER_TEMP/rc11-native.XXXXXX")"; trap 'rm -rf "$d"' EXIT
          access_token="$(gcloud auth print-access-token)"
          apps="$(curl -fsS -H "Authorization: Bearer ${access_token}" "https://firebase.googleapis.com/v1beta1/projects/${PROJECT_ID}/webApps?pageSize=100")"
          app_name="$(jq -r '[.apps[]?|select(.state=="ACTIVE")]|first|.name//empty' <<<"$apps")"; test -n "$app_name"
          api_key="$(curl -fsS -H "Authorization: Bearer ${access_token}" "https://firebase.googleapis.com/v1beta1/${app_name}/config" | jq -r '.apiKey//empty')"; test -n "$api_key"
          now="$(date +%s)"; exp="$((now+3000))"
          jq -nc --arg iss "$DEPLOY_SERVICE_ACCOUNT" --arg sub "$DEPLOY_SERVICE_ACCOUNT" --arg uid "$SMOKE_UID" --arg aud "https://identitytoolkit.googleapis.com/google.identity.identitytoolkit.v1.IdentityToolkit" --argjson iat "$now" --argjson exp "$exp" '{iss:$iss,sub:$sub,aud:$aud,iat:$iat,exp:$exp,uid:$uid}' > "$d/claims.json"
          gcloud iam service-accounts sign-jwt "$d/claims.json" "$d/custom.jwt" --iam-account "$DEPLOY_SERVICE_ACCOUNT" --project "$PROJECT_ID" >/dev/null
          jq -nc --arg token "$(cat "$d/custom.jwt")" '{token:$token,returnSecureToken:true}' > "$d/auth.json"
          curl -fsS -H 'Content-Type: application/json' --data-binary @"$d/auth.json" "https://identitytoolkit.googleapis.com/v1/accounts:signInWithCustomToken?key=${api_key}" > "$d/auth-response.json"
          id_token="$(jq -r '.idToken//empty' "$d/auth-response.json")"; test -n "$id_token"
          base_url="https://${PROJECT_ID}.web.app"
          jq -nc --arg idToken "$id_token" '{idToken:$idToken}' > "$d/session.json"
          curl -fsS -X POST -H 'Content-Type: application/json' -H "Origin: ${base_url}" -H 'Sec-Fetch-Site: same-origin' --cookie-jar "$d/cookies.txt" --data-binary @"$d/session.json" "${base_url}/__sessionLogin" >/dev/null
          for intent in REVENUE_RISK SLA_RISK NEXT_ACTION EXECUTIVE; do
            curl -fsS -H 'Accept: application/json' --cookie "$d/cookies.txt" "${base_url}/api/native-insight?intent=${intent}" > "$d/${intent}.json"
            jq -e '.ok==true and .insight.engine=="AURORA_NATIVE_INTELLIGENCE" and .insight.externalProviderUsed==false and .insight.source.competence=="2026-05"' "$d/${intent}.json" >/dev/null
          done
          jq -e '[.insight.findings[]?|select(.code=="REVENUE_GAP")]|length==0' "$d/REVENUE_RISK.json" >/dev/null
          jq -e '[.insight.findings[]?|select(.code=="SLA_OVERDUE")]|length==0' "$d/SLA_RISK.json" >/dev/null
          jq -n --arg r "$(jq -r '.insight.headline' "$d/REVENUE_RISK.json")" --arg s "$(jq -r '.insight.headline' "$d/SLA_RISK.json")" --arg n "$(jq -r '.insight.headline' "$d/NEXT_ACTION.json")" --arg e "$(jq -r '.insight.headline' "$d/EXECUTIVE.json")" '{gate:"NATIVE_INSIGHT_VERIFIED",externalProviderUsed:false,revenueHeadline:$r,slaHeadline:$s,nextActionHeadline:$n,executiveHeadline:$e}' > "$RUNNER_TEMP/rc11-evidence/native-intelligence.json"

      - name: Final kill switch and evidence
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/build-appscript"
          bash "$GITHUB_WORKSPACE/tools/run-clasp-checked.sh" auroraRc11KillSwitch "$RUNNER_TEMP/rc11-final-kill.json"
          jq -e '.response.ok==true and .response.dryRun==true' "$RUNNER_TEMP/rc11-final-kill.json" >/dev/null
          bash "$GITHUB_WORKSPACE/tools/run-clasp-checked.sh" auroraRc11DryRunAmostra "$RUNNER_TEMP/rc11-final-dry-run.json"
          jq -e '.response.ok==true and .response.dryRun==true' "$RUNNER_TEMP/rc11-final-dry-run.json" >/dev/null
          jq -n '{release:"1.0.0-rc.1",gate:"RC1.1",restoreVerified:true,ingestAuthenticated:true,realWmgjSample:true,reconciled:true,nativeInsightVerified:true,killSwitch:true,productionMutation:false,sourceMutation:false}' > "$RUNNER_TEMP/rc11-evidence/final-gate.json"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 pinned 2026-10-01
        with:
          name: aurora-rc11-evidence
