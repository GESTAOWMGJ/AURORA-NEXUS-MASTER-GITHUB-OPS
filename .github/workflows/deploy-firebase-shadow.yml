name: Deploy Firebase Shadow Staging

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate only; no Firebase deployment"
        required: true
        default: true
        type: boolean
      firebase_project_id:
        description: "Exact approved Firebase staging project ID"
        required: true
        type: string
      commit_sha:
        description: "Exact immutable commit SHA to validate"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-shadow-staging
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: firebase-shadow-staging
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.commit_sha }}
      - name: Validate immutable target and environment allowlist
        env:
          EXPECTED_SHA: ${{ inputs.commit_sha }}
          REQUESTED_PROJECT_ID: ${{ inputs.firebase_project_id }}
          APPROVED_PROJECT_ID: ${{ vars.FIREBASE_SHADOW_PROJECT_ID }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -n "$APPROVED_PROJECT_ID"
          test "$REQUESTED_PROJECT_ID" = "$APPROVED_PROJECT_ID"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app-foundation/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
        working-directory: app-foundation
      - run: npm run functions:build
        working-directory: app-foundation
      - run: npm run build
        working-directory: app-foundation
      - run: npm run test:all
        working-directory: app-foundation
      - run: node tools/audit-appscript.js
      - name: Dry-run conclusion
        if: ${{ inputs.dry_run }}
        run: echo "Validated only; no Firebase resource changed."

  deploy-shadow:
    if: ${{ !inputs.dry_run && vars.ENABLE_FIREBASE_SHADOW_DEPLOY == 'true' }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: firebase-shadow-staging
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.commit_sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_FIREBASE_SHADOW_SERVICE_ACCOUNT }}
      - name: Deploy shadow-only resources with ingestion disabled by default
        working-directory: app-foundation
        env:
          FIREBASE_PROJECT_ID: ${{ inputs.firebase_project_id }}
        run: |
          npx firebase-tools@15.28.1 deploy \
            --project "$FIREBASE_PROJECT_ID" \
            --only functions:ingestShadowSnapshot,firestore:rules,firestore:indexes \
            --non-interactive
