name: Aurora RC1.1 Post-Ingest Finalize

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/requests/aurora-rc11-post-ingest.json"

permissions:
  contents: read

concurrency:
  group: aurora-rc11-post-ingest-hml
  cancel-in-progress: true

jobs:
  finalize:
    name: Reconcile -> SHADOW -> native insight -> final kill switch
    # Keep the OS baseline explicit; validate a future Ubuntu upgrade in a separate PR.
    # GitHub-hosted image/runner patch updates continue within Ubuntu 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: firebase-homologation
    permissions:
      contents: read
      id-token: write
    env:
      REQUEST_FILE: .github/requests/aurora-rc11-post-ingest.json
      APPS_SCRIPT_ID: 1_fQPqaq0EjaugyIF6jyuENDhJ2c2oTFm1kC-wdjmfaDqyRzy_uqwtiSW
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; Node 24
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Validate immutable post-ingest request
        env:
          PROJECT_ID: ${{ vars.FIREBASE_HML_PROJECT_ID }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          jq -e --arg project "$PROJECT_ID" '
            .confirmation=="RUN_RC11_POST_INGEST_HML" and
            .requestVersion==1 and
            .projectId==$project and
            .projectId=="wmgj-hml-jfn-20260927" and
            .orgId=="wmgj" and
            .competence=="2026-05" and
            .invoiceEntityId=="2ecf22486a131eb73a6c3461d193065b9159d724409f0021" and
            .bankEntityId=="548ad8845970183fc0c4eb419ca030114ce448000d0b163b" and
            .expectedInvoiceCents==4950000 and
            .expectedReceivedCents==4950000 and
            .projectionMode=="SHADOW" and
            .projectionEnabled==true and
            .productionMutation==false and
            .sourceMutation==false and
            .clinicalSensitiveEnabled==false
          ' "$REQUEST_FILE" >/dev/null

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0; Node 24
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: firebase-migration/functions/package-lock.json

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0; Node 24
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_FIREBASE_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1; Node 24
        with:
          version: "548.0.0"
          project_id: ${{ vars.FIREBASE_HML_PROJECT_ID }}

      - name: Reconcile existing real entities
        env:
          PROJECT_ID: ${{ vars.FIREBASE_HML_PROJECT_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rc11-post-evidence"
          access_token="$(gcloud auth print-access-token)"
          base="https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents/organizations/wmgj"
          invoice_id="$(jq -r '.invoiceEntityId' "$REQUEST_FILE")"
          bank_id="$(jq -r '.bankEntityId' "$REQUEST_FILE")"
          curl -fsS -H "Authorization: Bearer ${access_token}" "$base/invoices/$invoice_id" > "$RUNNER_TEMP/invoice.json"
          curl -fsS -H "Authorization: Bearer ${access_token}" "$base/bankTransactions/$bank_id" > "$RUNNER_TEMP/bank.json"
          invoice_cents="$(jq -r '.fields.totalCents.integerValue|tonumber' "$RUNNER_TEMP/invoice.json")"
          bank_cents="$(jq -r '.fields.liquidatedAmountCents.integerValue|tonumber' "$RUNNER_TEMP/bank.json")"
          test "$invoice_cents" -eq "$(jq -r '.expectedInvoiceCents' "$REQUEST_FILE")"
          test "$bank_cents" -eq "$(jq -r '.expectedReceivedCents' "$REQUEST_FILE")"
          test "$invoice_cents" -eq "$bank_cents"
          jq -n --arg invoiceId "$invoice_id" --arg bankId "$bank_id" --argjson cents "$invoice_cents" '{
            gate:"RECONCILED",
            invoiceEntityId:$invoiceId,
            bankEntityId:$bankId,
            invoiceCents:$cents,
            receivedCents:$cents,
            differenceZero:true,
            productionMutation:false,
            sourceMutation:false
          }' > "$RUNNER_TEMP/rc11-post-evidence/reconciliation.json"

      - name: Enable SHADOW with explicit HTTP diagnostics
        env:
          PROJECT_ID: ${{ vars.FIREBASE_HML_PROJECT_ID }}
        run: |
          set -euo pipefail
          access_token="$(gcloud auth print-access-token)"
          org_url="https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents/organizations/wmgj"
          curl -fsS -H "Authorization: Bearer ${access_token}" "$org_url" > "$RUNNER_TEMP/org-before.json"
          jq -e '
            .fields.active.booleanValue==true and
            .fields.environment.stringValue=="HOMOLOGATION" and
            .fields.projectionMode.stringValue=="SHADOW" and
            .fields.productionMutation.booleanValue==false and
            .fields.sourceMutation.booleanValue==false and
            .fields.clinicalSensitiveEnabled.booleanValue==false
          ' "$RUNNER_TEMP/org-before.json" >/dev/null
          payload='{"fields":{"projectionEnabled":{"booleanValue":true},"projectionMode":{"stringValue":"SHADOW"},"projectionCompetence":{"stringValue":"2026-05"},"productionMutation":{"booleanValue":false},"sourceMutation":{"booleanValue":false}}}'
          patch_url="${org_url}?updateMask.fieldPaths=projectionEnabled&updateMask.fieldPaths=projectionMode&updateMask.fieldPaths=projectionCompetence&updateMask.fieldPaths=productionMutation&updateMask.fieldPaths=sourceMutation"
          http_status="$(curl --silent --show-error --output "$RUNNER_TEMP/projection-patch-response.json" --write-out '%{http_code}' -X PATCH -H "Authorization: Bearer ${access_token}" -H 'Content-Type: application/json' --data "$payload" "$patch_url")"
          if [ "$http_status" -lt 200 ] || [ "$http_status" -ge 300 ]; then
            google_status="$(jq -r '.error.status // empty' "$RUNNER_TEMP/projection-patch-response.json" 2>/dev/null || true)"
            google_code="$(jq -r '.error.code // empty' "$RUNNER_TEMP/projection-patch-response.json" 2>/dev/null || true)"
            google_message="$(jq -r '.error.message // empty' "$RUNNER_TEMP/projection-patch-response.json" 2>/dev/null | head -c 400 || true)"
            jq -n --argjson http "$http_status" --arg status "$google_status" --arg code "$google_code" --arg message "$google_message" '{
              gate:"PROJECTION_PATCH_FAILED",
              httpStatus:$http,
              googleStatus:$status,
              googleCode:$code,
              message:$message,
              productionMutation:false,
              sourceMutation:false
            }' > "$RUNNER_TEMP/rc11-post-evidence/projection-patch.json"
            cat "$RUNNER_TEMP/rc11-post-evidence/projection-patch.json"
            exit 72
          fi
          jq -e '
            .fields.projectionEnabled.booleanValue==true and
            .fields.projectionMode.stringValue=="SHADOW" and
            .fields.projectionCompetence.stringValue=="2026-05" and
            .fields.productionMutation.booleanValue==false and
            .fields.sourceMutation.booleanValue==false
          ' "$RUNNER_TEMP/projection-patch-response.json" >/dev/null
          jq -n '{gate:"SHADOW_ENABLED",competence:"2026-05",productionMutation:false,sourceMutation:false}' > "$RUNNER_TEMP/rc11-post-evidence/projection-patch.json"

      - name: Wait for governed projection
        env:
          PROJECT_ID: ${{ vars.FIREBASE_HML_PROJECT_ID }}
        run: |
          set -euo pipefail
          access_token="$(gcloud auth print-access-token)"
          url="https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents/organizations/wmgj/dashboardSnapshots/current"
          ready=false
          for _ in $(seq 1 40); do
            if curl -fsS -H "Authorization: Bearer ${access_token}" "$url" > "$RUNNER_TEMP/snapshot.json" 2>/dev/null && jq -e '
              .fields.competence.stringValue=="2026-05" and
              (.fields.financialCents.mapValue.fields.invoicedCents.integerValue|tonumber)==4950000 and
              (.fields.financialCents.mapValue.fields.receivedCents.integerValue|tonumber)==4950000 and
              (.fields.financialCents.mapValue.fields.outstandingCents.integerValue|tonumber)==0 and
              .fields.dataQuality.mapValue.fields.complete.booleanValue==true
            ' "$RUNNER_TEMP/snapshot.json" >/dev/null 2>&1; then ready=true; break; fi
            sleep 30
          done
          test "$ready" = true
          jq -n '{gate:"SHADOW_SNAPSHOT_VERIFIED",competence:"2026-05",invoicedCents:4950000,receivedCents:4950000,outstandingCents:0}' > "$RUNNER_TEMP/rc11-post-evidence/shadow-snapshot.json"

      - name: Repair Hosting rewrite targets only if native routes are stale
        env:
          PROJECT_ID: ${{ vars.FIREBASE_HML_PROJECT_ID }}
        working-directory: firebase-migration
        run: |
          set -euo pipefail
          test "$PROJECT_ID" = "wmgj-hml-jfn-20260927"
          mkdir -p "$RUNNER_TEMP/rc11-post-evidence"
          base_url="https://${PROJECT_ID}.web.app"
          access_token="$(gcloud auth print-access-token)"
          native_snapshot_url="https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents/organizations/wmgj/dashboardSnapshots/current"
          session_status="$(curl --silent --show-error --output "$RUNNER_TEMP/session-route.json" --write-out '%{http_code}' "${base_url}/__sessionLogin")"
          native_status="$(curl --silent --show-error --output "$RUNNER_TEMP/native-route.json" --write-out '%{http_code}' "${base_url}/api/native-insight?intent=EXECUTIVE")"
          rewrite_targets="$(jq -r '[.hosting.rewrites[] | select(.function? != null and .function.functionId? != null) | ("functions:" + .function.functionId)] | unique | join(",")' firebase.json)"
          test -n "$rewrite_targets"
          grep -Fq "functions:auroraNexusIntegrationPing" <<<"$rewrite_targets"
          npx --yes firebase-tools@14.17.0 functions:list --project "$PROJECT_ID" --json > "$RUNNER_TEMP/native-functions-list.json"
          python3 scripts/validate-hosting-runtime.py --inventory "$RUNNER_TEMP/native-functions-list.json" \
            --planned "${rewrite_targets//functions:/}"
          native_contract=false
          if jq -e '
            .fields.nativeDataPlane.mapValue.fields.storage.stringValue=="FIRESTORE" and
            .fields.nativeDataPlane.mapValue.fields.sourceAccessDuringInference.booleanValue==false
          ' "$RUNNER_TEMP/snapshot.json" >/dev/null 2>&1; then
            native_contract=true
          fi
          native_contract_before="$native_contract"
          projection_target="functions:auroraNexusProjectionEngine"
          repaired=false
          if [ "$session_status" != "405" ] || [ "$native_status" != "401" ] || [ "$native_contract" != "true" ]; then
            npm --prefix functions ci --no-audit --no-fund
            echo "FUNCTION_DEPENDENCIES_READY"
            npx --yes firebase-tools@14.17.0 deploy --project "$PROJECT_ID" --non-interactive --only "${rewrite_targets},${projection_target},hosting"
            repaired=true
            ready=false
            for _ in $(seq 1 20); do
              session_status="$(curl --silent --show-error --output "$RUNNER_TEMP/session-route.json" --write-out '%{http_code}' "${base_url}/__sessionLogin")"
              native_status="$(curl --silent --show-error --output "$RUNNER_TEMP/native-route.json" --write-out '%{http_code}' "${base_url}/api/native-insight?intent=EXECUTIVE")"
              if [ "$session_status" = "405" ] && [ "$native_status" = "401" ]; then ready=true; break; fi
              sleep 6
            done
            test "$ready" = true
            if [ "$native_contract" != "true" ]; then
              contract_ready=false
              for _ in $(seq 1 40); do
                if curl -fsS -H "Authorization: Bearer ${access_token}" "$native_snapshot_url" > "$RUNNER_TEMP/native-contract-snapshot.json" 2>/dev/null && jq -e '
                  .fields.competence.stringValue=="2026-05" and
                  (.fields.financialCents.mapValue.fields.invoicedCents.integerValue|tonumber)==4950000 and
                  (.fields.financialCents.mapValue.fields.receivedCents.integerValue|tonumber)==4950000 and
                  (.fields.financialCents.mapValue.fields.outstandingCents.integerValue|tonumber)==0 and
                  .fields.dataQuality.mapValue.fields.complete.booleanValue==true and
                  .fields.nativeDataPlane.mapValue.fields.storage.stringValue=="FIRESTORE" and
                  .fields.nativeDataPlane.mapValue.fields.sourceAccessDuringInference.booleanValue==false
                ' "$RUNNER_TEMP/native-contract-snapshot.json" >/dev/null 2>&1; then
                  native_contract=true
                  contract_ready=true
                  cp "$RUNNER_TEMP/native-contract-snapshot.json" "$RUNNER_TEMP/snapshot.json"
                  break
                fi
                sleep 30
              done
              if [ "$contract_ready" != "true" ]; then
                echo "NATIVE_SNAPSHOT_CONTRACT_TIMEOUT" >&2
                exit 96
              fi
              jq -n '{
                gate:"CANONICAL_NATIVE_SNAPSHOT_VERIFIED",
                competence:"2026-05",
                storage:"FIRESTORE",
                sourceAccessDuringInference:false,
                productionMutation:false,
                sourceMutation:false
              }' > "$RUNNER_TEMP/rc11-post-evidence/native-snapshot.json"
            fi
          fi
          test "$session_status" = "405"
          jq -e '.ok==false and .code=="METHOD_NOT_ALLOWED"' "$RUNNER_TEMP/session-route.json" >/dev/null
          test "$native_status" = "401"
          jq -e '.ok==false and .code=="AUTH_REQUIRED"' "$RUNNER_TEMP/native-route.json" >/dev/null
          jq -n --argjson repaired "$repaired" --argjson nativeContractBefore "$native_contract_before" --argjson nativeContractAfter "$native_contract" --arg session "$session_status" --arg native "$native_status" --arg targets "$rewrite_targets" --arg projection "$projection_target" '{
            gate:"NATIVE_ROUTES_READY",
            repaired:$repaired,
            nativeContractBefore:$nativeContractBefore,
            nativeContractAfter:$nativeContractAfter,
            sessionLoginStatus:$session,
            nativeInsightStatus:$native,
            targetedDeploy:(($targets | split(",")) + [$projection, "hosting"]),
            productionMutation:false,
            sourceMutation:false
          }' > "$RUNNER_TEMP/rc11-post-evidence/native-routes.json"

      - name: Verify canonical native projection
        env:
          PROJECT_ID: ${{ vars.FIREBASE_HML_PROJECT_ID }}
        run: |
          set -euo pipefail
          access_token="$(gcloud auth print-access-token)"
          auth_header="$(printf '%s: %s %s' 'Authorization' 'Bearer' "$access_token")"
          url="https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents/organizations/wmgj/dashboardSnapshots/current"
          ready=false
          for _ in $(seq 1 40); do
            if curl -fsS -H "$auth_header" "$url" > "$RUNNER_TEMP/native-projection.json" 2>/dev/null && jq -e '
              .fields.competence.stringValue=="2026-05" and
              .fields.nativeDataPlane.mapValue.fields.storage.stringValue=="FIRESTORE" and
              .fields.nativeDataPlane.mapValue.fields.sourceAccessDuringInference.booleanValue==false and
              (.fields.financialCents.mapValue.fields.invoicedCents.integerValue|tonumber)==4950000 and
              (.fields.financialCents.mapValue.fields.receivedCents.integerValue|tonumber)==4950000 and
              (.fields.financialCents.mapValue.fields.outstandingCents.integerValue|tonumber)==0 and
              .fields.dataQuality.mapValue.fields.complete.booleanValue==true
            ' "$RUNNER_TEMP/native-projection.json" >/dev/null 2>&1; then ready=true; break; fi
            sleep 30
          done
          test "$ready" = true
          jq '{
            gate:"CANONICAL_NATIVE_PROJECTION_VERIFIED",
            snapshotId:.fields.snapshotId.stringValue,
            competence:.fields.competence.stringValue,
            storage:.fields.nativeDataPlane.mapValue.fields.storage.stringValue,
            sourceAccessDuringInference:.fields.nativeDataPlane.mapValue.fields.sourceAccessDuringInference.booleanValue,
            productionMutation:false,
            sourceMutation:false
          }' "$RUNNER_TEMP/native-projection.json" > "$RUNNER_TEMP/rc11-post-evidence/native-projection.json"

      - name: Test native intelligence against real HML data
        env:
          PROJECT_ID: ${{ vars.FIREBASE_HML_PROJECT_ID }}
          DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
          SMOKE_UID: ${{ vars.FIREBASE_HML_SMOKE_UID }}
        run: |
          set -euo pipefail
          d="$(mktemp -d "$RUNNER_TEMP/rc11-native.XXXXXX")"; trap 'rm -rf "$d"' EXIT
          access_token="$(gcloud auth print-access-token)"
          apps="$(curl -fsS -H "Authorization: Bearer ${access_token}" "https://firebase.googleapis.com/v1beta1/projects/${PROJECT_ID}/webApps?pageSize=100")"
          app_name="$(jq -r '[.apps[]?|select(.state=="ACTIVE")]|first|.name//empty' <<<"$apps")"; test -n "$app_name"
          api_key="$(curl -fsS -H "Authorization: Bearer ${access_token}" "https://firebase.googleapis.com/v1beta1/${app_name}/config" | jq -r '.apiKey//empty')"; test -n "$api_key"
          now="$(date +%s)"; exp="$((now+3000))"
          jq -nc --arg iss "$DEPLOY_SERVICE_ACCOUNT" --arg sub "$DEPLOY_SERVICE_ACCOUNT" --arg uid "$SMOKE_UID" --arg aud "https://identitytoolkit.googleapis.com/google.identity.identitytoolkit.v1.IdentityToolkit" --argjson iat "$now" --argjson exp "$exp" '{iss:$iss,sub:$sub,aud:$aud,iat:$iat,exp:$exp,uid:$uid}' > "$d/claims.json"
          gcloud iam service-accounts sign-jwt "$d/claims.json" "$d/custom.jwt" --iam-account "$DEPLOY_SERVICE_ACCOUNT" --project "$PROJECT_ID" >/dev/null
          jq -nc --arg token "$(cat "$d/custom.jwt")" '{token:$token,returnSecureToken:true}' > "$d/auth.json"
          auth_status="$(curl --silent --show-error --output "$d/auth-response.json" --write-out '%{http_code}' -H 'Content-Type: application/json' --data-binary @"$d/auth.json" "https://identitytoolkit.googleapis.com/v1/accounts:signInWithCustomToken?key=${api_key}")"
          test "$auth_status" = "200"
          id_token="$(jq -r '.idToken//empty' "$d/auth-response.json")"; test -n "$id_token"
          base_url="https://${PROJECT_ID}.web.app"
          jq -nc --arg idToken "$id_token" '{idToken:$idToken}' > "$d/session.json"
          session_status="$(curl --silent --show-error --output "$d/session-response.json" --write-out '%{http_code}' -X POST -H 'Content-Type: application/json' -H "Origin: ${base_url}" -H 'Sec-Fetch-Site: same-origin' --cookie-jar "$d/cookies.txt" --data-binary @"$d/session.json" "${base_url}/__sessionLogin")"
          if [ "$session_status" != "204" ]; then
            echo "SESSION_LOGIN_HTTP_${session_status}" >&2
            cat "$d/session-response.json" >&2 || true
            exit 93
          fi

          native_snapshot_url="https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents/organizations/wmgj/dashboardSnapshots/current"
          curl -fsS -H "Authorization: Bearer ${access_token}" "$native_snapshot_url" > "$d/native-snapshot.json"
          jq -e '
            .fields.competence.stringValue=="2026-05" and
            (.fields.financialCents.mapValue.fields.invoicedCents.integerValue|tonumber)==4950000 and
            (.fields.financialCents.mapValue.fields.receivedCents.integerValue|tonumber)==4950000 and
            (.fields.financialCents.mapValue.fields.outstandingCents.integerValue|tonumber)==0 and
            .fields.dataQuality.mapValue.fields.complete.booleanValue==true and
            .fields.nativeDataPlane.mapValue.fields.storage.stringValue=="FIRESTORE" and
            .fields.nativeDataPlane.mapValue.fields.sourceAccessDuringInference.booleanValue==false
          ' "$d/native-snapshot.json" >/dev/null
          jq -n '{
            gate:"CANONICAL_NATIVE_SNAPSHOT_VERIFIED",
            competence:"2026-05",
            storage:"FIRESTORE",
            sourceAccessDuringInference:false,
            productionMutation:false,
            sourceMutation:false
          }' > "$RUNNER_TEMP/rc11-post-evidence/native-snapshot.json"

          for intent in REVENUE_RISK SLA_RISK NEXT_ACTION EXECUTIVE; do
            native_status="$(curl --silent --show-error --output "$d/${intent}.json" --write-out '%{http_code}' -H 'Accept: application/json' --cookie "$d/cookies.txt" "${base_url}/api/native-insight?intent=${intent}")"
            if [ "$native_status" != "200" ]; then
              echo "NATIVE_INSIGHT_${intent}_HTTP_${native_status}" >&2
              cat "$d/${intent}.json" >&2 || true
              exit 94
            fi
            jq -e '.ok==true and .insight.engine=="AURORA_NATIVE_INTELLIGENCE" and .insight.externalProviderUsed==false and .insight.source.competence=="2026-05"' "$d/${intent}.json" >/dev/null
          done
          jq -e '[.insight.findings[]?|select(.code=="REVENUE_GAP")]|length==0' "$d/REVENUE_RISK.json" >/dev/null
          jq -e '[.insight.findings[]?|select(.code=="SLA_OVERDUE")]|length==0' "$d/SLA_RISK.json" >/dev/null
          jq -n --arg r "$(jq -r '.insight.headline' "$d/REVENUE_RISK.json")" --arg s "$(jq -r '.insight.headline' "$d/SLA_RISK.json")" --arg n "$(jq -r '.insight.headline' "$d/NEXT_ACTION.json")" --arg e "$(jq -r '.insight.headline' "$d/EXECUTIVE.json")" '{
            gate:"NATIVE_INSIGHT_VERIFIED",
            externalProviderUsed:false,
            revenueHeadline:$r,
            slaHeadline:$s,
            nextActionHeadline:$n,
            executiveHeadline:$e
          }' > "$RUNNER_TEMP/rc11-post-evidence/native-intelligence.json"

      - name: Verify final Apps Script kill switch
        if: always()
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          PROJECT_ID: ${{ vars.FIREBASE_HML_PROJECT_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rc11-post-evidence"
          npm install -g @google/clasp@3.4.1
          umask 077
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          mkdir -p "$RUNNER_TEMP/build-appscript"
          printf '{"scriptId":"%s","projectId":"%s","rootDir":"."}\n' "$APPS_SCRIPT_ID" "$PROJECT_ID" > "$RUNNER_TEMP/build-appscript/.clasp.json"
          cd "$RUNNER_TEMP/build-appscript"
          bash "$GITHUB_WORKSPACE/tools/run-clasp-checked.sh" auroraRc11KillSwitch "$RUNNER_TEMP/rc11-final-kill.json"
          jq -e '.response.ok==true and .response.dryRun==true' "$RUNNER_TEMP/rc11-final-kill.json" >/dev/null
          bash "$GITHUB_WORKSPACE/tools/run-clasp-checked.sh" auroraRc11InspecionarConfiguracao "$RUNNER_TEMP/rc11-final-config.json"
          jq -e '.response.ok==true and .response.dryRun==true and .response.hmacConfigured==true' "$RUNNER_TEMP/rc11-final-config.json" >/dev/null
          real_sample_verified=false
          reconciled=false
          shadow_verified=false
          native_verified=false
          if [ -f "$RUNNER_TEMP/rc11-post-evidence/reconciliation.json" ]; then
            real_sample_verified=true
            reconciled=true
          fi
          if [ -f "$RUNNER_TEMP/rc11-post-evidence/shadow-snapshot.json" ]; then
            shadow_verified=true
          fi
          if [ -f "$RUNNER_TEMP/rc11-post-evidence/native-intelligence.json" ]; then
            native_verified=true
          fi
          jq -n \
            --argjson realSample "$real_sample_verified" \
            --argjson reconciled "$reconciled" \
            --argjson shadowVerified "$shadow_verified" \
            --argjson nativeVerified "$native_verified" '{
            release:"1.0.0-rc.1",
            gate:"RC1.1_POST_INGEST",
            realWmgjSample:$realSample,
            reconciled:$reconciled,
            shadowVerified:$shadowVerified,
            nativeInsightVerified:$nativeVerified,
            killSwitch:true,
            productionMutation:false,
            sourceMutation:false
          }' > "$RUNNER_TEMP/rc11-post-evidence/final-gate.json"
          test "$real_sample_verified" = true
          test "$reconciled" = true
          test "$shadow_verified" = true
          test "$native_verified" = true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2; Node 24
        if: always()
        with:
          name: aurora-rc11-post-ingest-evidence
          path: ${{ runner.temp }}/rc11-post-evidence/
          if-no-files-found: warn
          retention-days: 30
