name: Production Deploy Gate (disabled)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Keep true until every protected approval is complete"
        required: true
        default: true
        type: boolean
      release_tag:
        description: "Exact approved immutable release tag"
        required: true
        type: string
      commit_sha:
        description: "Exact approved commit SHA"
        required: true
        type: string
      target_environment:
        description: "Protected GitHub Environment name"
        required: true
        type: string

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      permitted: ${{ steps.guard.outputs.permitted }}
    steps:
      - id: guard
        env:
          ENABLE_PRODUCTION_DEPLOY: ${{ vars.ENABLE_PRODUCTION_DEPLOY }}
          ENABLE_REAL_DATA_MIGRATION: ${{ vars.ENABLE_REAL_DATA_MIGRATION }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          echo "permitted=false" >> "$GITHUB_OUTPUT"
          test "$DRY_RUN" = "true"
          test "$ENABLE_PRODUCTION_DEPLOY" != "true"
          test "$ENABLE_REAL_DATA_MIGRATION" != "true"
          echo "Prepared only: deployment and migration remain disabled."

  deploy:
    if: ${{ false }}
    needs: guard
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: python -m pip install uv==0.8.15
      - name: Validate immutable target
        env:
          EXPECTED_SHA: ${{ inputs.commit_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git tag --points-at HEAD)" = "$RELEASE_TAG"
      - name: Deploy FastAPI Cloud (unreachable until a reviewed workflow change)
        working-directory: app-foundation/api
        env:
          FASTAPI_CLOUD_TOKEN: ${{ secrets.FASTAPI_CLOUD_TOKEN }}
          FASTAPI_CLOUD_APP_ID: ${{ secrets.FASTAPI_CLOUD_APP_ID }}
        run: uv run fastapi cloud deploy . --json
