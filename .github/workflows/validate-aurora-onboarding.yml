name: Validate Aurora Onboarding

on:
  pull_request:
    paths:
      - 'aurora-coletor/**'
      - 'src/01_PIPELINE_CONFIABILIDADE_WMGJ.gs'
      - 'src/04_EXTRACAO_DOCUMENTAL_WMGJ.gs'
      - 'src/35_AURORA_FIRESTORE_BRIDGE_WMGJ.gs'
      - 'src/37_AURORA_CONECTORES_PLUG_AND_PLAY.gs'
      - '.github/workflows/validate-aurora-onboarding.yml'
  push:
    branches: [main]
    paths:
      - 'aurora-coletor/**'
      - '.github/workflows/validate-aurora-onboarding.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aurora-onboarding-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cloud-sync:
    name: Canonical sync transport (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synthetic transport, receipt and isolation tests
        run: python -m unittest discover -s aurora-coletor/tests -p test_cloud_sync.py -v

  validate:
    name: Test local discovery without deployment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile installer and onboarding module
        run: python -m py_compile aurora-coletor/install.py aurora-coletor/one_click_deploy.py aurora-coletor/connector_setup.py aurora-coletor/aurora_onboarding.py
      - name: Synthetic scope and capability tests
        run: python -m unittest discover -s aurora-coletor/tests -p 'test_onboarding.py' -v
      - name: Plug-and-play connector and one-click tests
        run: python -m unittest discover -s aurora-coletor/tests -p 'test_connector_setup.py' -v
      - name: Parse Apps Script connector path
        run: |
          cp src/01_PIPELINE_CONFIABILIDADE_WMGJ.gs "$RUNNER_TEMP/pipeline.js"
          cp src/04_EXTRACAO_DOCUMENTAL_WMGJ.gs "$RUNNER_TEMP/extraction.js"
          cp src/35_AURORA_FIRESTORE_BRIDGE_WMGJ.gs "$RUNNER_TEMP/firestore-bridge.js"
          cp src/37_AURORA_CONECTORES_PLUG_AND_PLAY.gs "$RUNNER_TEMP/connectors.js"
          node --check "$RUNNER_TEMP/pipeline.js"
          node --check "$RUNNER_TEMP/extraction.js"
          node --check "$RUNNER_TEMP/firestore-bridge.js"
          node --check "$RUNNER_TEMP/connectors.js"
