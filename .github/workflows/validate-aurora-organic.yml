name: Validate Aurora Organic Integration

on:
  pull_request:
    paths:
      - 'firebase-migration/**'
      - 'scripts/aurora/**'
      - 'policy/aurora-external-ai-reduction-policy.md'
      - 'config/aurora-kpi-baseline.json'
      - 'aurora-coletor/aurora_organic.py'
      - 'skills/aurora-nexus-organic/**'
      - 'AGENTS.md'
      - '.github/workflows/validate-aurora-organic.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aurora-organic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: firebase-migration/functions/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify robot execution contracts
        run: |
          node --test scripts/aurora/windows_online_robot_orchestrator.test.js
          node scripts/aurora/windows_online_robot_orchestrator.js --execute-local > robot-execution.json
      - name: Install locked dependencies
        working-directory: firebase-migration/functions
        run: npm ci --ignore-scripts
      - name: Typecheck complete Functions application
        working-directory: firebase-migration/functions
        run: npm run build
      - name: Test organic integration and preserve evidence
        working-directory: firebase-migration/functions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../../organic-evidence
          node --import tsx --test test/aurora-organic-integration.test.ts | tee ../../organic-evidence/organic-tests.tap
      - name: Package exact source and build provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p organic-evidence
          git rev-parse HEAD > organic-evidence/source-commit.txt
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, subprocess, zipfile
          prefixes = ('firebase-migration/functions/src/', 'firebase-migration/functions/test/', 'firebase-migration/docs/18-', 'skills/aurora-nexus-organic/')
          exact = {'AGENTS.md','firebase-migration/firebase.json','firebase-migration/functions/package.json','firebase-migration/functions/package-lock.json','firebase-migration/functions/tsconfig.json','aurora-coletor/aurora_organic.py','aurora-coletor/tests/test_organic.py','.github/workflows/validate-aurora-organic.yml'}
          paths = sorted(p for p in subprocess.check_output(['git','ls-files'],text=True).splitlines() if p in exact or p.startswith(prefixes))
          hashes = {}
          with zipfile.ZipFile('organic-evidence/AURORA-NEXUS-Organic-1.1.0-HML-source.zip','w',zipfile.ZIP_DEFLATED) as out:
            for name in paths:
              data = Path(name).read_bytes()
              hashes[name] = hashlib.sha256(data).hexdigest()
              out.writestr(name,data)
          Path('organic-evidence/source-sha256.json').write_text(json.dumps(hashes,indent=2)+'\n')
          artifact = Path('organic-evidence/AURORA-NEXUS-Organic-1.1.0-HML-source.zip')
          Path('organic-evidence/SHA256SUMS.txt').write_text(hashlib.sha256(artifact.read_bytes()).hexdigest()+'  '+artifact.name+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: aurora-organic-1.1.0-hml-${{ github.run_id }}
          path: |
            organic-evidence/
            robot-execution.json
          if-no-files-found: error
          retention-days: 30


  windows-robot-contract:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Windows subprocess and timeout contracts
        run: node --test scripts/aurora/windows_online_robot_orchestrator.test.js
