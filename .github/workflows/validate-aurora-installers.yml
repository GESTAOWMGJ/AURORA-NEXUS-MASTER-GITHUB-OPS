name: Validate Aurora Installers
on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'aurora-coletor/**'
      - 'skills/aurora-nexus-organic/**'
      - 'AGENTS.md'
      - 'firebase-migration/functions/src/**'
      - 'firebase-migration/functions/package*.json'
      - 'firebase-migration/functions/tsconfig.json'
      - 'firebase-migration/scripts/build-release-manifests.mjs'
      - 'firebase-migration/scripts/release-component-packages.mjs'
      - 'firebase-migration/scripts/generate-document-intake-assets.mjs'
      - 'firebase-migration/scripts/atomic-generated-file*'
      - 'firebase-migration/scripts/export-public-unified-release*'
      - 'firebase-migration/scripts/finalize-unified-beta.mjs'
      - 'docs/AURORA_MO_001_WMGJ_MODUS_OPERANDI.md'
      - 'firebase-migration/functions/test/aurora-downloads.test.ts'
      - '.github/workflows/validate-aurora-installers.yml'
      - 'firebase-migration/scripts/*hosting*'
      - '.github/workflows/aurora-rc11-recovery-real-ingest.yml'
      - '.github/workflows/aurora-rc11-post-ingest-finalize.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aurora-installers-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-hml:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 verified 2026-09-28
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned build dependencies before package verification
        run: npm ci --prefix firebase-migration/functions
      - name: Hosting dependency regression and beta client syntax
        run: |
          python3 -m unittest discover -s firebase-migration/scripts -p test_hosting_runtime.py -v
          python3 -m py_compile desktop/install_windows_beta.py
          python3 -m unittest discover -s desktop -p test_windows_beta_bundle.py -v
          node --test firebase-migration/scripts/atomic-generated-file.test.mjs firebase-migration/scripts/export-public-unified-release.test.mjs
      - name: Build and test authenticated local IA Master without model downloads
        run: |
          set -euo pipefail
          python3 -m unittest discover -s desktop/ia-master -p test_build.py -v
          python3 desktop/ia-master/build.py --output "${RUNNER_TEMP}/aurora-ia-master"
          python3 - "${RUNNER_TEMP}/aurora-ia-master/manifest.json" "$(git rev-parse HEAD)" "${RUNNER_TEMP}/aurora-ia-master.zip" <<'PY'
          import hashlib, json, os, pathlib, stat, sys, zipfile
          manifest_path = pathlib.Path(sys.argv[1])
          package_path = pathlib.Path(sys.argv[3])
          root = manifest_path.parent

          def is_link(path):
              return path.is_symlink() or getattr(path, 'is_junction', lambda: False)()

          def safe_name(name):
              assert isinstance(name, str) and name and '\\' not in name and ':' not in name and '\0' not in name, 'Unsafe package name'
              assert not pathlib.PurePosixPath(name).is_absolute() and all(part not in ('', '.', '..') for part in name.split('/')), 'Unsafe package path'
              return name.split('/')

          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  assert key not in result, 'Duplicate manifest key'
                  result[key] = value
              return result

          def regular_file(path):
              assert not is_link(path), 'Linked package file'
              metadata = path.lstat()
              assert stat.S_ISREG(metadata.st_mode) and metadata.st_nlink == 1, 'Package file must be a single regular file'

          assert root.is_dir() and not is_link(root), 'Linked package root'
          resolved_root = root.resolve(strict=True)
          assert manifest_path.name == 'manifest.json'
          regular_file(manifest_path)
          manifest_bytes = manifest_path.read_bytes()
          manifest = json.loads(manifest_bytes, object_pairs_hook=unique_object)
          assert manifest['dirty'] is False, 'Dirty local Master package cannot be retained for installation'
          assert manifest['sourceRevision'] == sys.argv[2], 'Local Master source does not match the checked-out SHA'
          assert manifest['files']['knowledge-registry.cjs'] == 'dc6c99e407faa11adb46e68d798bd49374e54ada820c0f755520fcfec32abbb8', 'Knowledge registry byte hash mismatch'
          files = manifest['files']
          assert isinstance(files, dict) and len(files) == 40 and 'manifest.json' not in files, 'Unexpected local Master file composition'
          assert 'kernel/auroraReliableResult.js' in files, 'Reliable-result kernel missing'
          assert 'published-update.cjs' in files, 'Missing explicit published release consumer'
          agent_names = {'client-agent/' + name for name in ('client_agent.py', 'provider_connectors.py', 'client_secret_store.py', 'install_client_agent.py', 'aurora_cloud_sync.py', 'aurora_deployment.py', 'published_release.py', 'document_intake.py', 'document_intake.cjs', 'document_intake_core.cjs', 'document_fact_mapping.cjs', 'document-intake-manifest.json')}
          assert {name for name in files if name.startswith('client-agent/')} == agent_names, 'Unexpected client agent composition'
          assert manifest['clientAgent']['component'] == 'AURORA_CLIENT_AGENT' and manifest['clientAgent']['version'] == '1.0.5'
          assert manifest['clientAgent']['configured'] is False and manifest['clientAgent']['providerConnectionsVerified'] is False
          assert len({name.casefold() for name in files}) == len(files), 'Case-folded duplicate manifest name'
          expected_names = set(files) | {'manifest.json'}
          expected_directories = set()
          expanded_bytes = {}
          for name, expected in files.items():
              parts = safe_name(name)
              expected_directories.update('/'.join(parts[:index]) for index in range(1, len(parts)))
              target = root
              for part in parts:
                  target = target / part
                  assert not is_link(target), 'Linked package path component'
              regular_file(target)
              assert target.resolve(strict=True).is_relative_to(resolved_root), 'Package path escaped its root'
              data = target.read_bytes()
              assert len(data) <= 8 * 1024 * 1024, 'Oversized package file'
              assert hashlib.sha256(data).hexdigest() == expected, 'Expanded package digest mismatch'
              expanded_bytes[name] = data
          actual_names = set()
          for current, directories, filenames in os.walk(root, followlinks=False):
              for name in directories:
                  directory = pathlib.Path(current) / name
                  assert directory.is_dir() and not is_link(directory), 'Linked package directory'
                  relative = directory.relative_to(root).as_posix()
                  safe_name(relative)
                  assert relative in expected_directories, 'Unexpected package directory'
              for name in filenames:
                  target = pathlib.Path(current) / name
                  regular_file(target)
                  relative = target.relative_to(root).as_posix()
                  safe_name(relative)
                  actual_names.add(relative)
          assert actual_names == expected_names, 'Expanded package has extra or missing files'
          regular_file(package_path)
          assert package_path.resolve(strict=True) == resolved_root.with_suffix('.zip'), 'Uploaded archive is not the source-bound package ZIP'
          with zipfile.ZipFile(package_path) as package:
              entries = package.infolist()
              names = [entry.filename for entry in entries]
              for name in names:
                  safe_name(name)
              assert len(set(names)) == len(names) and len({name.casefold() for name in names}) == len(names), 'Duplicate ZIP entry'
              assert len(entries) == 41 and set(names) == expected_names, 'ZIP has extra or missing files'
              assert sum(entry.file_size for entry in entries) <= 16 * 1024 * 1024, 'Oversized package ZIP'
              for entry in entries:
                  assert not entry.is_dir() and stat.S_IFMT(entry.external_attr >> 16) in (0, stat.S_IFREG), 'Linked or non-regular ZIP entry'
                  assert not entry.flag_bits & 1, 'Encrypted ZIP entry'
                  expected_data = manifest_bytes if entry.filename == 'manifest.json' else expanded_bytes[entry.filename]
                  assert entry.file_size == len(expected_data) and entry.file_size <= 8 * 1024 * 1024, 'ZIP entry size mismatch'
                  data = package.read(entry)
                  assert data == expected_data, 'ZIP entry differs from the expanded package'
                  expected_hash = hashlib.sha256(manifest_bytes).hexdigest() if entry.filename == 'manifest.json' else files[entry.filename]
                  assert hashlib.sha256(data).hexdigest() == expected_hash, 'ZIP entry digest mismatch'
          assert manifest_path.read_bytes() == manifest_bytes, 'Expanded manifest changed during verification'
          for name, data in expanded_bytes.items():
              assert (root / name).read_bytes() == data, 'Expanded package changed during verification'
          print('LOCAL_MASTER_CLEAN_EXACT_SOURCE_FILES_AND_ZIP_VERIFIED')
          PY
          AURORA_TEST_BUILD="${RUNNER_TEMP}/aurora-ia-master" AURORA_STUDIO_TEST_GIT="$(command -v git)" \
            node --test desktop/ia-master/server.test.cjs desktop/ia-master/studio.test.cjs desktop/ia-master/knowledge-registry.test.cjs desktop/ia-master/editorial-knowledge.test.cjs desktop/ia-master/update.test.cjs desktop/ia-master/published-update.test.cjs desktop/ia-master/safe-read.test.cjs desktop/ia-master/studio-local.test.cjs desktop/ia-master/publisher.test.cjs
      - name: Published release verification and Windows integration consumer tests
        run: |
          set -euo pipefail
          python3 -m pip install -r aurora-coletor/requirements-release-verification.txt
          npm run build --prefix firebase-migration/functions
          python3 -m unittest discover -s aurora-coletor/tests -p test_published_release.py -v
          python3 -m unittest discover -s desktop -p test_unified_beta.py -v
      - name: Retain local IA Master candidate with exact source manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: aurora-ia-master-${{ github.run_id }}
          path: ${{ runner.temp }}/aurora-ia-master.zip
          if-no-files-found: error
          retention-days: 7
      - name: Organic proposal tests with synthetic verification only
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/aurora-hml-installers"
          python3 -m unittest discover -s aurora-coletor/tests -p test_organic.py -v 2>&1 | tee "${RUNNER_TEMP}/aurora-hml-installers/organic-tests.txt"
      - name: Installer unit tests and isolated package build
        run: |
          set -euo pipefail
          python3 desktop/build_installers.py --output "${RUNNER_TEMP}/aurora-hml-installers" 2>&1 | tee "${RUNNER_TEMP}/aurora-hml-installers/packaging-tests.txt"
      - name: Private download authorization and integrity tests
        run: |
          set -euo pipefail
          node --import ./firebase-migration/functions/node_modules/tsx/dist/loader.mjs --test firebase-migration/functions/test/aurora-downloads.test.ts firebase-migration/functions/test/aurora-unified-download.test.ts 2>&1 | tee "${RUNNER_TEMP}/aurora-hml-installers/download-tests.txt"
      - name: Verify source-bound server, web and satellite release manifests
        run: |
          set -euo pipefail
          npm run build --prefix firebase-migration/functions
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil
          source = pathlib.Path(os.environ['RUNNER_TEMP']) / 'aurora-hml-installers'
          destination = pathlib.Path('firebase-migration/functions/private-downloads')
          manifest = json.loads((source / 'manifest.json').read_text())
          destination.mkdir(parents=True, exist_ok=True)
          for entry in manifest['files']:
              name = entry['name']
              assert pathlib.Path(name).name == name and pathlib.Path(name).suffix in ('.zip', '.exe')
              data = (source / name).read_bytes()
              assert len(data) == entry['size'] and hashlib.sha256(data).hexdigest() == entry['sha256']
              shutil.copyfile(source / name, destination / name)
          shutil.copyfile(source / 'manifest.json', destination / 'manifest.json')
          PY
          node firebase-migration/scripts/build-release-manifests.mjs
          cp firebase-migration/functions/runtime-release/unified-beta-candidate.zip "${RUNNER_TEMP}/aurora-hml-installers/AURORA-NEXUS-Beta-CANDIDATE.zip"
      - name: Capture exact source and toolchain for restricted review
        run: |
          set -euo pipefail
          git rev-parse HEAD > "${RUNNER_TEMP}/aurora-hml-installers/source-commit.txt"
          go version > "${RUNNER_TEMP}/aurora-hml-installers/build-environment.txt"
          python3 --version >> "${RUNNER_TEMP}/aurora-hml-installers/build-environment.txt"
          node --version >> "${RUNNER_TEMP}/aurora-hml-installers/build-environment.txt"
          git archive --format=zip HEAD desktop/build_installers.py aurora-coletor/aurora_onboarding.py aurora-coletor/aurora_organic.py aurora-coletor/tests/test_organic.py skills/aurora-nexus-organic/SKILL.md AGENTS.md > "${RUNNER_TEMP}/aurora-hml-installers/AURORA-NEXUS-source-review.zip"
      - name: Retain authenticated review artifacts only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: aurora-hml-organic-${{ github.run_id }}
          path: ${{ runner.temp }}/aurora-hml-installers/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
      - name: Record scope of validation
        run: |
          echo 'HML clients built and synthetic tests passed. No Firebase deployment, authenticated event integration, user-device installation, signing, notarization or portal publication performed. No database created.' >> "$GITHUB_STEP_SUMMARY"
