name: Deploy Apps Script WMGJ

on:
  push:
    branches:
      - main
    paths:
      - 'src/**/*.gs'
      - 'tools/**/*.js'
      - 'tools/**/*.sh'
      - 'appsscript.json'
      - '.github/workflows/deploy-appscript.yml'

permissions:
  contents: read

concurrency:
  group: aurora-hml-runtime-mutation
  cancel-in-progress: false

jobs:
  deploy:
    name: Push code to Google Apps Script
    runs-on: ubuntu-latest
    environment: firebase-homologation
    env:
      APPS_SCRIPT_ID: 1_fQPqaq0EjaugyIF6jyuENDhJ2c2oTFm1kC-wdjmfaDqyRzy_uqwtiSW
      APPS_SCRIPT_GCP_PROJECT_ID: wmgj-hml-jfn-20260927

    steps:
      - name: Checkout exact push commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned 2026-10-01
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Require exact current main before credentials
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags --prune --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$GITHUB_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 pinned 2026-10-01
        with:
          node-version: '22'

      - name: Audit Apps Script source boundaries
        run: node tools/audit-appscript.js

      - name: Install clasp
        run: npm install -g @google/clasp@3.4.1

      - name: Validate required credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          set -euo pipefail
          test -n "$APPS_SCRIPT_ID" || (echo "Missing APPS_SCRIPT_ID" && exit 1)
          test -n "$CLASPRC_JSON" || (echo "Missing CLASPRC_JSON secret" && exit 1)

      - name: Configure clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$CLASPRC_JSON"
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json

      - name: Prepare Apps Script project files
        run: |
          mkdir -p build-appscript
          cp appsscript.json build-appscript/appsscript.json
          cp src/*.gs build-appscript/
          cat > build-appscript/.clasp.json <<EOF
          {
            "scriptId": "$APPS_SCRIPT_ID",
            "projectId": "$APPS_SCRIPT_GCP_PROJECT_ID",
            "rootDir": "."
          }
          EOF

      - name: Push to Apps Script
        working-directory: build-appscript
        run: clasp push --force

      - name: Publish canonical Apps Script Execution API deployment
        working-directory: build-appscript
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/tools/ensure-appscript-execution-deployment.sh" "$RUNNER_TEMP/appscript-deployment.json"
          jq -e --arg sha "$GITHUB_SHA" --arg description "AURORA_EXECUTION_API_CANONICAL $GITHUB_SHA" '
            (keys | sort) == (["deploymentId","description","reused","sourceSha","versionNumber"] | sort) and
            (.deploymentId | type=="string" and test("^[A-Za-z0-9_-]{20,512}$")) and
            (.versionNumber | type)=="number" and
            (.versionNumber | floor)==.versionNumber and
            .versionNumber>=1 and
            .description==$description and
            .sourceSha==$sha and
            (.reused | type=="boolean")
          ' "$RUNNER_TEMP/appscript-deployment.json" >/dev/null
          execution_deployment_id="$(jq -r '.deploymentId' "$RUNNER_TEMP/appscript-deployment.json")"
          printf 'APPS_SCRIPT_EXECUTION_DEPLOYMENT_ID=%s\n' "$execution_deployment_id" >> "$GITHUB_ENV"

      - name: Verify deployed source
        run: |
          set -euo pipefail
          mkdir -p verify-appscript
          cat > verify-appscript/.clasp.json <<EOF
          {
            "scriptId": "$APPS_SCRIPT_ID",
            "rootDir": "."
          }
          EOF
          cd verify-appscript
          clasp pull
          grep -R "v1.2.0-gemini-api-validada" .
          grep -R "diagnosticarSincronizacaoRepositorioWMGJ" .
          grep -R "wmgjFirestoreDiagnostico" .
          grep -R "auroraRc11DryRunAmostra" .

      - name: Validate Apps Script Execution API without operational mutation
        working-directory: build-appscript
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/tools/run-clasp-checked.sh" obterStatusWMGJ "$RUNNER_TEMP/appscript-status.json"
          jq -e '.response.ok==true and .response.status=="ONLINE" and .response.sistema=="WMGJ"' "$RUNNER_TEMP/appscript-status.json" >/dev/null
          bash "$GITHUB_WORKSPACE/tools/run-clasp-checked.sh" auditarSegurancaApiWMGJ "$RUNNER_TEMP/appscript-security.json"
          jq -e '.response.ok==true' "$RUNNER_TEMP/appscript-security.json" >/dev/null

      - name: Preserve deploy-operation separation
        run: |
          echo "Apps Script source deployed and Execution API validated."
          echo "Operational Gmail/dashboard/trigger routines are intentionally not executed by the deploy workflow."

      - name: Upload sanitized Apps Script deployment evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 pinned 2026-10-01
        with:
          name: apps-script-deployment-${{ github.sha }}
          path: ${{ runner.temp }}/appscript-deployment.json
          if-no-files-found: warn
          retention-days: 30
