name: Deploy Apps Script WMGJ

on:
  push:
    branches:
      - main
    paths:
      - 'src/**/*.gs'
      - 'tools/**/*.js'
      - 'tools/**/*.cjs'
      - 'tools/**/*.sh'
      - 'appsscript.json'
      - '.github/workflows/deploy-appscript.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Push code to Google Apps Script
    runs-on: ubuntu-latest
    env:
      APPS_SCRIPT_ID: 1_fQPqaq0EjaugyIF6jyuENDhJ2c2oTFm1kC-wdjmfaDqyRzy_uqwtiSW
      APPS_SCRIPT_GCP_PROJECT_ID: wmgj-hml-jfn-20260927

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Audit Apps Script source boundaries
        run: node tools/audit-appscript.js

      - name: Install clasp
        run: npm install -g @google/clasp@3.4.1

      - name: Validate required credentials
        run: |
          test -n "$APPS_SCRIPT_ID" || (echo "Missing APPS_SCRIPT_ID" && exit 1)
          test -n '${{ secrets.CLASPRC_JSON }}' || (echo "Missing CLASPRC_JSON secret" && exit 1)

      - name: Configure clasp credentials
        run: |
          cat > ~/.clasprc.json <<'EOF'
          ${{ secrets.CLASPRC_JSON }}
          EOF

      - name: Prepare Apps Script project files
        run: |
          mkdir -p build-appscript
          cp appsscript.json build-appscript/appsscript.json
          cp src/*.gs build-appscript/
          cat > build-appscript/.clasp.json <<EOF
          {
            "scriptId": "$APPS_SCRIPT_ID",
            "projectId": "$APPS_SCRIPT_GCP_PROJECT_ID",
            "rootDir": "."
          }
          EOF

      - name: Push to Apps Script
        working-directory: build-appscript
        run: clasp push --force

      - name: Publish canonical Apps Script Execution API deployment
        working-directory: build-appscript
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/tools/ensure-appscript-execution-deployment.sh" "$RUNNER_TEMP/appscript-deployment.json"
          jq -e '.deploymentId and (.versionNumber|tonumber) >= 1' "$RUNNER_TEMP/appscript-deployment.json" >/dev/null

      - name: Verify deployed source
        run: |
          set -euo pipefail
          mkdir -p verify-appscript
          cat > verify-appscript/.clasp.json <<EOF
          {
            "scriptId": "$APPS_SCRIPT_ID",
            "rootDir": "."
          }
          EOF
          cd verify-appscript
          clasp pull
          grep -R "v1.2.0-gemini-api-validada" .
          grep -R "diagnosticarSincronizacaoRepositorioWMGJ" .
          grep -R "wmgjFirestoreDiagnostico" .
          grep -R "auroraRc11DryRunAmostra" .

      - name: Validate Apps Script Execution API without operational mutation
        working-directory: build-appscript
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/tools/run-clasp-checked.sh" obterStatusWMGJ "$RUNNER_TEMP/appscript-status.json"
          jq -e '.response.ok==true and .response.status=="ONLINE" and .response.sistema=="WMGJ"' "$RUNNER_TEMP/appscript-status.json" >/dev/null
          bash "$GITHUB_WORKSPACE/tools/run-clasp-checked.sh" auditarSegurancaApiWMGJ "$RUNNER_TEMP/appscript-security.json"
          jq -e '.response.ok==true' "$RUNNER_TEMP/appscript-security.json" >/dev/null

      - name: Read authorized connector binding without operational activation
        working-directory: build-appscript
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f "$RUNNER_TEMP/connector-status.raw.json" "$RUNNER_TEMP/connector-status.sanitized.tmp"' EXIT
          bash "$GITHUB_WORKSPACE/tools/run-clasp-checked.sh" auroraLerStatusConectoresPlugAndPlay "$RUNNER_TEMP/connector-status.raw.json" '["wmgj"]'
          node "$GITHUB_WORKSPACE/tools/sanitize-connector-status.js" "$RUNNER_TEMP/connector-status.raw.json" > "$RUNNER_TEMP/connector-status.sanitized.tmp"
          mv "$RUNNER_TEMP/connector-status.sanitized.tmp" "$RUNNER_TEMP/connector-status.json"
          cat "$RUNNER_TEMP/connector-status.json"

      - name: Preserve sanitized connector status
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 pinned in existing recovery workflow
        with:
          name: appscript-connector-status
          path: ${{ runner.temp }}/connector-status.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Preview reuse of the existing WMGJ source without configuring or activating
        run: |
          set -euo pipefail
          node --test tools/test-aurora-wmgj-reuse-preview.cjs
          policy="firebase-migration/policy/hml-owner-release-approval-v1.json"
          if jq -e '
            .scope.continuousDriveDecisionId=="AURORA-HML-CONTINUOUS-DRIVE-20261026"
            and .scope.continuousDriveScopeSha256=="d3978b0f743ab22021c586b5d85c731beca34a6c03306609f33e64d512ab19fa"
            and ((.reaffirmations // []) | any(
              .decisionId=="AURORA-HML-CONTINUOUS-DRIVE-20261026"
              and .exactPrivateScopeSha256=="d3978b0f743ab22021c586b5d85c731beca34a6c03306609f33e64d512ab19fa"
              and .continuousDriveTriggerAuthorized==true
              and .processExistingAuthorized==true
              and .queueMetadataRemediationAuthorized==true
              and .realSourceActivationAuthorized==true
              and .sourceMutationAuthorized==false
              and .newSourceEnrollmentAuthorized==false
              and .productionAuthorized==false
              and .clinicalSensitiveAuthorized==false
              and ((.validUntilUtc | fromdateiso8601) > now)
            ))
          ' "$policy" >/dev/null; then
            jq -n \
              --arg decision "AURORA-HML-CONTINUOUS-DRIVE-20261026" \
              --arg scope "d3978b0f743ab22021c586b5d85c731beca34a6c03306609f33e64d512ab19fa" \
              '{
                schemaVersion:"aurora.connector-reuse-preview-superseded.v1",
                ok:true,
                code:"AURORA_CONNECTOR_REUSE_PREVIEW_SUPERSEDED",
                state:"SUPERSEDED_BY_EXACT_SCOPE_CONTINUOUS_DECISION",
                decisionId:$decision,
                privateScopeSha256:$scope,
                historicalPreviewExecuted:false,
                configOnly:true,
                contentRead:false,
                credentialsExported:false,
                sourceMutation:false,
                productionMutation:false
              }' > "$RUNNER_TEMP/connector-reuse-preview.json"
          else
            node tools/aurora-wmgj-reuse-preview.cjs
          fi

      - name: Preserve metadata-only existing-source preview
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: appscript-existing-source-preview
          path: ${{ runner.temp }}/connector-reuse-preview.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Preserve deploy-operation separation
        run: |
          echo "Apps Script source deployed and Execution API validated."
          echo "Operational Gmail/dashboard/trigger routines are intentionally not executed by the deploy workflow."

