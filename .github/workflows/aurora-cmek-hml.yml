name: Aurora CMEK HML

on:
  push:
    branches:
      - feat/aurora-sec-002-cmek-lgpd-pack-20261001
    paths:
      - ".github/requests/aurora-cmek-hml.json"
  workflow_dispatch:
    inputs:
      mode:
        description: "plan, apply, restore-test or key-failure-test"
        required: true
        type: choice
        options:
          - plan
          - apply
          - restore-test
          - key-failure-test
        default: plan
      confirmation:
        description: "Exact confirmation required for mutating modes"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: aurora-hml-runtime-mutation
  cancel-in-progress: false

jobs:
  cmek:
    name: CMEK HML guarded operation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: firebase-homologation
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: wmgj-hml-jfn-20260927
      SCRIPT: firebase-migration/scripts/aurora-cmek-hml.sh
      POLICY: firebase-migration/policy/cmek-hml-baseline-v1.json
      REQUEST_FILE: .github/requests/aurora-cmek-hml.json
    steps:
      - name: Checkout exact workflow SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned 2026-10-01
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Resolve guarded request
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            test "$GITHUB_REF_NAME" = "feat/aurora-sec-002-cmek-lgpd-pack-20261001"
            test -f "$REQUEST_FILE"
            jq -e '
              .projectId=="wmgj-hml-jfn-20260927" and
              .databaseId=="aurora-hml-cmek" and
              .productionMutation==false and
              .clinicalSensitiveEnabled==false and
              .realDataAllowed==false and
              (.mode=="plan" or .mode=="apply" or .mode=="restore-test" or .mode=="key-failure-test")
            ' "$REQUEST_FILE" >/dev/null
            mode="$(jq -r '.mode' "$REQUEST_FILE")"
            confirmation="$(jq -r '.confirmation // ""' "$REQUEST_FILE")"
          else
            mode="$INPUT_MODE"
            confirmation="$INPUT_CONFIRMATION"
          fi

          case "$mode" in
            plan)
              test -z "$confirmation"
              ;;
            apply)
              test "$confirmation" = "APPLY_AURORA_CMEK_HML"
              ;;
            restore-test)
              test "$confirmation" = "RESTORE_AURORA_CMEK_HML"
              ;;
            key-failure-test)
              test "$confirmation" = "TEST_AURORA_CMEK_KEY_FAILURE_HML"
              ;;
            *)
              exit 64
              ;;
          esac

          {
            echo "MODE=$mode"
            echo "AURORA_CMEK_CONFIRMATION=$confirmation"
          } >> "$GITHUB_ENV"

      - name: Static safety gates
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bash -n "$SCRIPT"
          node firebase-migration/scripts/validate-cmek-hml-baseline.mjs
          ! grep -Eq 'firestore databases delete|kms versions destroy|kms keys delete|projects delete|billing projects unlink' "$SCRIPT"

      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2 pinned 2026-10-01
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_FIREBASE_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2 pinned 2026-10-01
        with:
          version: "548.0.0"
          project_id: wmgj-hml-jfn-20260927

      - name: Verify HML identity only
        env:
          EXPECTED_ACCOUNT: ${{ vars.GCP_FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test "$(gcloud auth list --filter='status:ACTIVE' --format='value(account)')" = "$EXPECTED_ACCOUNT"
          test "$(gcloud config get-value project 2>/dev/null)" = "wmgj-hml-jfn-20260927"

      - name: Execute selected HML mode
        run: |
          set -uo pipefail
          evidence="$RUNNER_TEMP/aurora-cmek-hml-evidence"
          mkdir -p "$evidence"
          set +e
          "$SCRIPT" "$MODE" 2>&1 | tee "$evidence/result.txt"
          rc=${PIPESTATUS[0]}
          set -e
          jq -n             --arg mode "$MODE"             --arg sha "$GITHUB_SHA"             --arg runId "$GITHUB_RUN_ID"             --arg project "wmgj-hml-jfn-20260927"             --argjson exitCode "$rc"             '{control:"AURORA-SEC-002-CMEK-HML", mode:$mode, sha:$sha, runId:$runId, project:$project, exitCode:$exitCode, productionMutation:false, clinicalSensitiveEnabled:false, realDataAllowed:false}'             > "$evidence/metadata.json"
          exit "$rc"

      - name: Retain HML evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 pinned 2026-10-01
        with:
          name: aurora-cmek-hml-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/aurora-cmek-hml-evidence/
          if-no-files-found: warn
          retention-days: 90
