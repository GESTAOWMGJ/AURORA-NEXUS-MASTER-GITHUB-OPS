name: Validate Gmail Ingestion Contract
on:
  pull_request:
    paths:
      - 'src/*.gs'
      - 'tools/test-gmail*.cjs'
      - 'tools/test-drive*.js'
      - 'tools/test-aurora-drive-ingest-run.cjs'
      - 'tools/aurora-drive-ingest-run.cjs'
      - 'tools/test-financial-ingestion-parity.cjs'
      - 'firebase-migration/functions/src/policy.ts'
      - 'firebase-migration/functions/src/types.ts'
      - 'firebase-migration/functions/src/validation.ts'
      - '.github/workflows/aurora-rc11-recovery-real-ingest.yml'
      - 'firebase-migration/functions/src/auroraNativeRoutines.ts'
      - 'docs/AURORA_GMAIL_SINGLE_MESSAGE_RECOVERY.md'
      - '.github/workflows/validate-gmail-ingestion.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tools/audit-appscript.js
      - run: node --test tools/test-gmail-ingestion.cjs tools/test-gmail-replay.cjs tools/test-drive-full-ingest.js tools/test-drive-activation.js tools/test-aurora-drive-ingest-run.cjs tools/test-financial-ingestion-parity.cjs
