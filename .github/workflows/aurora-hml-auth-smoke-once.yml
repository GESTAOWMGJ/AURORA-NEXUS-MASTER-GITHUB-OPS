name: Aurora HML Auth Smoke Once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/aurora-hml-auth-smoke-once.yml

permissions:
  contents: read
  id-token: write

jobs:
  smoke:
    name: HML authenticated smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: firebase-homologation
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned 2026-10-01
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 pinned 2026-10-01
        with:
          node-version: "22"
      - name: Require canonical HTTPS and HML routing before cloud authentication
        env:
          PROJECT_ID: ${{ vars.FIREBASE_HML_PROJECT_ID }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node firebase-migration/scripts/check-canonical-preflight.mjs "$PROJECT_ID"
      - name: Authenticate to HML with WIF
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2 pinned 2026-10-01
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_FIREBASE_DEPLOY_SERVICE_ACCOUNT }}

      - name: Configure gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2 pinned 2026-10-01
        with:
          version: "548.0.0"
          project_id: ${{ vars.FIREBASE_HML_PROJECT_ID }}

      - name: Validate HML login and organic runtime
        env:
          PROJECT_ID: ${{ vars.FIREBASE_HML_PROJECT_ID }}
          DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
          SMOKE_UID: ${{ vars.FIREBASE_HML_SMOKE_UID }}
          SMOKE_EMAIL: ${{ vars.FIREBASE_HML_SMOKE_EMAIL }}
        run: |
          set -euo pipefail
          test "$PROJECT_ID" = "wmgj-hml-jfn-20260927"
          test -n "$DEPLOY_SERVICE_ACCOUNT"
          test -n "$SMOKE_UID"
          test -n "$SMOKE_EMAIL"

          base="https://auroranexus.com.br"
          shell="$(curl --fail --silent --show-error --max-time 30 "$base/portal")"
          grep -Fq "Ambiente privado" <<<"$shell"
          if grep -Fq "Operação WMGJ" <<<"$shell"; then
            echo "ANONYMOUS_PRIVATE_DATA_EXPOSED"
            exit 80
          fi

          tmp="$(mktemp -d)"
          trap 'find "$tmp" -type f -delete; rmdir "$tmp"' EXIT

          code="$(curl --silent --show-error --max-time 30 -H 'Accept: application/json' -o "$tmp/anon.json" -w '%{http_code}' "$base/api/bootstrap")"
          test "$code" = "401"
          jq -e '.ok == false and .code == "AUTH_REQUIRED"' "$tmp/anon.json" >/dev/null

          access_token="$(gcloud auth print-access-token)"
          apps_json="$(curl --fail --silent --show-error --max-time 30 -H "Authorization: Bearer ${access_token}" "https://firebase.googleapis.com/v1beta1/projects/${PROJECT_ID}/webApps?pageSize=100")"
          app_name="$(jq -r '[.apps[]? | select(.state == "ACTIVE")] | first | .name // empty' <<<"$apps_json")"
          test -n "$app_name"
          web_config="$(curl --fail --silent --show-error --max-time 30 -H "Authorization: Bearer ${access_token}" "https://firebase.googleapis.com/v1beta1/${app_name}/config")"
          api_key="$(jq -r '.apiKey // empty' <<<"$web_config")"
          test -n "$api_key"

          now="$(date +%s)"
          exp="$((now + 3000))"
          jq -nc --arg iss "$DEPLOY_SERVICE_ACCOUNT" --arg sub "$DEPLOY_SERVICE_ACCOUNT" --arg uid "$SMOKE_UID" --arg aud "https://identitytoolkit.googleapis.com/google.identity.identitytoolkit.v1.IdentityToolkit" --argjson iat "$now" --argjson exp "$exp" '{iss:$iss,sub:$sub,aud:$aud,iat:$iat,exp:$exp,uid:$uid}' > "$tmp/claims.json"
          gcloud iam service-accounts sign-jwt "$tmp/claims.json" "$tmp/custom.jwt" --iam-account "$DEPLOY_SERVICE_ACCOUNT" --project "$PROJECT_ID" >/dev/null

          jq -nc --arg token "$(cat "$tmp/custom.jwt")" '{token:$token,returnSecureToken:true}' > "$tmp/auth.json"
          auth_code="$(curl --silent --show-error --max-time 30 -H 'Content-Type: application/json' --data-binary @"$tmp/auth.json" -o "$tmp/auth-out.json" -w '%{http_code}' "https://identitytoolkit.googleapis.com/v1/accounts:signInWithCustomToken?key=${api_key}")"
          if [ "$auth_code" != "200" ]; then
            echo "CUSTOM_TOKEN_HTTP=$auth_code"
            jq -r '.error.message // "CUSTOM_TOKEN_AUTH_FAILED"' "$tmp/auth-out.json"
            exit 71
          fi

          # signInWithCustomToken does not return localId. Validate identity server-side.
          if ! id_token="$(jq -er '.idToken | select(type == "string" and length > 0)' "$tmp/auth-out.json")"; then
            echo "::error::AUTH_ID_TOKEN_MISSING_OR_INVALID"
            exit 72
          fi
          printf '::add-mask::%s\n' "$id_token"
          lookup_dir="$tmp"
          umask 077
          printf '%s' "$id_token" | jq -Rs '{idToken:.}' > "$lookup_dir/account-lookup-in.json"
          if ! lookup_code="$(curl --silent --show-error --max-time 30 \
            -H 'Content-Type: application/json' \
            --data-binary @"$lookup_dir/account-lookup-in.json" \
            -o "$lookup_dir/account-lookup-out.json" -w '%{http_code}' \
            "https://identitytoolkit.googleapis.com/v1/accounts:lookup?key=${api_key}")"; then
            echo "::error::AUTH_ACCOUNT_LOOKUP_TRANSPORT_FAILED"
            exit 73
          fi
          if [ "$lookup_code" != "200" ]; then
            echo "::error::AUTH_ACCOUNT_LOOKUP_HTTP=$lookup_code"
            exit 74
          fi
          if ! jq -e --arg uid "$SMOKE_UID" '
            (.users | type == "array" and length == 1) and
            (.users[0].localId == $uid) and
            (.users[0].disabled != true)
          ' "$lookup_dir/account-lookup-out.json" >/dev/null; then
            echo "::error::AUTH_SMOKE_ACCOUNT_INVALID"
            exit 75
          fi
          echo "AUTH_SMOKE_UID_VERIFIED"

          jq -nc --arg idToken "$id_token" '{idToken:$idToken}' > "$tmp/session.json"
          curl --fail --silent --show-error --max-time 30 -X POST -H 'Content-Type: application/json' -H "Origin: ${base}" -H 'Sec-Fetch-Site: same-origin' --cookie-jar "$tmp/cookies.txt" --data-binary @"$tmp/session.json" -o /dev/null "$base/__sessionLogin"

          curl --fail --silent --show-error --max-time 30 --cookie "$tmp/cookies.txt" -o "$tmp/private.html" "$base/portal"
          grep -Fq "Operação WMGJ" "$tmp/private.html"

          curl --fail --silent --show-error --max-time 30 -H 'Accept: application/json' --cookie "$tmp/cookies.txt" -o "$tmp/bootstrap.json" "$base/api/bootstrap"
          jq -e --arg email "$SMOKE_EMAIL" '.ok == true and .environment == "HOMOLOGATION" and .mode == "SHADOW" and .organization.id == "wmgj" and .member.email == $email' "$tmp/bootstrap.json" >/dev/null

          curl --fail --silent --show-error --max-time 30 -H 'Accept: application/json' --cookie "$tmp/cookies.txt" -o "$tmp/organic.json" "$base/organic?format=json"
          jq -e '.ok == true and .environment == "HOMOLOGATION" and .mode == "SHADOW" and .enabled == true and (.sectors | index("AUDIT")) != null and (.sectors | index("FINANCE")) != null' "$tmp/organic.json" >/dev/null

          echo "AURORA_HML_AUTH_SMOKE=PASS"
