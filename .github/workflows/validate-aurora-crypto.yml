name: Validate Aurora Cryptography

on:
  pull_request:
    paths:
      - "firebase-migration/functions/src/auroraCryptoEnvelope.ts"
      - "firebase-migration/functions/src/auroraCryptoRuntime.ts"
      - "firebase-migration/functions/src/auroraAccess.ts"
      - "firebase-migration/functions/src/entry.ts"
      - "firebase-migration/functions/test/aurora-crypto-envelope.test.ts"
      - "firebase-migration/functions/test/aurora-crypto-runtime-static.test.ts"
      - "firebase-migration/schemas/crypto-envelope.v1.schema.json"
      - "firebase-migration/policy/security-baseline-v1.json"
      - "firebase-migration/docs/2*-crypto-*.md"
      - "firebase-migration/docs/27-security-questionnaire-cryptography.md"
      - "firebase-migration/docs/28-lgpd-cryptography-control-mapping.md"
      - "firebase-migration/firebase.json"
      - ".github/workflows/validate-aurora-crypto.yml"
      - ".github/workflows/aurora-crypto-hml.yml"
  push:
    branches: [main]
    paths:
      - "firebase-migration/functions/src/auroraCryptoEnvelope.ts"
      - "firebase-migration/functions/src/auroraCryptoRuntime.ts"
      - "firebase-migration/functions/src/auroraAccess.ts"
      - "firebase-migration/functions/src/entry.ts"
      - "firebase-migration/functions/test/aurora-crypto-envelope.test.ts"
      - "firebase-migration/schemas/crypto-envelope.v1.schema.json"
      - "firebase-migration/policy/security-baseline-v1.json"
      - "firebase-migration/firebase.json"
      - ".github/workflows/validate-aurora-crypto.yml"
      - ".github/workflows/aurora-crypto-hml.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crypto:
    name: Crypto build, tests and policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: firebase-migration/functions/package-lock.json

      - name: Install locked Functions dependencies
        run: npm --prefix firebase-migration/functions ci

      - name: Build Functions
        run: npm --prefix firebase-migration/functions run build

      - name: Run cryptographic regression tests
        working-directory: firebase-migration/functions
        run: node --import tsx --test test/aurora-crypto-envelope.test.ts test/aurora-crypto-runtime-static.test.ts

      - name: Validate versioned crypto JSON
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          for (const path of [
            "firebase-migration/schemas/crypto-envelope.v1.schema.json",
            "firebase-migration/policy/security-baseline-v1.json",
            "firebase-migration/firebase.json"
          ]) JSON.parse(fs.readFileSync(path, "utf8"));
          const policy = JSON.parse(fs.readFileSync("firebase-migration/policy/security-baseline-v1.json", "utf8"));
          if (policy.applicationLayerEncryption?.algorithm !== "AES-256-GCM") throw new Error("CRYPTO_POLICY_ALGORITHM_INVALID");
          if (policy.applicationLayerEncryption?.kmsAuthentication !== "WORKLOAD_IDENTITY_METADATA_ADC") throw new Error("CRYPTO_POLICY_IDENTITY_INVALID");
          if (policy.applicationLayerEncryption?.failClosed !== true) throw new Error("CRYPTO_POLICY_FAIL_CLOSED_REQUIRED");
          console.log("AURORA_CRYPTO_POLICY_OK");
          NODE

      - name: Enforce crypto implementation invariants
        run: |
          set -euo pipefail
          src="firebase-migration/functions/src/auroraCryptoEnvelope.ts"
          runtime="firebase-migration/functions/src/auroraCryptoRuntime.ts"
          grep -Fq 'createCipheriv("aes-256-gcm"' "$src"
          grep -Fq 'randomBytes(AURORA_DEK_BYTES)' "$src"
          grep -Fq 'randomBytes(AURORA_GCM_NONCE_BYTES)' "$src"
          grep -Fq 'additionalAuthenticatedData' "$src"
          grep -Fq 'metadata.google.internal' "$src"
          grep -Fq 'dek.fill(0)' "$src"
          grep -Fq 'MFA_REQUIRED' "$runtime"
          grep -Fq 'CSRF_PURPOSES.crypto' "$runtime"
          grep -Fq 'CRYPTO_SELF_TEST_VERIFIED' "$runtime"
          ! grep -Eqi 'BEGIN (RSA |EC |)PRIVATE KEY|client_email.*private_key|GOOGLE_APPLICATION_CREDENTIALS' "$src" "$runtime"

      - name: Confirm market documentation package
        run: |
          set -euo pipefail
          for path in             firebase-migration/docs/23-crypto-key-management-policy.md             firebase-migration/docs/24-cryptographic-architecture-and-pqc-roadmap.md             firebase-migration/docs/25-crypto-hml-deployment-runbook.md             firebase-migration/docs/26-crypto-evidence-register.md             firebase-migration/docs/27-security-questionnaire-cryptography.md             firebase-migration/docs/28-lgpd-cryptography-control-mapping.md
          do
            test -s "$path"
          done
          grep -Fq 'ML-KEM' firebase-migration/docs/24-cryptographic-architecture-and-pqc-roadmap.md
          grep -Fq 'CLINICAL_SENSITIVE' firebase-migration/docs/23-crypto-key-management-policy.md
          grep -Fq 'art. 46' firebase-migration/docs/28-lgpd-cryptography-control-mapping.md
          echo "AURORA_CRYPTO_DOCUMENTATION_OK"
