name: Validate drjoaodefreitas site

on:
  push:
    branches: [main]
    paths:
      - "site-drjoaodefreitas/**"
      - ".github/workflows/validate-site-drjoaodefreitas.yml"
  pull_request:
    paths:
      - "site-drjoaodefreitas/**"
      - ".github/workflows/validate-site-drjoaodefreitas.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-static-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate HTML, assets and Vercel configuration
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import json

          root = Path("site-drjoaodefreitas")
          required = [
              "index.html",
              "privacidade.html",
              "styles.css",
              "site.js",
              "vercel.json",
              "README.md",
          ]

          for name in required:
              path = root / name
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"Missing or empty required file: {path}")

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = set()
                  self.assets = []

              def handle_starttag(self, tag, attrs):
                  data = dict(attrs)
                  element_id = data.get("id")
                  if element_id:
                      if element_id in self.ids:
                          raise SystemExit(f"Duplicate HTML id: {element_id}")
                      self.ids.add(element_id)
                  if tag == "script" and data.get("src"):
                      self.assets.append(data["src"])
                  if tag == "link" and data.get("href"):
                      self.assets.append(data["href"])
                  if tag == "img" and data.get("src"):
                      self.assets.append(data["src"])

          for html_name in ("index.html", "privacidade.html"):
              parser = Parser()
              parser.feed((root / html_name).read_text(encoding="utf-8"))
              for asset in parser.assets:
                  if asset.startswith("/"):
                      target = root / asset.lstrip("/")
                      if not target.is_file():
                          raise SystemExit(f"Broken local asset in {html_name}: {asset}")

          config = json.loads((root / "vercel.json").read_text(encoding="utf-8"))
          if not config.get("headers"):
              raise SystemExit("Security headers are missing from vercel.json")

          index = (root / "index.html").read_text(encoding="utf-8")
          forbidden = ("<form", "googletagmanager", "facebook.com/tr", "connect.facebook.net")
          for marker in forbidden:
              if marker.lower() in index.lower():
                  raise SystemExit(f"Forbidden data-collection marker found: {marker}")

          print("SITE_VALIDATION_OK")
          PY
