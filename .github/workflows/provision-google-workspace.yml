name: Google Workspace aliases — offline plan only

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Safe mode; CI cannot use legacy DWD JSON credentials"
        required: true
        default: offline-plan
        type: choice
        options:
          - offline-plan

permissions:
  contents: read

concurrency:
  group: google-workspace-drjoaodefreitas
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: google-workspace-production
    defaults:
      run:
        working-directory: tools/google-workspace
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned 2026-10-01

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6 pinned 2026-10-01
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Render desired-state plan without Google credentials
        env:
          WORKSPACE_DOMAIN: drjoaodefreitas.com.br
          WORKSPACE_PRIMARY_USER: joao@drjoaodefreitas.com.br
        run: node provision.mjs --offline-plan

      - name: Confirm offline-only CI gate
        run: echo "GOOGLE_WORKSPACE_CI_KEYLESS_GATE=ENFORCED"
