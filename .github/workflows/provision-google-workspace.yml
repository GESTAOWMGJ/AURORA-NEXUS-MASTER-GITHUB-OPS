name: Provision Google Workspace aliases

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Plan only or apply desired state"
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply

permissions:
  contents: read

concurrency:
  group: google-workspace-drjoaodefreitas
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    environment: google-workspace-production
    defaults:
      run:
        working-directory: tools/google-workspace
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Validate required secrets
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_ADMIN_IMPERSONATE: ${{ secrets.GOOGLE_ADMIN_IMPERSONATE }}
        run: |
          test -n "$GOOGLE_SERVICE_ACCOUNT_JSON" || (echo "Missing GOOGLE_SERVICE_ACCOUNT_JSON" && exit 1)
          test -n "$GOOGLE_ADMIN_IMPERSONATE" || (echo "Missing GOOGLE_ADMIN_IMPERSONATE" && exit 1)

      - name: Plan desired state
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_ADMIN_IMPERSONATE: ${{ secrets.GOOGLE_ADMIN_IMPERSONATE }}
          WORKSPACE_DOMAIN: drjoaodefreitas.com.br
          WORKSPACE_PRIMARY_USER: joao@drjoaodefreitas.com.br
        run: node provision.mjs --plan

      - name: Apply desired state
        if: ${{ inputs.mode == 'apply' }}
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_ADMIN_IMPERSONATE: ${{ secrets.GOOGLE_ADMIN_IMPERSONATE }}
          WORKSPACE_DOMAIN: drjoaodefreitas.com.br
          WORKSPACE_PRIMARY_USER: joao@drjoaodefreitas.com.br
        run: node provision.mjs --apply
