name: Provision Aurora Firebase Production

on:
  push:
    branches:
      - main
    paths:
      - ".github/requests/aurora-firebase-production.json"
  workflow_dispatch:
    inputs:
      deployment_stage:
        description: "Provision infrastructure, publish backend, or publish canonical Hosting"
        type: choice
        default: PROVISION_ONLY
        options: [PROVISION_ONLY, PUBLISH_BACKEND, PUBLISH_HOSTING]
      deploy_confirmation:
        description: "Publication requires PUBLISH_PRODUCTION_BETA"
        type: string
        default: VALIDATE_ONLY
      expected_main_sha:
        description: "Exact current main SHA reviewed for publication"
        type: string
      validation_run_id:
        description: "Successful Validate Firestore Migration run at that exact main SHA"
        type: string
      restore_database:
        description: "Existing prod-restore-* database with a real restore from current READY production backup"
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: aurora-firebase-production-provision
  cancel-in-progress: false

jobs:
  provision:
    if: ${{ github.event_name == 'push' || inputs.deployment_stage == 'PROVISION_ONLY' }}
    name: Complete isolated cold-production Firebase setup
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: firebase-production
    env:
      REQUEST_FILE: .github/requests/aurora-firebase-production.json
      APPROVED_PROJECT: ${{ vars.FIREBASE_PROD_PROJECT_ID }}
      APPROVED_PROJECT_NUMBER: ${{ vars.FIREBASE_PROD_PROJECT_NUMBER }}
      WIF_PROVIDER: ${{ vars.GCP_PROD_WIF_PROVIDER }}
      PROVISION_SERVICE_ACCOUNT: ${{ vars.GCP_PROD_DEPLOY_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned 2026-10-01
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate explicit existing-production project contract
        id: request
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 firebase-migration/scripts/production_project_contract.py \
            --approved-project="$APPROVED_PROJECT" \
            --approved-number="$APPROVED_PROJECT_NUMBER" \
            --require-wif --wif-provider="$WIF_PROVIDER" \
            --service-account="$PROVISION_SERVICE_ACCOUNT"
          expected="$(jq -r '.expectedSourceSha' "$REQUEST_FILE")"
          git cat-file -e "$expected^{commit}"
          git merge-base --is-ancestor "$expected" "$GITHUB_SHA"
          current_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$current_main" = "$GITHUB_SHA"
          project_id="$(jq -r '.projectId' "$REQUEST_FILE")"
          region="$(jq -r '.region' "$REQUEST_FILE")"
          test -n "$APPROVED_PROJECT"
          test "$project_id" = "$APPROVED_PROJECT"
          echo "project_id=$project_id" >> "$GITHUB_OUTPUT"
          echo "region=$region" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2 pinned 2026-10-01
        with:
          workload_identity_provider: ${{ vars.GCP_PROD_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_PROD_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2 pinned 2026-10-01
        with:
          version: "548.0.0"

      - name: Verify pre-bootstrapped production identity and project
        env:
          PROJECT_ID: ${{ steps.request.outputs.project_id }}
        run: |
          set -euo pipefail
          active_account="$(gcloud auth list --filter='status:ACTIVE' --format='value(account)')"
          test "$active_account" = "$PROVISION_SERVICE_ACCOUNT"
          preflight_args=(firebase-migration/scripts/production_project_contract.py
            "--approved-project=$PROJECT_ID" "--approved-number=$APPROVED_PROJECT_NUMBER"
            --require-wif "--wif-provider=$WIF_PROVIDER"
            "--service-account=$PROVISION_SERVICE_ACCOUNT" --verify-live)
          preflight_status=0
          preflight_result="$(python3 "${preflight_args[@]}" 2>&1)" || preflight_status=$?
          if [ "$preflight_status" -ne 0 ]; then
            # This exact result proves project ID/number/ACTIVE already passed.
            # Enable only the missing lookup API, never link billing or widen IAM.
            if [ "$preflight_result" != "AURORA_PRODUCTION_BLOCKED=GCP_LOOKUP_FAILED_NO_MUTATION:BILLING:SERVICE_DISABLED" ]; then
              printf '%s\n' "$preflight_result" >&2
              exit "$preflight_status"
            fi
            gcloud services enable cloudbilling.googleapis.com --project "$PROJECT_ID" --quiet
            python3 "${preflight_args[@]}"
          else
            printf '%s\n' "$preflight_result"
          fi

      - name: Enable production platform APIs
        env:
          PROJECT_ID: ${{ steps.request.outputs.project_id }}
        run: |
          set -euo pipefail
          gcloud services enable             firebase.googleapis.com             firebaserules.googleapis.com             firebasehosting.googleapis.com             identitytoolkit.googleapis.com             firestore.googleapis.com             cloudfunctions.googleapis.com             run.googleapis.com             artifactregistry.googleapis.com             cloudbuild.googleapis.com             eventarc.googleapis.com             pubsub.googleapis.com             cloudscheduler.googleapis.com             secretmanager.googleapis.com             cloudkms.googleapis.com             iamcredentials.googleapis.com             billingbudgets.googleapis.com             --project "$PROJECT_ID" --quiet

      - name: Add Firebase control plane
        env:
          PROJECT_ID: ${{ steps.request.outputs.project_id }}
        run: |
          set -euo pipefail
          access_token="$(gcloud auth print-access-token)"
          project_url="https://firebase.googleapis.com/v1beta1/projects/${PROJECT_ID}"
          if ! curl --fail --silent --show-error --max-time 30               -H "Authorization: Bearer ${access_token}" "$project_url" >/dev/null 2>&1; then
            operation="$(curl --fail --silent --show-error --max-time 30               -X POST               -H "Authorization: Bearer ${access_token}"               -H 'Content-Type: application/json'               --data '{}'               "https://firebase.googleapis.com/v1beta1/projects/${PROJECT_ID}:addFirebase")"
            op_name="$(jq -r '.name // empty' <<<"$operation")"
            test -n "$op_name"
            for _ in $(seq 1 30); do
              state="$(curl --fail --silent --show-error --max-time 30                 -H "Authorization: Bearer ${access_token}"                 "https://firebase.googleapis.com/v1beta1/${op_name}")"
              if [ "$(jq -r '.done // false' <<<"$state")" = true ]; then
                jq -e 'has("error") | not' <<<"$state" >/dev/null
                break
              fi
              sleep 5
            done
          fi
          curl --fail --silent --show-error --max-time 30             -H "Authorization: Bearer ${access_token}" "$project_url" >/dev/null

      - name: Create protected Firestore production database
        env:
          PROJECT_ID: ${{ steps.request.outputs.project_id }}
          REGION: ${{ steps.request.outputs.region }}
        run: |
          set -euo pipefail
          if ! gcloud firestore databases describe --database='(default)' --project "$PROJECT_ID" --format=json >/dev/null 2>&1; then
            gcloud firestore databases create               --database='(default)'               --location="$REGION"               --type=firestore-native               --delete-protection               --project="$PROJECT_ID"               --quiet
          fi
          gcloud firestore databases update             --database='(default)'             --enable-pitr             --delete-protection             --project="$PROJECT_ID"             --quiet
          db_json="$(gcloud firestore databases describe --database='(default)' --project "$PROJECT_ID" --format=json)"
          test "$(jq -r '.locationId // empty' <<<"$db_json")" = "$REGION"
          test "$(jq -r '.deleteProtectionState // empty' <<<"$db_json")" = "DELETE_PROTECTION_ENABLED"
          test "$(jq -r '.pointInTimeRecoveryEnablement // empty' <<<"$db_json")" = "POINT_IN_TIME_RECOVERY_ENABLED"

      - name: Verify isolated production secrets
        env:
          PROJECT_ID: ${{ steps.request.outputs.project_id }}
        run: |
          set -euo pipefail
          for secret in AURORA_NEXUS_ALLOWED_EMAILS AURORA_NEXUS_CSRF_HMAC_KEY WMGJ_INGEST_HMAC_KEYRING; do
            gcloud secrets describe "$secret" --project "$PROJECT_ID" --format='value(name)' >/dev/null
            latest="$(gcloud secrets versions describe latest --secret "$secret" --project "$PROJECT_ID" --format='value(state)')"
            test "$latest" = "ENABLED"
          done

      - name: Initialize cold-production organization guardrails
        env:
          PROJECT_ID: ${{ steps.request.outputs.project_id }}
        run: |
          set -euo pipefail
          access_token="$(gcloud auth print-access-token)"
          org_url="https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents/organizations/wmgj"
          payload='{"fields":{"active":{"booleanValue":true},"environment":{"stringValue":"PRODUCTION"},"deploymentStage":{"stringValue":"COLD_PRODUCTION"},"projectionEnabled":{"booleanValue":false},"projectionMode":{"stringValue":"SHADOW"},"organicEnabled":{"booleanValue":true},"organicSectors":{"arrayValue":{"values":[{"stringValue":"AUDIT"},{"stringValue":"FINANCE"}]}},"clinicalSensitiveEnabled":{"booleanValue":false},"productionMutation":{"booleanValue":false},"sourceMutation":{"booleanValue":false}}}'
          curl --fail --silent --show-error --max-time 30             -X PATCH             -H "Authorization: Bearer ${access_token}"             -H 'Content-Type: application/json'             --data "$payload"             "$org_url?updateMask.fieldPaths=active&updateMask.fieldPaths=environment&updateMask.fieldPaths=deploymentStage&updateMask.fieldPaths=projectionEnabled&updateMask.fieldPaths=projectionMode&updateMask.fieldPaths=organicEnabled&updateMask.fieldPaths=organicSectors&updateMask.fieldPaths=clinicalSensitiveEnabled&updateMask.fieldPaths=productionMutation&updateMask.fieldPaths=sourceMutation" >/dev/null

      - name: Request nonce TTL
        env:
          PROJECT_ID: ${{ steps.request.outputs.project_id }}
        run: |
          set -euo pipefail
          gcloud firestore fields ttls update expiresAt             --collection-group=requestNonces             --database='(default)'             --enable-ttl             --project="$PROJECT_ID"             --async --quiet

      - name: Verify cold-production state
        env:
          PROJECT_ID: ${{ steps.request.outputs.project_id }}
          REGION: ${{ steps.request.outputs.region }}
        run: |
          set -euo pipefail
          db_json="$(gcloud firestore databases describe --database='(default)' --project "$PROJECT_ID" --format=json)"
          test "$(jq -r '.locationId // empty' <<<"$db_json")" = "$REGION"
          test "$(jq -r '.deleteProtectionState // empty' <<<"$db_json")" = "DELETE_PROTECTION_ENABLED"
          test "$(jq -r '.pointInTimeRecoveryEnablement // empty' <<<"$db_json")" = "POINT_IN_TIME_RECOVERY_ENABLED"
          access_token="$(gcloud auth print-access-token)"
          org_json="$(curl --fail --silent --show-error --max-time 30             -H "Authorization: Bearer ${access_token}"             "https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents/organizations/wmgj")"
          jq -e '
            .fields.active.booleanValue == true and
            .fields.environment.stringValue == "PRODUCTION" and
            .fields.deploymentStage.stringValue == "COLD_PRODUCTION" and
            .fields.projectionEnabled.booleanValue == false and
            .fields.projectionMode.stringValue == "SHADOW" and
            .fields.clinicalSensitiveEnabled.booleanValue == false and
            .fields.productionMutation.booleanValue == false and
            .fields.sourceMutation.booleanValue == false
          ' <<<"$org_json" >/dev/null
          for secret in AURORA_NEXUS_ALLOWED_EMAILS AURORA_NEXUS_CSRF_HMAC_KEY WMGJ_INGEST_HMAC_KEYRING; do
            latest="$(gcloud secrets versions describe latest --secret "$secret" --project "$PROJECT_ID" --format='value(state)')"
            test "$latest" = "ENABLED"
          done
          prod_sa="aurora-prod-deploy@${PROJECT_ID}.iam.gserviceaccount.com"
          test "$PROVISION_SERVICE_ACCOUNT" = "$prod_sa"
          echo "AURORA_EXISTING_PRODUCTION_PROJECT_PROVISIONED=$PROJECT_ID"
          echo "AURORA_PRODUCTION_STAGE=COLD_PRODUCTION"
          echo "AURORA_PRODUCTION_DEPLOY_IDENTITY=$prod_sa"

  publish:
    name: Publish reviewed production beta stage
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.deployment_stage == 'PUBLISH_BACKEND' || inputs.deployment_stage == 'PUBLISH_HOSTING') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: firebase-production
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      APPROVED_PROJECT: ${{ vars.FIREBASE_PROD_PROJECT_ID }}
      APPROVED_PROJECT_NUMBER: ${{ vars.FIREBASE_PROD_PROJECT_NUMBER }}
      WIF_PROVIDER: ${{ vars.GCP_PROD_WIF_PROVIDER }}
      PROVISION_SERVICE_ACCOUNT: ${{ vars.GCP_PROD_DEPLOY_SERVICE_ACCOUNT }}
      DEPLOY_STAGE: ${{ inputs.deployment_stage }}
      DEPLOY_CONFIRMATION: ${{ inputs.deploy_confirmation }}
      EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
      VALIDATION_RUN_ID: ${{ inputs.validation_run_id }}
      RESTORE_DATABASE: ${{ inputs.restore_database }}
      GCLOUD_PROJECT: wmgj-prod-jfn-20261005
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Reject stale, implicit or different publication target
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$DEPLOY_CONFIRMATION" = PUBLISH_PRODUCTION_BETA
          test "$APPROVED_PROJECT" = wmgj-prod-jfn-20261005
          test "$APPROVED_PROJECT_NUMBER" = 616997609173
          test "$EXPECTED_MAIN_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          expected="$(jq -r '.expectedSourceSha' .github/requests/aurora-firebase-production.json)"
          git cat-file -e "$expected^{commit}"
          git merge-base --is-ancestor "$expected" "$GITHUB_SHA"
          current_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$current_main" = "$GITHUB_SHA"
          [[ "$VALIDATION_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$RESTORE_DATABASE" =~ ^prod-restore-[a-z0-9-]{3,40}$ ]]
          python3 firebase-migration/scripts/production_project_contract.py \
            --approved-project="$APPROVED_PROJECT" --approved-number="$APPROVED_PROJECT_NUMBER" \
            --require-wif --wif-provider="$WIF_PROVIDER" --service-account="$PROVISION_SERVICE_ACCOUNT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: firebase-migration/functions/package-lock.json
      - name: Test production publication contracts before cloud authentication
        run: |
          python3 -m unittest discover -s firebase-migration/scripts -p 'test_production_release_preflight.py'
          npm --prefix firebase-migration/functions ci --ignore-scripts
          npm --prefix firebase-migration/functions run build
          npm --prefix firebase-migration/functions audit --omit=dev --audit-level=high
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ vars.GCP_PROD_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_PROD_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          version: "548.0.0"
          project_id: wmgj-prod-jfn-20261005
      - name: Verify production recovery, nominal Auth configuration and exact CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gcloud auth list --filter='status:ACTIVE' --format='value(account)')" = "$PROVISION_SERVICE_ACCOUNT"
          python3 firebase-migration/scripts/production_release_preflight.py \
            --evidence "$RUNNER_TEMP/aurora-production-preflight.json"
      - name: Verify recent real nominal MFA before canonical publication
        if: ${{ inputs.deployment_stage == 'PUBLISH_HOSTING' }}
        env:
          FIREBASE_PROD_SMOKE_UID: ${{ vars.FIREBASE_PROD_SMOKE_UID }}
          FIREBASE_PROD_SMOKE_ID_TOKEN: ${{ secrets.FIREBASE_PROD_SMOKE_ID_TOKEN }}
        run: node firebase-migration/scripts/production-canonical-smoke.mjs --identity-only
      - name: Reconfirm immutable main immediately before publication
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$GITHUB_SHA"
      - name: Publish backend in explicit approved project
        if: ${{ inputs.deployment_stage == 'PUBLISH_BACKEND' }}
        working-directory: firebase-migration
        run: |
          set -euo pipefail
          # Fixed scope preserves the existing HML deploy guard and avoids new executors.
          npx --yes firebase-tools@14.17.0 deploy --config firebase.production.json \
            --project wmgj-prod-jfn-20261005 --non-interactive \
            --only functions:ingestWmgjEvent,functions:auroraNexusCryptoSelfTest,functions:runtimeHealth,functions:auroraNexusAuthGate,functions:auroraNexusSessionLogin,functions:auroraNexusSessionLogout,functions:auroraNexusBootstrap,functions:auroraNexusNativeInsight,functions:auroraNexusMasterEngine,functions:auroraNexusAction,functions:auroraNexusRefresh,functions:auroraNexusOrganic,functions:auroraNexusIntegrationKeys,functions:auroraNexusUserProfiles,functions:auroraNexusIntegrationPing,functions:auroraNexusIntegrationDocuments,functions:auroraNexusShareholderReport,functions:auroraNexusDistributionDecision,firestore:rules,firestore:indexes
          echo "AURORA_PRODUCTION_BACKEND_PUBLISHED_CANONICAL_ACCEPTANCE_PENDING=$GITHUB_SHA"
      - name: Require every canonical Hosting route already deployed
        if: ${{ inputs.deployment_stage == 'PUBLISH_HOSTING' }}
        working-directory: firebase-migration
        run: |
          set -euo pipefail
          npx --yes firebase-tools@14.17.0 functions:list --project wmgj-prod-jfn-20261005 --json > "$RUNNER_TEMP/aurora-production-functions.json"
          python3 scripts/validate-hosting-runtime.py --config firebase.production.json \
            --inventory "$RUNNER_TEMP/aurora-production-functions.json"
      - name: Capture previous production Hosting release for rollback
        if: ${{ inputs.deployment_stage == 'PUBLISH_HOSTING' }}
        run: |
          set -euo pipefail
          token="$(gcloud auth print-access-token)"
          curl --fail --silent --show-error --max-time 30 \
            -H "Authorization: Bearer $token" -H 'x-goog-user-project: wmgj-prod-jfn-20261005' \
            'https://firebasehosting.googleapis.com/v1beta1/projects/wmgj-prod-jfn-20261005/sites/wmgj-prod-jfn-20261005/releases?pageSize=1' \
            | jq '{previousRelease: (.releases[0].name // null), previousVersion: (.releases[0].version.name // null)}' > "$RUNNER_TEMP/aurora-production-rollback.json"
      - name: Publish canonical Hosting without modifying DNS
        if: ${{ inputs.deployment_stage == 'PUBLISH_HOSTING' }}
        working-directory: firebase-migration
        run: |
          npx --yes firebase-tools@14.17.0 deploy --config firebase.production.json \
            --project wmgj-prod-jfn-20261005 --non-interactive --only hosting
      - name: Verify canonical nominal MFA, tenant, negative access and exact runtime manifests
        if: ${{ inputs.deployment_stage == 'PUBLISH_HOSTING' }}
        env:
          FIREBASE_PROD_SMOKE_UID: ${{ vars.FIREBASE_PROD_SMOKE_UID }}
          FIREBASE_PROD_SMOKE_ID_TOKEN: ${{ secrets.FIREBASE_PROD_SMOKE_ID_TOKEN }}
        run: |
          node firebase-migration/scripts/production-canonical-smoke.mjs > "$RUNNER_TEMP/aurora-production-smoke.json"
          cat "$RUNNER_TEMP/aurora-production-smoke.json"
      - name: Preserve sanitized stage and recovery evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: aurora-production-publication-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/aurora-production-preflight.json
            ${{ runner.temp }}/aurora-production-rollback.json
            ${{ runner.temp }}/aurora-production-smoke.json
          if-no-files-found: ignore
          retention-days: 14
