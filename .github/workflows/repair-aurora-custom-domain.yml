name: Repair Aurora HML Custom Domain

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: "Firebase homologation project ID"
        required: true
        type: string
      expected_main_sha:
        description: "Exact main SHA to repair"
        required: true
        type: string
      repair_confirmation:
        description: "VALIDATE_ONLY or REPAIR_HML_DOMAIN"
        required: true
        default: "VALIDATE_ONLY"
        type: choice
        options:
          - VALIDATE_ONLY
          - REPAIR_HML_DOMAIN

permissions:
  contents: read

concurrency:
  group: aurora-hml-custom-domain-repair
  cancel-in-progress: false

jobs:
  repair:
    name: Inspect and repair canonical Firebase Hosting domain
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: firebase-homologation
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Pin repair to current main and HML only
        env:
          PROJECT_ID: ${{ inputs.project_id }}
          APPROVED_PROJECT: ${{ vars.FIREBASE_HML_PROJECT_ID }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          DOMAIN: auroranexus.com.br
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test -n "$APPROVED_PROJECT"
          test "$PROJECT_ID" = "$APPROVED_PROJECT"
          test "$PROJECT_ID" = "wmgj-hml-jfn-20260927"
          test "$EXPECTED_MAIN_SHA" = "$GITHUB_SHA"
          test "$DOMAIN" = "auroranexus.com.br"
          case "$PROJECT_ID" in *prod*|*production*|*live*|*principal*) exit 42 ;; esac

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned 2026-10-01
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Reconfirm immutable main
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          git fetch --no-tags --prune --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN_SHA"

      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2 pinned 2026-10-01
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_FIREBASE_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2 pinned 2026-10-01
        with:
          version: "548.0.0"
          project_id: ${{ inputs.project_id }}

      - name: Inspect and repair exact custom domain
        env:
          PROJECT_ID: ${{ inputs.project_id }}
          APPROVED_PROJECT: ${{ vars.FIREBASE_HML_PROJECT_ID }}
          DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
          REPAIR_CONFIRMATION: ${{ inputs.repair_confirmation }}
          DOMAIN: auroranexus.com.br
        run: |
          set -euo pipefail
          test "$PROJECT_ID" = "$APPROVED_PROJECT"
          test "$PROJECT_ID" = "wmgj-hml-jfn-20260927"
          test "$DOMAIN" = "auroranexus.com.br"
          test "$(gcloud auth list --filter='status:ACTIVE' --format='value(account)')" = "$DEPLOY_SERVICE_ACCOUNT"
          case "$REPAIR_CONFIRMATION" in VALIDATE_ONLY|REPAIR_HML_DOMAIN) ;; *) exit 44 ;; esac

          SITE_ID="$PROJECT_ID"
          BASE="https://firebasehosting.googleapis.com/v1beta1"
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          test -n "$ACCESS_TOKEN"
          printf '::add-mask::%s\n' "$ACCESS_TOKEN"
          auth=(-H "Authorization: Bearer $ACCESS_TOKEN" -H "Accept: application/json")
          umask 077
          evidence="${RUNNER_TEMP}/aurora-custom-domain-evidence.json"

          diagnostic() {
            local stage="$1" http="$2" body_file="$3"
            local api_status="NOT_AVAILABLE" api_code="NOT_AVAILABLE"
            if [ -s "$body_file" ]; then
              api_status="$(jq -r '.error.status // "NOT_AVAILABLE"' "$body_file" 2>/dev/null || printf 'NOT_AVAILABLE')"
              api_code="$(jq -r '.error.code // "NOT_AVAILABLE"' "$body_file" 2>/dev/null || printf 'NOT_AVAILABLE')"
            fi
            jq -nc --arg project "$PROJECT_ID" --arg site "$SITE_ID" --arg domain "$DOMAIN" \
              --arg stage "$stage" --arg http "$http" --arg apiStatus "$api_status" --arg apiCode "$api_code" \
              '{schemaVersion:1,projectId:$project,siteId:$site,domain:$domain,stage:$stage,httpStatus:$http,
                apiStatus:$apiStatus,apiCode:$apiCode,secretsIncluded:false,iamChanged:false,dnsChanged:false}' > "$evidence"
            cat "$evidence"
          }

          site_file="$(mktemp "${RUNNER_TEMP}/aurora-site.XXXXXX.json")"
          list_file="$(mktemp "${RUNNER_TEMP}/aurora-domain-list.XXXXXX.json")"
          trap 'rm -f "$site_file" "$list_file"' EXIT
          site_code="$(curl --silent --show-error --max-time 30 -o "$site_file" -w '%{http_code}' "${auth[@]}" \
            "$BASE/projects/$PROJECT_ID/sites/$SITE_ID" || true)"
          if [ "$site_code" != "200" ]; then diagnostic "SITE_GET" "$site_code" "$site_file"; exit 61; fi
          site_name="$(jq -r '.name // empty' "$site_file")"
          default_url="$(jq -r '.defaultUrl // empty' "$site_file")"
          if [ -z "$site_name" ]; then diagnostic "SITE_NAME_MISSING" "200" "$site_file"; exit 64; fi
          if [ "${site_name##*/}" != "$SITE_ID" ]; then diagnostic "SITE_ID_MISMATCH" "200" "$site_file"; exit 65; fi
          case "$default_url" in
            "https://$SITE_ID.web.app"|"https://$SITE_ID.web.app/") ;;
            *) diagnostic "SITE_CONTRACT" "200" "$site_file"; exit 62 ;;
          esac

          list_code="$(curl --silent --show-error --max-time 30 -o "$list_file" -w '%{http_code}' "${auth[@]}" \
            "$BASE/$site_name/customDomains?pageSize=100&showDeleted=true" || true)"
          if [ "$list_code" != "200" ]; then diagnostic "CUSTOM_DOMAIN_LIST" "$list_code" "$list_file"; exit 63; fi
          list_json="$(cat "$list_file")"
          resource="$site_name/customDomains/$DOMAIN"
          domain_json="$(jq -c --arg name "$resource" '[.customDomains[]? | select(.name == $name)] | first // empty' <<<"$list_json")"
          action="NONE"

          direct_file="$(mktemp "${RUNNER_TEMP}/aurora-custom-domain-direct.XXXXXX.json")"
          trap 'rm -f "$site_file" "$list_file" "$direct_file"' EXIT
          direct_code="$(curl --silent --show-error --max-time 30 -o "$direct_file" -w '%{http_code}' "${auth[@]}" "$BASE/$resource" || true)"
          if [ "$direct_code" = "200" ]; then
            domain_json="$(cat "$direct_file")"
            action="EXISTING_EXPECTED_SITE"
          elif [ "$direct_code" != "404" ]; then
            diagnostic "DIRECT_DOMAIN_GET" "$direct_code" "$direct_file"; exit 74
          fi

          if [ -z "$domain_json" ]; then
            sites_file="$(mktemp "${RUNNER_TEMP}/aurora-sites.XXXXXX.json")"
            trap 'rm -f "$site_file" "$list_file" "$direct_file" "$sites_file"' EXIT
            sites_code="$(curl --silent --show-error --max-time 30 -o "$sites_file" -w '%{http_code}' "${auth[@]}" "$BASE/projects/$PROJECT_ID/sites?pageSize=100" || true)"
            if [ "$sites_code" != "200" ]; then diagnostic "PROJECT_SITES_LIST" "$sites_code" "$sites_file"; exit 75; fi
            matched_site=""
            matched_domain='{}'
            while IFS= read -r candidate_site; do
              [ -n "$candidate_site" ] || continue
              candidate_file="$(mktemp "${RUNNER_TEMP}/aurora-domain-scan.XXXXXX.json")"
              candidate_code="$(curl --silent --show-error --max-time 30 -o "$candidate_file" -w '%{http_code}' "${auth[@]}" "$BASE/$candidate_site/customDomains?pageSize=100&showDeleted=true" || true)"
              if [ "$candidate_code" != "200" ]; then
                diagnostic "PROJECT_SITE_DOMAIN_LIST" "$candidate_code" "$candidate_file"
                rm -f "$candidate_file"
                exit 76
              fi
              candidate_domain="$(jq -c --arg domain "$DOMAIN" '[.customDomains[]? | select((.name // "") | endswith("/customDomains/" + $domain))] | first // empty' "$candidate_file")"
              rm -f "$candidate_file"
              if [ -n "$candidate_domain" ]; then
                matched_site="${candidate_site##*/}"
                matched_domain="$candidate_domain"
                break
              fi
            done < <(jq -r '.sites[]?.name // empty' "$sites_file")
            if [ -n "$matched_site" ]; then
              if [ "$matched_site" != "$SITE_ID" ]; then
                jq -nc --arg project "$PROJECT_ID" --arg site "$SITE_ID" --arg domain "$DOMAIN" --arg matchedSite "$matched_site" \
                  '{schemaVersion:1,projectId:$project,siteId:$site,domain:$domain,stage:"DOMAIN_FOUND_OTHER_HML_SITE",
                    matchedSiteId:$matchedSite,secretsIncluded:false,iamChanged:false,dnsChanged:false,mutationPerformed:false}' > "$evidence"
                cat "$evidence"
                exit 77
              fi
              domain_json="$matched_domain"
              action="EXISTING_EXPECTED_SITE_DISCOVERED"
            fi
          fi

          if [ -z "$domain_json" ]; then
            validate_file="$(mktemp "${RUNNER_TEMP}/aurora-custom-domain-validate.XXXXXX.json")"
            trap 'rm -f "$validate_file"' EXIT
            validate_code="$(curl --silent --show-error --max-time 30 -o "$validate_file" -w '%{http_code}'               -X POST "${auth[@]}" -H 'Content-Type: application/json' --data '{}'               "$BASE/$site_name/customDomains?customDomainId=$DOMAIN&validateOnly=true")"
            if [ "$validate_code" != "200" ]; then
              if [ "$validate_code" = "409" ] && [ "$(jq -r '.error.status // empty' "$validate_file" 2>/dev/null)" = "ALREADY_EXISTS" ]; then
                diagnostic "DOMAIN_EXISTS_OUTSIDE_VISIBLE_HML_SITES" "$validate_code" "$validate_file"; exit 78
              fi
              diagnostic "CREATE_VALIDATE" "$validate_code" "$validate_file"; exit 66
            fi
            if ! jq -e '.name | type == "string" and length > 0' "$validate_file" >/dev/null; then
              diagnostic "CREATE_VALIDATE_CONTRACT" "200" "$validate_file"; exit 67
            fi
            action="CREATE_REQUIRED"
            if [ "$REPAIR_CONFIRMATION" = "REPAIR_HML_DOMAIN" ]; then
              mutation_file="$(mktemp "${RUNNER_TEMP}/aurora-custom-domain-create.XXXXXX.json")"
              trap 'rm -f "$validate_file" "$mutation_file"' EXIT
              mutation_code="$(curl --silent --show-error --max-time 30 -o "$mutation_file" -w '%{http_code}'                 -X POST "${auth[@]}" -H 'Content-Type: application/json' --data '{}'                 "$BASE/$site_name/customDomains?customDomainId=$DOMAIN")"
              if [ "$mutation_code" != "200" ]; then diagnostic "CREATE" "$mutation_code" "$mutation_file"; exit 68; fi
              if ! jq -e '.name | type == "string" and length > 0' "$mutation_file" >/dev/null; then
                diagnostic "CREATE_CONTRACT" "200" "$mutation_file"; exit 69
              fi
              action="CREATE_REQUESTED"
            fi
          elif [ "$(jq -r '.deleteTime // empty' <<<"$domain_json")" != "" ]; then
            etag="$(jq -r '.etag // empty' <<<"$domain_json")"
            if [ -z "$etag" ]; then
              jq -nc --arg project "$PROJECT_ID" --arg site "$SITE_ID" --arg domain "$DOMAIN" \
                '{schemaVersion:1,projectId:$project,siteId:$site,domain:$domain,stage:"UNDELETE_ETAG_MISSING",httpStatus:"200",
                  apiStatus:"NOT_AVAILABLE",apiCode:"NOT_AVAILABLE",secretsIncluded:false,iamChanged:false,dnsChanged:false}' > "$evidence"
              exit 70
            fi
            validate_payload="$(jq -nc --arg etag "$etag" '{validateOnly:true,etag:$etag}')"
            validate_file="$(mktemp "${RUNNER_TEMP}/aurora-custom-domain-undelete-validate.XXXXXX.json")"
            trap 'rm -f "$validate_file"' EXIT
            validate_code="$(curl --silent --show-error --max-time 30 -o "$validate_file" -w '%{http_code}'               -X POST "${auth[@]}" -H 'Content-Type: application/json' --data "$validate_payload"               "$BASE/$resource:undelete")"
            if [ "$validate_code" != "200" ]; then diagnostic "UNDELETE_VALIDATE" "$validate_code" "$validate_file"; exit 71; fi
            action="UNDELETE_REQUIRED"
            if [ "$REPAIR_CONFIRMATION" = "REPAIR_HML_DOMAIN" ]; then
              mutation_payload="$(jq -nc --arg etag "$etag" '{validateOnly:false,etag:$etag}')"
              mutation_file="$(mktemp "${RUNNER_TEMP}/aurora-custom-domain-undelete.XXXXXX.json")"
              trap 'rm -f "$validate_file" "$mutation_file"' EXIT
              mutation_code="$(curl --silent --show-error --max-time 30 -o "$mutation_file" -w '%{http_code}'                 -X POST "${auth[@]}" -H 'Content-Type: application/json' --data "$mutation_payload"                 "$BASE/$resource:undelete")"
              if [ "$mutation_code" != "200" ]; then diagnostic "UNDELETE" "$mutation_code" "$mutation_file"; exit 72; fi
              if ! jq -e '.name | type == "string" and length > 0' "$mutation_file" >/dev/null; then
                diagnostic "UNDELETE_CONTRACT" "200" "$mutation_file"; exit 73
              fi
              action="UNDELETE_REQUESTED"
            fi
          fi

          # Preserve only schema paths/types for requiredDnsUpdates; never emit DNS values.
          if [ -n "$domain_json" ]; then
            jq -c '
              .requiredDnsUpdates as $r
              | [
                  $r
                  | paths(scalars) as $p
                  | {
                      path: ($p | map(tostring) | join(".")),
                      scalarType: ($r | getpath($p) | type)
                    }
                ]
            ' <<<"$domain_json"               | jq -c --arg project "$PROJECT_ID" --arg site "$SITE_ID" --arg domain "$DOMAIN"                   '{schemaVersion:1,projectId:$project,siteId:$site,domain:$domain,
                    stage:"REQUIRED_DNS_SCHEMA_ONLY",paths:.,rawDnsValuesIncluded:false,
                    secretsIncluded:false,iamChanged:false,dnsChanged:false}'               > "${RUNNER_TEMP}/aurora-custom-domain-dns-schema.json"
            cat "${RUNNER_TEMP}/aurora-custom-domain-dns-schema.json"
          fi

          # Preserve only DNS record names/types/counts and SHA-256 digests of record values.
          # Raw ownership challenge values are never emitted.
          if [ -n "$domain_json" ]; then
            dns_summary="$(
              jq -c '
                def summarize:
                  if type == "array" then
                    map({
                      domainName: (.domainName // ""),
                      type: (.type // ""),
                      valueCount: ((.rdata // []) | length),
                      valueHashes: ((.rdata // []) | map(@base64) )
                    })
                  else [] end;
                {
                  desired: (.requiredDnsUpdates.desired | summarize),
                  discovered: (.requiredDnsUpdates.discovered | summarize)
                }' <<<"$domain_json"
            )"
            dns_summary_hashed="$(python3 -c 'import base64,hashlib,json,sys;x=json.loads(sys.argv[1]);[(row.__setitem__("valueHashes",[hashlib.sha256(base64.b64decode(v)).hexdigest() for v in row.get("valueHashes",[])])) for side in ("desired","discovered") for row in x.get(side,[])];print(json.dumps(x,separators=(",",":")))' "$dns_summary")"
            jq -nc --argjson updates "$dns_summary_hashed"               --arg project "$PROJECT_ID" --arg site "$SITE_ID" --arg domain "$DOMAIN"               '{schemaVersion:1,projectId:$project,siteId:$site,domain:$domain,stage:"REQUIRED_DNS_UPDATES_HASHED",
                requiredDnsUpdates:$updates,secretsIncluded:false,rawDnsValuesIncluded:false,iamChanged:false,dnsChanged:false}'               > "${RUNNER_TEMP}/aurora-custom-domain-dns-summary.json"
            cat "${RUNNER_TEMP}/aurora-custom-domain-dns-summary.json"
          fi

          current='{}'
          for attempt in $(seq 1 30); do
            code="$(curl --silent --show-error --max-time 30 -o "$evidence.current" -w '%{http_code}'               "${auth[@]}" "$BASE/$resource" || true)"
            if [ "$code" = "200" ]; then
              current="$(cat "$evidence.current")"
              host="$(jq -r '.hostState // "UNKNOWN"' <<<"$current")"
              owner="$(jq -r '.ownershipState // "UNKNOWN"' <<<"$current")"
              cert="$(jq -r '.cert.state // "UNKNOWN"' <<<"$current")"
              reconciling="$(jq -r '.reconciling // false' <<<"$current")"
              if [ "$host" = "HOST_ACTIVE" ] && [ "$owner" = "OWNERSHIP_ACTIVE" ] && [ "$cert" = "CERT_ACTIVE" ] && [ "$reconciling" = "false" ]; then
                break
              fi
            fi
            if [ "$REPAIR_CONFIRMATION" != "REPAIR_HML_DOMAIN" ]; then break; fi
            sleep 10
          done

          host="$(jq -r '.hostState // "NOT_OBSERVED"' <<<"$current")"
          owner="$(jq -r '.ownershipState // "NOT_OBSERVED"' <<<"$current")"
          cert="$(jq -r '.cert.state // "NOT_OBSERVED"' <<<"$current")"
          reconciling="$(jq -r '.reconciling // false' <<<"$current")"
          issue_count="$(jq -r '(.issues // []) | length' <<<"$current")"
          jq -nc             --arg project "$PROJECT_ID" --arg site "$SITE_ID" --arg domain "$DOMAIN"             --arg action "$action" --arg host "$host" --arg owner "$owner" --arg cert "$cert"             --argjson reconciling "$reconciling" --argjson issueCount "$issue_count"             '{schemaVersion:1,projectId:$project,siteId:$site,domain:$domain,action:$action,
              hostState:$host,ownershipState:$owner,certState:$cert,reconciling:$reconciling,
              issueCount:$issueCount,secretsIncluded:false,iamChanged:false,dnsChanged:false}' > "$evidence"
          cat "$evidence"

          if [ "$REPAIR_CONFIRMATION" = "REPAIR_HML_DOMAIN" ]; then
            test "$host" = "HOST_ACTIVE"
            test "$owner" = "OWNERSHIP_ACTIVE"
            test "$cert" = "CERT_ACTIVE"
            test "$reconciling" = "false"
          fi

      - name: Verify canonical login-first HTTP contract
        if: ${{ inputs.repair_confirmation == 'REPAIR_HML_DOMAIN' }}
        run: |
          set -euo pipefail
          portal_status="$(curl --silent --show-error --max-time 30 --output /tmp/portal.html --write-out '%{http_code}'             'https://auroranexus.com.br/portal')"
          test "$portal_status" = "200"
          bootstrap_status="$(curl --silent --show-error --max-time 30 -H 'Accept: application/json'             --output /tmp/bootstrap.json --write-out '%{http_code}' 'https://auroranexus.com.br/api/bootstrap')"
          test "$bootstrap_status" = "401"
          jq -e '.ok == false and .code == "AUTH_REQUIRED"' /tmp/bootstrap.json >/dev/null
          echo "AURORA_CANONICAL_DOMAIN_VERIFIED"

      - name: Preserve sanitized custom-domain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurora-hml-custom-domain-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/aurora-custom-domain*.json
          if-no-files-found: ignore
          retention-days: 14
