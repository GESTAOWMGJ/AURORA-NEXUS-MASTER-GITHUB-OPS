name: Deploy drjoaodefreitas site to Vercel

on:
  push:
    branches: [main]
    paths:
      - "site-drjoaodefreitas/**"
      - ".github/workflows/deploy-site-drjoaodefreitas-vercel.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-production-drjoaodefreitas
  cancel-in-progress: false

jobs:
  deploy-production:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.VERCEL_AUTODEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: drjoaodefreitas-production
    defaults:
      run:
        working-directory: site-drjoaodefreitas
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Validate required Vercel credentials
        run: |
          test -n "$VERCEL_TOKEN" || (echo "Missing VERCEL_TOKEN" && exit 1)
          test -n "$VERCEL_ORG_ID" || (echo "Missing VERCEL_ORG_ID" && exit 1)
          test -n "$VERCEL_PROJECT_ID" || (echo "Missing VERCEL_PROJECT_ID" && exit 1)

      - name: Pull Vercel project settings
        run: npx --yes vercel@52.0.1 pull --yes --environment=production

      - name: Build production artifact
        run: npx --yes vercel@52.0.1 build --prod

      - name: Deploy production artifact
        run: npx --yes vercel@52.0.1 deploy --prebuilt --prod
