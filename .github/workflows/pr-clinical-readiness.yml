name: PR Clinical Readiness

on:
  pull_request:
    paths:
      - "app-foundation/**"
      - "src/**"
      - "tools/audit-appscript.js"
      - ".github/workflows/pr-clinical-readiness.yml"
      - ".github/workflows/deploy-production.yml"
      - ".github/workflows/deploy-firebase-shadow.yml"

permissions:
  contents: read

concurrency:
  group: clinical-readiness-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  frontend-functions-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app-foundation
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app-foundation/package-lock.json
      - run: npm ci
      - run: npm run functions:build
      - run: npm run build
      - run: npm run test

  fastapi-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app-foundation/api
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: python -m pip install uv==0.8.15
      - run: uv sync --locked --dev
      - run: uv run pytest
      - run: uv run python -c "from main import app; assert set(app.openapi()['paths']) == {'/health', '/v1/readiness'}"
      - run: uv run python ../scripts/migration/dry_run.py ../tests/fixtures/synthetic/migration-source.json

  no-real-data-markers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Reject common real-data fixture markers
        run: |
          if grep -RIE "(^|[^0-9])([0-9]{3}\.){2}[0-9]{3}-[0-9]{2}([^0-9]|$)|prontu[aá]rio|patient[_-]?name" app-foundation/tests app-foundation/api/tests; then
            echo "Potential real-data marker found in test fixtures."
            exit 1
          fi

  preserve-current-operation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: node tools/audit-appscript.js
      - name: Confirm shadow remains opt-in and fail-isolated
        run: |
          grep -q 'WMGJ_FIREBASE_SHADOW_ENABLED' src/15_FIREBASE_SHADOW_WMGJ.gs
          grep -q 'SHADOW_DISABLED' src/15_FIREBASE_SHADOW_WMGJ.gs
          grep -q 'SHADOW_ERRO_ISOLADO' src/15_FIREBASE_SHADOW_WMGJ.gs
          grep -q 'productionCutoverRequested: false' src/15_FIREBASE_SHADOW_WMGJ.gs
