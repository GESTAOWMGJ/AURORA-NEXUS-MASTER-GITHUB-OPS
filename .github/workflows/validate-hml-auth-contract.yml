name: Validate HML Auth Contract

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/tests/test_hml_auth_contract.py'
      - 'scripts/tests/test_hml_shadow_update.py'
      - 'scripts/tests/test_hml_gate_readonly.py'
      - 'firebase-migration/scripts/hml_gate_readonly.py'
      - 'firebase-migration/scripts/repair-hml-eventarc-iam.py'
      - 'tools/windows/DIAG_AURORA_HML.cmd'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/tests/test_hml_auth_contract.py'
      - 'scripts/tests/test_hml_shadow_update.py'
      - 'scripts/tests/test_hml_gate_readonly.py'
      - 'firebase-migration/scripts/hml_gate_readonly.py'
      - 'firebase-migration/scripts/repair-hml-eventarc-iam.py'
      - 'tools/windows/DIAG_AURORA_HML.cmd'

permissions:
  contents: read

concurrency:
  group: validate-hml-auth-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Workflow syntax and offline auth regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned 2026-10-01
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 pinned 2026-10-01
        with:
          python-version: '3.12'
      - name: Validate exact checkout and install YAML parser
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          command -v jq
          python -m pip install --disable-pip-version-check 'PyYAML==6.0.3'
      - name: Validate complete workflows and real authentication blocks offline
        run: |
          set -euo pipefail
          python -m unittest discover -s scripts/tests -p 'test_hml_auth_contract.py' -v
          python -m unittest discover -s scripts/tests -p 'test_hml_shadow_update.py' -v
          python -m unittest discover -s scripts/tests -p 'test_hml_gate_readonly.py' -v
