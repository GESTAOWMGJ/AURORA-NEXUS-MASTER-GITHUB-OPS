name: Deploy Aurora Firebase Homologation

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: "Firebase homologation project ID (must equal repository variable)"
        required: true
        type: string
      deploy_confirmation:
        description: "Type DEPLOY_HOMOLOGATION to deploy; any other value validates only"
        required: true
        default: "VALIDATE_ONLY"
        type: string
      deployment_mode:
        description: "BOOTSTRAP requires projection off; SHADOW_UPDATE preserves an existing authorized SHADOW projection"
        required: true
        default: "BOOTSTRAP"
        type: choice
        options:
          - BOOTSTRAP
          - SHADOW_UPDATE
      expected_main_sha:
        description: "Optional exact main SHA required for this deployment request"
        required: false
        default: ""
        type: string
      publish_active_release:
        description: "Promote the reviewed release after canonical smoke and configured signing keys"
        required: false
        default: false
        type: boolean
      active_release_ci_run_id:
        description: "Successful Validate Firestore Migration run at this exact main SHA"
        required: false
        type: string
      active_release_review_pr:
        description: "Merged PR with human approval at its final reviewed head"
        required: false
        type: string
      active_release_previous_sha256:
        description: "Current certificate SHA256, or NONE for the first reviewed promotion"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: aurora-firebase-homologation
  cancel-in-progress: true

jobs:
  validate:
    name: Validate exact main candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      candidate_sha: ${{ steps.pin-candidate.outputs.sha }}
    steps:
      - name: Require dispatch from main
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_SHA" = "$CANDIDATE_SHA"
          if [ -n "$EXPECTED_MAIN_SHA" ]; then
            [[ "$EXPECTED_MAIN_SHA" =~ ^[a-f0-9]{40}$ ]]
            test "$GITHUB_SHA" = "$EXPECTED_MAIN_SHA"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned 2026-10-01
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Pin immutable candidate to current main
        id: pin-candidate
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git fetch --no-tags --prune --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$CANDIDATE_SHA"
          printf 'sha=%s\n' "$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 pinned 2026-10-01
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: firebase-migration/functions/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4 pinned 2026-10-01
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 pinned 2026-10-01
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6 pinned 2026-10-01
        with:
          version: "0.11.33"
          enable-cache: true
          cache-dependency-glob: firebase-migration/api/uv.lock
      - name: Validate full Firebase and API contract suite
        env:
          WMGJ_FIREBASE_TEST_PROJECT_ID: wmgj-firestore-rules-test
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bash firebase-migration/scripts/bootstrap-homologacao.sh
          npm --prefix firebase-migration/functions audit --omit=dev --audit-level=high
          cd firebase-migration/api
          uv sync --locked --dev
          uv run pytest
          uv run python scripts/run_evals.py
          node --check wmgj_api/static/dashboard.js
          node --test tests/static/dashboard_static.test.mjs
      - name: Validate target and deployment scope
        env:
          REQUESTED_PROJECT: ${{ inputs.project_id }}
          APPROVED_PROJECT: ${{ vars.FIREBASE_HML_PROJECT_ID }}
        run: |
          set -euo pipefail
          test -n "$APPROVED_PROJECT"
          test "$REQUESTED_PROJECT" = "$APPROVED_PROJECT"
          case "$REQUESTED_PROJECT" in wmgj-hml-jfn-*) ;; *) exit 41 ;; esac
          case "$REQUESTED_PROJECT" in *prod*|*production*|*live*|*principal*) exit 42 ;; esac
          node -e 'JSON.parse(require("fs").readFileSync("firebase-migration/firebase.json","utf8"))'

  deploy:
    name: Deploy with protected environment
    if: ${{ inputs.deploy_confirmation == 'DEPLOY_HOMOLOGATION' }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: firebase-homologation
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require the validated main candidate
        env:
          VALIDATED_SHA: ${{ needs.validate.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test -n "$VALIDATED_SHA"
          test "$GITHUB_SHA" = "$VALIDATED_SHA"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned 2026-10-01
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Reconfirm immutable main immediately before deploy
        env:
          VALIDATED_SHA: ${{ needs.validate.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$VALIDATED_SHA"
          git fetch --no-tags --prune --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$VALIDATED_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 pinned 2026-10-01
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: firebase-migration/functions/package-lock.json
      - name: Build exact commit before cloud authentication
        working-directory: firebase-migration/functions
        run: |
          set -euo pipefail
          test "$(git -C ../.. rev-parse HEAD)" = "$GITHUB_SHA"
          npm ci
          npm test
          npm run build
          npm audit --omit=dev --audit-level=high
      - name: Require canonical publisher configuration before cloud changes
        env:
          PUBLISH_ACTIVE_RELEASE: ${{ inputs.publish_active_release }}
          AURORA_ACTIVE_RELEASE_PUBLIC_KEY: ${{ vars.AURORA_ACTIVE_RELEASE_PUBLIC_KEY }}
          AURORA_ACTIVE_RELEASE_PRIVATE_KEY: ${{ secrets.AURORA_ACTIVE_RELEASE_PRIVATE_KEY }}
          RELEASE_CI_RUN_ID: ${{ inputs.active_release_ci_run_id }}
          RELEASE_REVIEW_PR: ${{ inputs.active_release_review_pr }}
          RELEASE_PREVIOUS_SHA256: ${{ inputs.active_release_previous_sha256 }}
        run: |
          node - <<'NODE'
          const {createPrivateKey,createPublicKey}=require('node:crypto');
          const e=process.env,requested=e.PUBLISH_ACTIVE_RELEASE==='true',key=e.AURORA_ACTIVE_RELEASE_PUBLIC_KEY;
          if(key && !requested)throw Error('CANONICAL_RELEASE_PROMOTION_REQUIRED');
          if(requested){
            const publicKey=createPublicKey(key),privateKey=createPrivateKey(e.AURORA_ACTIVE_RELEASE_PRIVATE_KEY);
            if(publicKey.asymmetricKeyType!=='ed25519'||privateKey.asymmetricKeyType!=='ed25519'
              ||!publicKey.export({type:'spki',format:'der'}).equals(createPublicKey(privateKey).export({type:'spki',format:'der'})))throw Error('RELEASE_SIGNING_CONFIGURATION_REQUIRED');
            if(![e.RELEASE_CI_RUN_ID,e.RELEASE_REVIEW_PR].every(id=>/^[1-9][0-9]{0,19}$/.test(id||''))
              ||!(e.RELEASE_PREVIOUS_SHA256==='NONE'||/^[a-f0-9]{64}$/.test(e.RELEASE_PREVIOUS_SHA256||'')))throw Error('RELEASE_EVIDENCE_IDS_REQUIRED');
          }
          NODE
      - name: Require protected deployment configuration
        env:
          PROJECT_ID: ${{ inputs.project_id }}
          APPROVED_PROJECT: ${{ vars.FIREBASE_HML_PROJECT_ID }}
          WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
          SMOKE_UID: ${{ vars.FIREBASE_HML_SMOKE_UID }}
          SMOKE_EMAIL: ${{ vars.FIREBASE_HML_SMOKE_EMAIL }}
          AURORA_ACTIVE_RELEASE_PUBLIC_KEY: ${{ vars.AURORA_ACTIVE_RELEASE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          test -n "$APPROVED_PROJECT"
          test "$PROJECT_ID" = "$APPROVED_PROJECT"
          case "$PROJECT_ID" in wmgj-hml-jfn-*) ;; *) exit 41 ;; esac
          case "$PROJECT_ID" in *prod*|*production*|*live*|*principal*) exit 42 ;; esac
          test -n "$WIF_PROVIDER"
          test -n "$DEPLOY_SERVICE_ACCOUNT"
          [[ "$SMOKE_UID" =~ ^[A-Za-z0-9_-]{6,128}$ ]]
          [[ "$SMOKE_EMAIL" =~ ^[^@[:space:]]+@[^@[:space:]]+\.[^@[:space:]]+$ ]]
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2 pinned 2026-10-01
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2 pinned 2026-10-01
        with:
          version: "548.0.0"
          project_id: ${{ inputs.project_id }}
      - name: Inspect Eventarc IAM without changing access
        env:
          PROJECT_ID: ${{ inputs.project_id }}
          APPROVED_PROJECT: ${{ vars.FIREBASE_HML_PROJECT_ID }}
          DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test "$PROJECT_ID" = "$APPROVED_PROJECT"
          test "$(gcloud auth list --filter='status:ACTIVE' --format='value(account)')" = "$DEPLOY_SERVICE_ACCOUNT"
          project_number="$(gcloud projects describe "$PROJECT_ID" --format='value(projectNumber)')"
          umask 077
          review_root="$(mktemp -d "${RUNNER_TEMP}/aurora-iam-preflight.XXXXXX")"
          trap 'rm -rf -- "$review_root"' EXIT
          status=0
          python3 firebase-migration/scripts/repair-hml-eventarc-iam.py \
            --project "$PROJECT_ID" \
            --expected-project-number "$project_number" \
            --evidence-dir "$review_root/evidence" || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::HML_EVENTARC_IAM_REVIEW_REQUIRED: deploy stopped before Firebase CLI; use the reviewed administrative recovery procedure."
            exit "$status"
          fi
      - name: Preflight protected homologation resources
        env:
          DEPLOYMENT_MODE: ${{ inputs.deployment_mode || 'BOOTSTRAP' }}
          PROJECT_ID: ${{ inputs.project_id }}
          APPROVED_PROJECT: ${{ vars.FIREBASE_HML_PROJECT_ID }}
          DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
          SMOKE_UID: ${{ vars.FIREBASE_HML_SMOKE_UID }}
          SMOKE_EMAIL: ${{ vars.FIREBASE_HML_SMOKE_EMAIL }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$PROJECT_ID" = "$APPROVED_PROJECT"
          case "$DEPLOYMENT_MODE" in
            BOOTSTRAP|SHADOW_UPDATE) ;;
            *) echo "::error::HML_DEPLOYMENT_MODE_INVALID"; exit 44 ;;
          esac
          active_account="$(gcloud auth list --filter='status:ACTIVE' --format='value(account)')"
          test "$active_account" = "$DEPLOY_SERVICE_ACCOUNT"

          umask 077
          secrets_dir="$(mktemp -d "${RUNNER_TEMP}/aurora-secret-preflight.XXXXXX")"
          cleanup_secret_preflight() {
            find "$secrets_dir" -type f -delete
            rmdir "$secrets_dir"
          }
          trap cleanup_secret_preflight EXIT
          for secret in AURORA_NEXUS_ALLOWED_EMAILS AURORA_NEXUS_CSRF_HMAC_KEY; do
            gcloud secrets describe "$secret" --project "$PROJECT_ID" --format='value(name)' >/dev/null
            latest_version_json="$(
              gcloud secrets versions describe latest \
                --secret "$secret" \
                --project "$PROJECT_ID" \
                --format=json
            )"
            test "$(jq -r '.state // empty' <<<"$latest_version_json")" = "ENABLED"
            version_name="$(jq -r '.name // empty' <<<"$latest_version_json")"
            test -n "$version_name"
            version_id="${version_name##*/}"
            [[ "$version_id" =~ ^[0-9]+$ ]]
            secret_file="$secrets_dir/$secret"
            gcloud secrets versions access "$version_id" \
              --secret "$secret" \
              --project "$PROJECT_ID" \
              --out-file="$secret_file"
            test -s "$secret_file"

            case "$secret" in
              AURORA_NEXUS_ALLOWED_EMAILS)
                node -e '
                  const fs = require("node:fs");
                  const values = fs.readFileSync(process.argv[1], "utf8").split(/[\s,;]+/).filter(Boolean);
                  process.exit(values.some((value) => /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(value)) ? 0 : 1);
                ' "$secret_file"
                ;;
              AURORA_NEXUS_CSRF_HMAC_KEY)
                grep -Eq '^[A-Fa-f0-9]{64}$' "$secret_file"
                ;;
              *)
                exit 49
                ;;
            esac
          done

          node -e '
            const fs = require("node:fs");
            const allowed = fs.readFileSync(process.argv[1], "utf8")
              .split(/[\s,;]+/).map((value) => value.trim().toLowerCase()).filter(Boolean);
            const email = process.argv[2].trim().toLowerCase();
            process.exit(email && allowed.includes(email) ? 0 : 1);
          ' "$secrets_dir/AURORA_NEXUS_ALLOWED_EMAILS" "$SMOKE_EMAIL"
          smoke_uid="$SMOKE_UID"
          cleanup_secret_preflight
          trap - EXIT

          db_json="$(gcloud firestore databases describe --database='(default)' --project "$PROJECT_ID" --format=json)"
          test "$(jq -r '.locationId // empty' <<<"$db_json")" = "southamerica-east1"
          test "$(jq -r '.deleteProtectionState // empty' <<<"$db_json")" = "DELETE_PROTECTION_ENABLED"

          access_token="$(gcloud auth print-access-token)"
          test -n "$access_token"
          org_url="https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents/organizations/wmgj"
          org_json="$(curl --fail --silent --show-error --max-time 30 \
            -H "Authorization: Bearer ${access_token}" \
            "$org_url")"
          if ! jq -e --arg mode "$DEPLOYMENT_MODE" '
            .fields.active.booleanValue == true and
            .fields.environment.stringValue == "HOMOLOGATION" and
            (($mode == "BOOTSTRAP" and .fields.projectionEnabled.booleanValue == false) or
             ($mode == "SHADOW_UPDATE" and .fields.projectionEnabled.booleanValue == true)) and
            .fields.projectionMode.stringValue == "SHADOW" and
            .fields.organicEnabled.booleanValue == true and
            ([.fields.organicSectors.arrayValue.values[]?.stringValue] | index("AUDIT")) != null and
            ([.fields.organicSectors.arrayValue.values[]?.stringValue] | index("FINANCE")) != null and
            .fields.clinicalSensitiveEnabled.booleanValue == false and
            .fields.productionMutation.booleanValue == false and
            .fields.sourceMutation.booleanValue == false
          ' <<<"$org_json" >/dev/null; then
            echo "::error::HML_ORGANIZATION_STATE_MISMATCH mode=$DEPLOYMENT_MODE"
            exit 45
          fi

          smoke_uid_path="$(node -p 'encodeURIComponent(process.argv[1])' "$smoke_uid")"
          member_json="$(curl --fail --silent --show-error --max-time 30 \
            -H "Authorization: Bearer ${access_token}" \
            "${org_url}/members/${smoke_uid_path}")"
          member_role="$(jq -r '.fields.role.stringValue // empty' <<<"$member_json")"
          jq -e --arg role "$member_role" '
            .fields.active.booleanValue == true and
            .fields.allFacilities.booleanValue == true and
            (
              (["platform_admin", "org_admin", "director", "auditor", "operator", "finance", "viewer"] |
                index($role)) != null or
              ([.fields.permissions.arrayValue.values[]?.stringValue] |
                index("dashboard.read")) != null
            )
          ' <<<"$member_json" >/dev/null

          # BOOTSTRAP retains the original projection-off gate. SHADOW_UPDATE
          # is an explicitly approved update; it never toggles projection state.
          # Existing SHADOW data requires a READY backup no older than 24 hours.
          # Neither mode authorizes new ingestion or production promotion.
          test "$(jq -r '.pointInTimeRecoveryEnablement // empty' <<<"$db_json")" = "POINT_IN_TIME_RECOVERY_ENABLED"

          schedules_json="$(gcloud firestore backups schedules list \
            --database='(default)' --project "$PROJECT_ID" --format=json)"
          jq -e 'type == "array" and length >= 1' <<<"$schedules_json" >/dev/null

          backups_json="$(gcloud firestore backups list --project "$PROJECT_ID" --format=json)"
          backup_resource="$(jq -r --arg source "projects/${PROJECT_ID}/databases/(default)" '
            [.[] | select(.state == "READY" and .database == $source)]
            | sort_by(.snapshotTime // "")
            | last
            | .name // empty
          ' <<<"$backups_json")"
          if [ "$DEPLOYMENT_MODE" = "SHADOW_UPDATE" ] && [ -z "$backup_resource" ]; then
            echo "::error::HML_SHADOW_READY_BACKUP_REQUIRED"
            exit 46
          fi
          if [ -n "$backup_resource" ]; then
            backup_json="$(curl --fail --silent --show-error --max-time 30 \
              -H "Authorization: Bearer ${access_token}" \
              "https://firestore.googleapis.com/v1/${backup_resource}")"
            jq -e --arg name "$backup_resource" --arg source "projects/${PROJECT_ID}/databases/(default)" '
              .name == $name and
              .database == $source and
              .state == "READY" and
              ((.snapshotTime // "") | length > 0) and
              ((.expireTime // "") | length > 0)
            ' <<<"$backup_json" >/dev/null
            if [ "$DEPLOYMENT_MODE" = "SHADOW_UPDATE" ]; then
              backup_snapshot="$(jq -r '.snapshotTime' <<<"$backup_json")"
              backup_expiry="$(jq -r '.expireTime' <<<"$backup_json")"
              python3 - "$backup_snapshot" "$backup_expiry" <<'PY'
          from datetime import datetime, timezone
          import sys
          try:
              snapshot = datetime.fromisoformat(sys.argv[1].replace("Z", "+00:00"))
              expiry = datetime.fromisoformat(sys.argv[2].replace("Z", "+00:00"))
              now = datetime.now(timezone.utc)
              valid = (snapshot.tzinfo is not None and expiry.tzinfo is not None
                       and 0 <= (now - snapshot).total_seconds() <= 86400
                       and expiry > now)
          except (ValueError, TypeError, IndexError):
              valid = False
          if not valid:
              print("::error::HML_SHADOW_BACKUP_NOT_RECENT_OR_EXPIRED", file=sys.stderr)
              raise SystemExit(47)
          print("HML_SHADOW_BACKUP_RECENCY_VERIFIED")
          PY
            fi
          else
            echo "No READY managed backup yet; bootstrap allowed only for an operationally empty HML database."
          fi

          collections_json="$(curl --fail --silent --show-error --max-time 30 \
            -X POST \
            -H "Authorization: Bearer ${access_token}" \
            -H 'Content-Type: application/json' \
            --data '{"pageSize":100}' \
            "https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents:listCollectionIds")"
          jq -e '
            ([.collectionIds[]? | select(. != "organizations" and . != "platformRuntime")] | length) == 0
          ' <<<"$collections_json" >/dev/null
          if ! jq -e '(.nextPageToken // "") == ""' <<<"$collections_json" >/dev/null; then
            echo "::error::HML_ROOT_COLLECTIONS_INCOMPLETE"
            exit 48
          fi
      - name: Deploy Functions, Hosting, Rules and indexes
        working-directory: firebase-migration
        env:
          PROJECT_ID: ${{ inputs.project_id }}
          APPROVED_PROJECT: ${{ vars.FIREBASE_HML_PROJECT_ID }}
          VALIDATED_SHA: ${{ needs.validate.outputs.candidate_sha }}
          AURORA_ACTIVE_RELEASE_PUBLIC_KEY: ${{ vars.AURORA_ACTIVE_RELEASE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$PROJECT_ID" = "$APPROVED_PROJECT"
          test "$GITHUB_SHA" = "$VALIDATED_SHA"
          test "$(git -C .. rev-parse HEAD)" = "$VALIDATED_SHA"
          git -C .. fetch --no-tags --prune --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          test "$(git -C .. rev-parse refs/remotes/origin/main)" = "$VALIDATED_SHA"
          node scripts/verify-active-release-storage.mjs
          node - <<'NODE'
          const fs = require('node:fs');
          const {createPublicKey} = require('node:crypto');
          const key = process.env.AURORA_ACTIVE_RELEASE_PUBLIC_KEY;
          if (key) {
            if (createPublicKey(key).asymmetricKeyType !== 'ed25519') throw Error('INVALID_RELEASE_PUBLIC_KEY');
            fs.appendFileSync('functions/.env.' + process.env.PROJECT_ID, 'AURORA_ACTIVE_RELEASE_PUBLIC_KEY=' + JSON.stringify(key) + '\n');
          }
          NODE
          npx --yes firebase-tools@14.17.0 deploy --project "$PROJECT_ID" --only functions:runtimeWatchdog,functions:runtimeHealth,functions:auroraNexusAuthGate,functions:auroraNexusSessionLogin,functions:auroraNexusSessionLogout,functions:auroraNexusBootstrap,functions:auroraNexusNativeInsight,functions:auroraNexusMasterEngine,functions:auroraNexusAction,functions:auroraNexusRefresh,functions:auroraNexusProjectionEngine,functions:auroraNexusOrganic,functions:auroraNexusIntegrationKeys,functions:auroraNexusUserProfiles,functions:auroraNexusIntegrationPing,functions:auroraNexusIntegrationDocuments,functions:auroraNexusDocumentWatchdog,functions:auroraNexusShareholderReportGenerator,functions:auroraNexusShareholderReport,functions:auroraNexusDistributionDecision,hosting,firestore:rules,firestore:indexes --non-interactive
      - name: Smoke test private shell and deployed functions
        env:
          PROJECT_ID: ${{ inputs.project_id }}
        run: |
          set -euo pipefail
          functions="$(npx --yes firebase-tools@14.17.0 functions:list --project "$PROJECT_ID" --json)"
          jq -e --argjson expected '[
            "runtimeWatchdog",
            "runtimeHealth",
            "auroraNexusAuthGate",
            "auroraNexusSessionLogin",
            "auroraNexusSessionLogout",
            "auroraNexusBootstrap",
            "auroraNexusNativeInsight",
            "auroraNexusMasterEngine",
            "auroraNexusAction",
            "auroraNexusRefresh",
            "auroraNexusProjectionEngine",
            "auroraNexusOrganic",
            "auroraNexusIntegrationKeys",
            "auroraNexusUserProfiles",
            "auroraNexusIntegrationPing",
            "auroraNexusIntegrationDocuments",
            "auroraNexusDocumentWatchdog",
            "auroraNexusShareholderReportGenerator",
            "auroraNexusShareholderReport",
            "auroraNexusDistributionDecision"
          ]' '
            (.result // .functions // []) as $functions |
            [$functions[] | (.id // .name // "") | split("/")[-1]] as $deployed |
            all($expected[]; . as $name | $deployed | index($name) != null)
          ' <<<"$functions" >/dev/null
          shell="$(curl --fail --silent --show-error --max-time 30 "https://${PROJECT_ID}.web.app/")"
          grep -Fq "Ambiente privado" <<<"$shell"
          if grep -Fq "Centro de gestão WMGJ" <<<"$shell"; then
            echo "Protected shell was exposed without login" >&2
            exit 90
          fi
          negative_response="$(mktemp "${RUNNER_TEMP}/aurora-negative-smoke.XXXXXX.json")"
          trap 'rm -f "$negative_response"' EXIT
          bootstrap_status="$(curl --silent --show-error --max-time 30 \
            -H 'Accept: application/json' \
            --output "$negative_response" \
            --write-out '%{http_code}' \
            "https://${PROJECT_ID}.web.app/api/bootstrap")"
          test "$bootstrap_status" = "401"
          jq -e '.ok == false and .code == "AUTH_REQUIRED"' "$negative_response" >/dev/null
          native_status="$(curl --silent --show-error --max-time 30 \
            -H 'Accept: application/json' \
            --output "$negative_response" \
            --write-out '%{http_code}' \
            "https://${PROJECT_ID}.web.app/api/native-insight?intent=EXECUTIVE")"
          test "$native_status" = "401"
          jq -e '.ok == false and .code == "AUTH_REQUIRED"' "$negative_response" >/dev/null
          master_status="$(curl --silent --show-error --max-time 30 \
            -H 'Accept: application/json' \
            --output "$negative_response" \
            --write-out '%{http_code}' \
            "https://${PROJECT_ID}.web.app/api/master-engine")"
          test "$master_status" = "401"
          jq -e '.ok == false and .code == "AUTH_REQUIRED"' "$negative_response" >/dev/null
          organic_status="$(curl --silent --show-error --max-time 30 \
            -H 'Accept: application/json' \
            --output "$negative_response" \
            --write-out '%{http_code}' \
            "https://${PROJECT_ID}.web.app/organic?format=json")"
          test "$organic_status" = "401"
          jq -e '.ok == false and .code == "AUTH_REQUIRED"' "$negative_response" >/dev/null
          shareholder_status="$(curl --silent --show-error --max-time 30 \
            -H 'Accept: application/json' \
            --output "$negative_response" \
            --write-out '%{http_code}' \
            "https://${PROJECT_ID}.web.app/reports/shareholders?format=json&competence=2026-10")"
          test "$shareholder_status" = "401"
          jq -e '.ok == false and .code == "AUTH_REQUIRED"' "$negative_response" >/dev/null
          distribution_status="$(curl --silent --show-error --max-time 30 \
            -X POST \
            -H 'Content-Type: application/json' \
            --data '{"competence":"2026-10","snapshotHash":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","decision":"REJECT","reason":"negative smoke","expectedRevision":0}' \
            --output "$negative_response" \
            --write-out '%{http_code}' \
            "https://${PROJECT_ID}.web.app/api/distribution-approval")"
          test "$distribution_status" = "401"
          jq -e '.ok == false and .code == "AUTH_REQUIRED"' "$negative_response" >/dev/null
      - name: Verify user profile API rejects anonymous access
        env:
          PROJECT_ID: ${{ inputs.project_id }}
        run: |
          set -euo pipefail
          for method in GET POST; do
            status="$(curl --silent --show-error --max-time 30 --output /dev/null --write-out '%{http_code}' --request "$method" "https://${PROJECT_ID}.web.app/api/user-profiles")"
            test "$status" = "401"
          done

      - name: Authenticated smoke test without stored password
        env:
          PROJECT_ID: ${{ inputs.project_id }}
          DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
          SMOKE_UID: ${{ vars.FIREBASE_HML_SMOKE_UID }}
          SMOKE_EMAIL: ${{ vars.FIREBASE_HML_SMOKE_EMAIL }}
        run: |
          set -euo pipefail
          [[ "$SMOKE_UID" =~ ^[A-Za-z0-9_-]{6,128}$ ]]
          [[ "$SMOKE_EMAIL" =~ ^[^@[:space:]]+@[^@[:space:]]+\.[^@[:space:]]+$ ]]
          umask 077
          smoke_dir="$(mktemp -d "${RUNNER_TEMP}/aurora-auth-smoke.XXXXXX")"
          claims_file="$smoke_dir/custom-token-claims.json"
          custom_token_file="$smoke_dir/custom-token.jwt"
          auth_payload="$smoke_dir/auth-payload.json"
          auth_response="$smoke_dir/auth-response.json"
          session_payload="$smoke_dir/session-payload.json"
          cookie_jar="$smoke_dir/cookies.txt"
          private_shell="$smoke_dir/private-shell.html"
          bootstrap_response="$smoke_dir/bootstrap.json"
          native_response="$smoke_dir/native.json"
          master_response="$smoke_dir/master.json"
          organic_response="$smoke_dir/organic.json"
          cleanup() {
            find "$smoke_dir" -type f -delete
            rmdir "$smoke_dir"
          }
          trap cleanup EXIT

          access_token="$(gcloud auth print-access-token)"
          apps_json="$(curl --fail --silent --show-error --max-time 30 \
            -H "Authorization: Bearer ${access_token}" \
            "https://firebase.googleapis.com/v1beta1/projects/${PROJECT_ID}/webApps?pageSize=100")"
          app_name="$(jq -r '
            [.apps[]? | select(.state == "ACTIVE")] | first | .name // empty
          ' <<<"$apps_json")"
          test -n "$app_name"
          web_config="$(curl --fail --silent --show-error --max-time 30 \
            -H "Authorization: Bearer ${access_token}" \
            "https://firebase.googleapis.com/v1beta1/${app_name}/config")"
          api_key="$(jq -r '.apiKey // empty' <<<"$web_config")"
          [[ "$api_key" =~ ^[A-Za-z0-9_-]{20,200}$ ]]

          now="$(date +%s)"
          exp="$((now + 3000))"
          jq -nc \
            --arg iss "$DEPLOY_SERVICE_ACCOUNT" \
            --arg sub "$DEPLOY_SERVICE_ACCOUNT" \
            --arg uid "$SMOKE_UID" \
            --arg aud "https://identitytoolkit.googleapis.com/google.identity.identitytoolkit.v1.IdentityToolkit" \
            --argjson iat "$now" \
            --argjson exp "$exp" \
            '{iss:$iss,sub:$sub,aud:$aud,iat:$iat,exp:$exp,uid:$uid}' > "$claims_file"
          gcloud iam service-accounts sign-jwt "$claims_file" "$custom_token_file" \
            --iam-account "$DEPLOY_SERVICE_ACCOUNT" \
            --project "$PROJECT_ID" >/dev/null
          custom_token="$(cat "$custom_token_file")"
          test -n "$custom_token"

          jq -nc --arg token "$custom_token" '{token:$token,returnSecureToken:true}' > "$auth_payload"
          curl --fail --silent --show-error --max-time 30 \
            -H 'Content-Type: application/json' \
            --data-binary @"$auth_payload" \
            --output "$auth_response" \
            "https://identitytoolkit.googleapis.com/v1/accounts:signInWithCustomToken?key=${api_key}"
          # signInWithCustomToken does not return localId. Validate identity server-side.
          if ! id_token="$(jq -er '.idToken | select(type == "string" and length > 0)' "$auth_response")"; then
            echo "::error::AUTH_ID_TOKEN_MISSING_OR_INVALID"
            exit 72
          fi
          printf '::add-mask::%s\n' "$id_token"
          lookup_dir="$smoke_dir"
          umask 077
          printf '%s' "$id_token" | jq -Rs '{idToken:.}' > "$lookup_dir/account-lookup-in.json"
          if ! lookup_code="$(curl --silent --show-error --max-time 30 \
            -H 'Content-Type: application/json' \
            --data-binary @"$lookup_dir/account-lookup-in.json" \
            -o "$lookup_dir/account-lookup-out.json" -w '%{http_code}' \
            "https://identitytoolkit.googleapis.com/v1/accounts:lookup?key=${api_key}")"; then
            echo "::error::AUTH_ACCOUNT_LOOKUP_TRANSPORT_FAILED"
            exit 73
          fi
          if [ "$lookup_code" != "200" ]; then
            echo "::error::AUTH_ACCOUNT_LOOKUP_HTTP=$lookup_code"
            exit 74
          fi
          if ! jq -e --arg uid "$SMOKE_UID" '
            (.users | type == "array" and length == 1) and
            (.users[0].localId == $uid) and
            (.users[0].disabled != true)
          ' "$lookup_dir/account-lookup-out.json" >/dev/null; then
            echo "::error::AUTH_SMOKE_ACCOUNT_INVALID"
            exit 75
          fi
          echo "AUTH_SMOKE_UID_VERIFIED"

          base_url="https://${PROJECT_ID}.web.app"
          jq -nc --arg idToken "$id_token" '{idToken:$idToken}' > "$session_payload"
          curl --fail --silent --show-error --max-time 30 \
            -X POST \
            -H 'Content-Type: application/json' \
            -H "Origin: ${base_url}" \
            -H 'Sec-Fetch-Site: same-origin' \
            --cookie-jar "$cookie_jar" \
            --data-binary @"$session_payload" \
            --output /dev/null \
            "${base_url}/__sessionLogin"
          # Tenant paths authorize membership, then converge the browser to /portal.
          tenant_redirect_headers="$smoke_dir/tenant-redirect.headers"
          tenant_status="$(curl --silent --show-error --max-time 30 \
            --cookie "$cookie_jar" \
            --output /dev/null \
            --dump-header "$tenant_redirect_headers" \
            --write-out '%{http_code}' \
            "${base_url}/wmgj")"
          if [ "$tenant_status" != "303" ]; then
            echo "::error::AUTH_TENANT_REDIRECT_HTTP=$tenant_status"
            exit 91
          fi
          if ! grep -Eiq '^location:[[:space:]]*/portal[[:space:]]*$' "$tenant_redirect_headers"; then
            echo "::error::AUTH_TENANT_REDIRECT_LOCATION_MISMATCH"
            exit 91
          fi
          private_status="$(curl --fail --silent --show-error --max-time 30 \
            --cookie "$cookie_jar" \
            --output "$private_shell" \
            --write-out '%{http_code}' \
            "${base_url}/portal")"
          if [ "$private_status" != "200" ]; then
            echo "::error::AUTH_PRIVATE_SHELL_HTTP=$private_status"
            exit 91
          fi
          if ! grep -Fq "Centro de gestão WMGJ" "$private_shell"; then
            echo "::error::AUTH_PRIVATE_SHELL_CONTENT_MISMATCH"
            exit 91
          fi
          if grep -Fq "Ambiente privado" "$private_shell"; then
            echo "Authenticated smoke remained on the login shell" >&2
            exit 91
          fi
          echo "AUTH_PRIVATE_SHELL_VERIFIED"
          curl --fail --silent --show-error --max-time 30 \
            -H 'Accept: application/json' \
            --cookie "$cookie_jar" \
            --output "$bootstrap_response" \
            "${base_url}/api/bootstrap"
          jq -e --arg email "$SMOKE_EMAIL" '
            .ok == true and
            .environment == "HOMOLOGATION" and
            .mode == "SHADOW" and
            .organization.id == "wmgj" and
            .member.email == $email
          ' "$bootstrap_response" >/dev/null
          jq -e '
            .release.productVersion == "1.0.0-rc.1" and
            (.release.engineeringReadinessPercent | type) == "number"
          ' "$bootstrap_response" >/dev/null
          native_status="$(curl --silent --show-error --max-time 30 \
            -H 'Accept: application/json' \
            --cookie "$cookie_jar" \
            --output "$native_response" \
            --write-out '%{http_code}' \
            "${base_url}/api/native-insight?intent=EXECUTIVE")"
          case "$native_status" in
            200)
              jq -e '
                .ok == true and
                .environment == "HOMOLOGATION" and
                .mode == "FIREBASE_NATIVE" and
                .sourceAccessDuringInference == false and
                .externalAiUsed == false and
                .insight.engine == "AURORA_NATIVE_INTELLIGENCE" and
                .insight.mode == "FIREBASE_NATIVE_DETERMINISTIC" and
                .insight.externalProviderUsed == false
              ' "$native_response" >/dev/null
              ;;
            409)
              jq -e '
                .ok == false and
                (.code == "FIREBASE_NATIVE_SNAPSHOT_REQUIRED" or .code == "FIREBASE_NATIVE_CONTRACT_REQUIRED")
              ' "$native_response" >/dev/null
              ;;
            *)
              cat "$native_response" >&2
              exit 92
              ;;
          esac
          master_status="$(curl --silent --show-error --max-time 30 \
            -H 'Accept: application/json' \
            --cookie "$cookie_jar" \
            --output "$master_response" \
            --write-out '%{http_code}' \
            "${base_url}/api/master-engine")"
          case "$master_status" in
            200)
              jq -e '
                .ok == true and
                .environment == "HOMOLOGATION" and
                .mode == "AURORA_MASTER_NATIVE" and
                .sourceAccessDuringInference == false and
                .externalAiUsed == false and
                .master.engine == "AURORA_MASTER_OPERATIONAL_ENGINE" and
                .master.externalProviderUsed == false and
                .master.externalAiRequired == false and
                .master.governance.autonomousSourceMutation == false and
                .master.governance.autonomousFinancialMovement == false and
                .master.governance.arbitraryCodeExecution == false
              ' "$master_response" >/dev/null
              ;;
            409)
              jq -e '
                .ok == false and
                (.code == "FIREBASE_NATIVE_SNAPSHOT_REQUIRED" or .code == "FIREBASE_NATIVE_CONTRACT_REQUIRED")
              ' "$master_response" >/dev/null
              ;;
            *)
              cat "$master_response" >&2
              exit 96
              ;;
          esac
          curl --fail --silent --show-error --max-time 30 \
            -H 'Accept: application/json' \
            --cookie "$cookie_jar" \
            --output "$organic_response" \
            "${base_url}/organic?format=json"
          jq -e '
            .ok == true and
            .environment == "HOMOLOGATION" and
            .mode == "SHADOW" and
            .enabled == true and
            (.sectors | index("AUDIT")) != null and
            (.sectors | index("FINANCE")) != null
          ' "$organic_response" >/dev/null
          if [ '${{ inputs.publish_active_release }}' = 'true' ]; then
            curl --fail --silent --show-error --max-time 30 -X POST \
              -H 'Content-Type: application/json' -H 'Origin: https://auroranexus.com.br' \
              -H 'Sec-Fetch-Site: same-origin' --cookie-jar "$smoke_dir/canonical-cookies.txt" \
              --data-binary @"$session_payload" --output /dev/null \
              'https://auroranexus.com.br/__sessionLogin'
            curl --fail --silent --show-error --max-time 30 \
              --cookie "$smoke_dir/canonical-cookies.txt" -H 'Accept: application/json' \
              --output "$smoke_dir/canonical-bootstrap.json" \
              'https://auroranexus.com.br/api/bootstrap'
            jq -e --arg sha "$GITHUB_SHA" '
              .ok == true and .organization.id == "wmgj" and
              .canonicalVersion.runtimeBuild.sourceSha == $sha and
              .canonicalVersion.runtimeBuild.fileIntegrityVerified == true and
              .canonicalVersion.runtimeBuildWeb.sourceSha == $sha and
              .canonicalVersion.runtimeBuildWeb.fileIntegrityVerified == true
            ' "$smoke_dir/canonical-bootstrap.json" >/dev/null
            jq '{sourceSha:.canonicalVersion.runtimeBuild.sourceSha,
              serverManifestSha256:.canonicalVersion.runtimeBuild.manifestSha256,
              webManifestSha256:.canonicalVersion.runtimeBuildWeb.manifestSha256}' \
              "$smoke_dir/canonical-bootstrap.json" > "$RUNNER_TEMP/aurora-canonical-runtime-smoke.json"
          fi
      - name: Verify canonical source-bound runtime
        if: ${{ inputs.publish_active_release }}
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const proof=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/aurora-canonical-runtime-smoke.json','utf8'));
          if(proof.sourceSha!==process.env.EXPECTED_SHA)throw Error('CANONICAL_SOURCE_CONFLICT');
          for(const component of ['server','web']){
            const bytes=fs.readFileSync('firebase-migration/functions/runtime-release/'+component+'-manifest.json');
            if(crypto.createHash('sha256').update(bytes).digest('hex')!==proof[component+'ManifestSha256'])throw Error('CANONICAL_MANIFEST_CONFLICT');
          }
          console.log('CANONICAL_SOURCE_BOUND_RUNTIME_VERIFIED');
          NODE
      - name: Preserve exact release manifests
        if: ${{ inputs.publish_active_release }}
        uses: actions/upload-artifact@v4
        with:
          name: aurora-active-release-manifests-${{ github.sha }}
          path: firebase-migration/functions/runtime-release/*-manifest.json
          if-no-files-found: error
          retention-days: 14

  publish-active-release:
    name: Publish verified canonical active release
    if: ${{ inputs.publish_active_release && inputs.deploy_confirmation == 'DEPLOY_HOMOLOGATION' }}
    needs: [validate, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: firebase-homologation
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Build reviewed publisher
        working-directory: firebase-migration/functions
        run: |
          npm ci --ignore-scripts
          npm run build
      - uses: actions/download-artifact@v4
        with:
          name: aurora-active-release-manifests-${{ github.sha }}
          path: firebase-migration/functions/runtime-release
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
      - name: Publish exact reviewed release with compare-and-swap
        env:
          GH_TOKEN: ${{ github.token }}
          GCLOUD_PROJECT: ${{ inputs.project_id }}
          AURORA_ACTIVE_RELEASE_SHA: ${{ github.sha }}
          AURORA_ACTIVE_RELEASE_PUBLIC_KEY: ${{ vars.AURORA_ACTIVE_RELEASE_PUBLIC_KEY }}
          AURORA_ACTIVE_RELEASE_PRIVATE_KEY: ${{ secrets.AURORA_ACTIVE_RELEASE_PRIVATE_KEY }}
          AURORA_ACTIVE_RELEASE_CI_RUN_ID: ${{ inputs.active_release_ci_run_id }}
          AURORA_ACTIVE_RELEASE_DEPLOY_RUN_ID: ${{ github.run_id }}
          AURORA_ACTIVE_RELEASE_REVIEW_PR: ${{ inputs.active_release_review_pr }}
          AURORA_ACTIVE_RELEASE_PREVIOUS_SHA256: ${{ inputs.active_release_previous_sha256 }}
          AURORA_ACTIVE_RELEASE_SERVER_MANIFEST: firebase-migration/functions/runtime-release/server-manifest.json
          AURORA_ACTIVE_RELEASE_WEB_MANIFEST: firebase-migration/functions/runtime-release/web-manifest.json
          AURORA_ACTIVE_RELEASE_SATELLITE_MANIFEST: firebase-migration/functions/runtime-release/satellite-manifest.json
        run: |
          export AURORA_ACTIVE_RELEASE_PRODUCT_VERSION="$(node -p "require('./firebase-migration/functions/lib/auroraReleaseStatus.js').AURORA_PRODUCT_VERSION")"
          node firebase-migration/scripts/publish-active-release.mjs
