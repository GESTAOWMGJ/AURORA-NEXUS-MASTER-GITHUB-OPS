name: Validate Firestore Migration

on:
  pull_request:
    paths:
      - "firebase-migration/**"
      - ".github/workflows/validate-firestore-migration.yml"
      - ".github/workflows/deploy-aurora-firebase.yml"
  push:
    branches:
      - main
      - feat/firestore-migration-foundation-20260826
    paths:
      - "firebase-migration/**"
      - ".github/workflows/validate-firestore-migration.yml"
      - ".github/workflows/deploy-aurora-firebase.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-firestore-migration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and test without deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            firebase-migration/functions/package-lock.json
            firebase-migration/tests/package-lock.json

      - name: Set up Java for Emulator Suite
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.33"
          enable-cache: true
          cache-dependency-glob: firebase-migration/api/uv.lock

      - name: Validate configuration and controlled launcher
        shell: bash
        run: |
          set -euo pipefail
          bash -n firebase-migration/scripts/bootstrap-homologacao.sh
          bash -n firebase-migration/scripts/PROVISIONAR_FIREBASE_HOMOLOGACAO.command

          launcher="firebase-migration/scripts/PROVISIONAR_FIREBASE_HOMOLOGACAO.command"
          grep -Fq 'BLOCKED_NON_INTERACTIVE' "$launcher"
          grep -Fq 'PREFIX="wmgj-hml-jfn"' "$launcher"
          grep -Fq 'PRODUCTION_AUTHORIZED=NO' "$launcher"
          grep -Fq 'set_env WMGJ_FIRESTORE_DRY_RUN true' "$launcher"
          grep -Fq 'clinicalSensitiveEnabled":false' "$launcher"
          grep -Fq 'productionMutation":false' "$launcher"
          grep -Fq 'sourceMutation":false' "$launcher"
          grep -Fq 'delete protection ENABLED' "$launcher"
          grep -Fq 'requestNonces' "$launcher"

          if grep -Eq 'firestore:delete|billing projects unlink|projects delete|rm -rf' "$launcher"; then
            echo "Destructive command is forbidden in controlled homologation launcher" >&2
            exit 1
          fi

          node - <<'NODE'
          const fs = require("node:fs");
          const files = [
            "firebase-migration/firebase.json",
            "firebase-migration/firestore/firestore.indexes.json",
            "firebase-migration/functions/package.json",
            "firebase-migration/functions/package-lock.json",
            "firebase-migration/functions/tsconfig.json",
            "firebase-migration/tests/package.json",
            "firebase-migration/tests/package-lock.json",
            "firebase-migration/policy/aurora-nexus-source-2.3.0.json",
            "firebase-migration/policy/aurora-nexus-policy.sanitized.json",
            "firebase-migration/policy/manifest.json",\n            "firebase-migration/policy/security-baseline-v1.json"
          ];
          for (const file of files) {
            JSON.parse(fs.readFileSync(file, "utf8"));
          }
          console.log("FIRESTORE_CONFIG_JSON_OK");
          NODE

          echo '9a8f7f291be65c0ef1feba043592452b77bef03e965198ca451f0044703a6d8f  firebase-migration/policy/aurora-nexus-source-2.3.0.json' | sha256sum -c -
          echo '077e7cbf4c60e578dee971ce5af5f847c773ba35c7b8beb020caa7cb6af971a7  firebase-migration/policy/aurora-nexus-policy.sanitized.json' | sha256sum -c -\n          node firebase-migration/scripts/validate-security-baseline.mjs | grep -F 'AURORA_SECURITY_BASELINE_OK'

      - name: Build Functions and run Security Rules tests
        env:
          WMGJ_FIREBASE_TEST_PROJECT_ID: wmgj-firestore-rules-test
        run: bash firebase-migration/scripts/bootstrap-homologacao.sh

      - name: Block high or critical production dependency advisories
        working-directory: firebase-migration/functions
        run: npm audit --omit=dev --audit-level=high

      - name: Validate FastAPI, OpenAI contracts and dashboard
        working-directory: firebase-migration/api
        run: |
          uv sync --locked --dev
          uv run pytest
          uv run python scripts/run_evals.py
          node --check wmgj_api/static/dashboard.js
          node --test tests/static/dashboard_static.test.mjs

      - name: Confirm validation-only workflow
        run: |
          if grep -Eq 'firebase[[:space:]]+deploy|fastapi[[:space:]]+deploy' .github/workflows/validate-firestore-migration.yml; then
            echo "Deploy command is forbidden in validation workflow" >&2
            exit 1
          fi
          echo "VALIDATION_ONLY_OK"
